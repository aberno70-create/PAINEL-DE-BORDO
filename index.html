function ControleFretes() {
  const { config, atualizarConfig } = useConfig();
  useEffect(() => { document.title = `${config.nomeEmpresa} · Painel de Bordo`; }, [config.nomeEmpresa]);
  const registrarCaminhaoSeNovo = (placa) => {
    const nome = (placa || "").trim();
    if (!nome || config.caminhoes.includes(nome)) return;
    atualizarConfig({ ...config, caminhoes: [...config.caminhoes, nome] });
  };
  const [tab, setTab] = useState("dashboard");
  const [fretes, setFretes] = useState(() => lsGet(LS_KEYS.fretes) || []);
  const [custos, setCustos] = useState(() => lsGet(LS_KEYS.custos) || []);
  const [creditos, setCreditos] = useState(() => lsGet(LS_KEYS.creditos) || []);

  // Pasta de armazenamento (opcional): quando conectada, os dados passam a ser gravados
  // também num arquivo dentro dela — sem o limite de poucos MB do navegador. Se a pasta for
  // sincronizada com a nuvem (Google Drive, OneDrive, Dropbox), o mesmo arquivo pode ser
  // reaberto por este HTML em outro computador, já com os dados atualizados.
  const [pastaHandle, setPastaHandle] = useState(null);
  const [pastaNome, setPastaNome] = useState(null);
  const [pastaPrecisaReconectar, setPastaPrecisaReconectar] = useState(false);
  const [pastaStatus, setPastaStatus] = useState("");
  // Trava de segurança: enquanto a leitura do arquivo da pasta não termina, a escrita fica
  // bloqueada — evita que dados locais desatualizados sobrescrevam o que já está salvo lá.
  const [pastaCarregada, setPastaCarregada] = useState(false);

  useEffect(() => {
    if (!suportaPastaLocal) return;
    (async () => {
      const handle = await idbCarregarPasta();
      if (!handle) return;
      setPastaNome(handle.name);
      try {
        const permissao = await handle.queryPermission({ mode: "readwrite" });
        if (permissao === "granted") {
          const dados = await pastaLerDados(handle);
          if (dados) {
            if (dados.fretes) setFretes(dados.fretes);
            if (dados.custos) setCustos(dados.custos);
            if (dados.creditos) setCreditos(dados.creditos);
            if (dados.config) atualizarConfig(dados.config);
          }
          setPastaCarregada(true);
          setPastaHandle(handle);
        } else {
          setPastaPrecisaReconectar(true);
        }
      } catch (e) {
        setPastaPrecisaReconectar(true);
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Segunda trava de segurança: depois que a pasta já mostrou ter dados de verdade, o app
  // nunca mais escreve um arquivo vazio nela — se o estado local zerar por algum motivo
  // inesperado, a sincronização para e avisa, em vez de apagar o que já estava salvo.
  const pastaTeveDadosRef = useRef(false);

  // Sincroniza com a pasta sempre que algo muda (com um pequeno atraso, pra não escrever a
  // cada tecla digitada). Se a escrita falhar (ex.: pendrive foi removido), avisa mas não
  // trava o app — os dados continuam disponíveis normalmente neste navegador.
  useEffect(() => {
    if (!pastaHandle || !pastaCarregada) return;
    const temDadosAgora = fretes.length > 0 || custos.length > 0 || creditos.length > 0;
    if (temDadosAgora) pastaTeveDadosRef.current = true;
    if (!temDadosAgora && pastaTeveDadosRef.current) {
      setPastaStatus("bloqueado");
      return;
    }
    const timer = setTimeout(async () => {
      try {
        setPastaStatus("sincronizando");
        await pastaEscreverDados(pastaHandle, { fretes, custos, creditos, config, salvoEm: new Date().toISOString() });
        setPastaStatus("sincronizado");
      } catch (e) {
        setPastaStatus("erro");
      }
    }, 800);
    return () => clearTimeout(timer);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [fretes, custos, creditos, config, pastaHandle, pastaCarregada]);

  // Dropbox: funciona em qualquer navegador (inclusive Safari no iPhone), porque conecta
  // direto na conta pela internet, sem depender de recurso nenhum do navegador.
  const [dropboxConectado, setDropboxConectado] = useState(() => dropboxEstaConectado());
  const [dropboxCarregado, setDropboxCarregado] = useState(false);
  const [dropboxStatus, setDropboxStatus] = useState("");
  const dropboxTeveDadosRef = useRef(false);

  // Ao voltar do login do Dropbox, a URL traz ?code=... — troca pelo token e recarrega os
  // dados que já estiverem salvos lá, antes de liberar qualquer escrita.
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    if (!code) return;
    (async () => {
      const ok = await dropboxTrocarCodigoPorToken(code);
      window.history.replaceState({}, "", dropboxRedirectUri());
      if (!ok) return;
      setDropboxConectado(true);
      try {
        const dados = await dropboxLerDados();
        const dropboxTemDados = dados && ((dados.fretes && dados.fretes.length) || (dados.custos && dados.custos.length));
        const navegadorTemDados = fretes.length > 0 || custos.length > 0;
        if (dropboxTemDados && navegadorTemDados) {
          const usarDoDropbox = window.confirm(
            `Encontrei dados nos dois lugares:\n\n` +
            `• No Dropbox: ${(dados.fretes || []).length} fretes e ${(dados.custos || []).length} custos` +
            `${dados.salvoEm ? " (salvo em " + new Date(dados.salvoEm).toLocaleString("pt-BR") + ")" : ""}.\n` +
            `• Aberto agora neste navegador: ${fretes.length} fretes e ${custos.length} custos.\n\n` +
            "OK = usar os dados DO DROPBOX (substitui o que está aberto agora no navegador).\n" +
            "Cancelar = manter o que está aberto agora no navegador (substitui o arquivo do Dropbox por estes dados)."
          );
          if (usarDoDropbox) {
            if (dados.fretes) setFretes(dados.fretes);
            if (dados.custos) setCustos(dados.custos);
            if (dados.creditos) setCreditos(dados.creditos);
            if (dados.config) atualizarConfig(dados.config);
          }
        } else if (dropboxTemDados && !navegadorTemDados) {
          if (dados.fretes) setFretes(dados.fretes);
          if (dados.custos) setCustos(dados.custos);
          if (dados.creditos) setCreditos(dados.creditos);
          if (dados.config) atualizarConfig(dados.config);
        }
      } catch (e) {}
      setDropboxCarregado(true);
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Se já estava conectado de uma sessão anterior, carrega os dados mais recentes do Dropbox
  // assim que o app abre, antes de liberar a escrita.
  useEffect(() => {
    if (!dropboxEstaConectado()) return;
    (async () => {
      try {
        const dados = await dropboxLerDados();
        if (dados) {
          if (dados.fretes) setFretes(dados.fretes);
          if (dados.custos) setCustos(dados.custos);
          if (dados.creditos) setCreditos(dados.creditos);
          if (dados.config) atualizarConfig(dados.config);
        }
      } catch (e) {}
      setDropboxCarregado(true);
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Mesmas duas travas de segurança da pasta local: só escreve depois de carregar, e nunca
  // grava um arquivo vazio por cima de dados que já existiam.
  useEffect(() => {
    if (!dropboxConectado || !dropboxCarregado) return;
    const temDadosAgora = fretes.length > 0 || custos.length > 0 || creditos.length > 0;
    if (temDadosAgora) dropboxTeveDadosRef.current = true;
    if (!temDadosAgora && dropboxTeveDadosRef.current) {
      setDropboxStatus("bloqueado");
      return;
    }
    const timer = setTimeout(async () => {
      try {
        setDropboxStatus("sincronizando");
        await dropboxEscreverDados({ fretes, custos, creditos, config, salvoEm: new Date().toISOString() });
        setDropboxStatus("sincronizado");
      } catch (e) {
        setDropboxStatus("erro");
      }
    }, 800);
    return () => clearTimeout(timer);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [fretes, custos, creditos, config, dropboxConectado, dropboxCarregado]);

  const desconectarDropbox = () => {
    dropboxDesconectar();
    setDropboxConectado(false);
    setDropboxCarregado(false);
    setDropboxStatus("");
    dropboxTeveDadosRef.current = false;
  };

  const conectarPasta = async () => {
    try {
      const handle = await window.showDirectoryPicker({ mode: "readwrite" });
      await idbSalvarPasta(handle);
      const dados = await pastaLerDados(handle);
      const pastaTemDados = dados && ((dados.fretes && dados.fretes.length) || (dados.custos && dados.custos.length));
      const navegadorTemDados = fretes.length > 0 || custos.length > 0;
      if (pastaTemDados && navegadorTemDados) {
        // Os dois lados têm lançamentos — nunca decide sozinho qual usar; mostra quantos tem
        // de cada lado para a escolha ser informada, não um "OK ou Cancelar" às cegas.
        const usarDaPasta = window.confirm(
          `Encontrei dados nos dois lugares:\n\n` +
          `• Nesta pasta: ${(dados.fretes || []).length} fretes e ${(dados.custos || []).length} custos` +
          `${dados.salvoEm ? " (salvo em " + new Date(dados.salvoEm).toLocaleString("pt-BR") + ")" : ""}.\n` +
          `• Aberto agora neste navegador: ${fretes.length} fretes e ${custos.length} custos.\n\n` +
          "OK = usar os dados DESTA PASTA (substitui o que está aberto agora no navegador).\n" +
          "Cancelar = manter o que está aberto agora no navegador (substitui o arquivo da pasta por estes dados)."
        );
        if (usarDaPasta) {
          if (dados.fretes) setFretes(dados.fretes);
          if (dados.custos) setCustos(dados.custos);
          if (dados.creditos) setCreditos(dados.creditos);
          if (dados.config) atualizarConfig(dados.config);
        }
      } else if (pastaTemDados && !navegadorTemDados) {
        // Navegador está vazio e a pasta já tem dados de verdade — carrega sem perguntar,
        // não há nada no navegador que se perderia com isso.
        if (dados.fretes) setFretes(dados.fretes);
        if (dados.custos) setCustos(dados.custos);
        if (dados.creditos) setCreditos(dados.creditos);
        if (dados.config) atualizarConfig(dados.config);
      }
      // Se a pasta estiver vazia (ou sem arquivo ainda), não pergunta nada — só passa a
      // gravar o que já está aberto no navegador a partir de agora.
      setPastaCarregada(true);
      setPastaHandle(handle);
      setPastaNome(handle.name);
      setPastaPrecisaReconectar(false);
      setSaveError(null);
    } catch (e) {
      // usuário cancelou o seletor de pasta — não faz nada
    }
  };
  const reconectarPasta = async () => {
    const handle = await idbCarregarPasta();
    if (!handle) return;
    try {
      const permissao = await handle.requestPermission({ mode: "readwrite" });
      if (permissao === "granted") {
        setPastaNome(handle.name);
        const dados = await pastaLerDados(handle);
        if (dados) {
          if (dados.fretes) setFretes(dados.fretes);
          if (dados.custos) setCustos(dados.custos);
          if (dados.creditos) setCreditos(dados.creditos);
          if (dados.config) atualizarConfig(dados.config);
        }
        setPastaCarregada(true);
        setPastaHandle(handle);
        setPastaPrecisaReconectar(false);
        setSaveError(null);
      }
    } catch (e) {}
  };
  const desconectarPasta = async () => {
    await idbRemoverPasta();
    setPastaHandle(null);
    setPastaNome(null);
    setPastaPrecisaReconectar(false);
    setPastaCarregada(false);
    setPastaStatus("");
  };

  const [showAddFrete, setShowAddFrete] = useState(false);
  const [showAddCusto, setShowAddCusto] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [saveError, setSaveError] = useState("");
  const [periodo, setPeriodo] = useState("todos");
  const [dataInicio, setDataInicio] = useState("");
  const [dataFim, setDataFim] = useState("");
  const [freteAberto, setFreteAberto] = useState(null);
  const [custoFreteId, setCustoFreteId] = useState(null);
  const [imagemAmpliada, setImagemAmpliada] = useState(null);
  const [custoAberto, setCustoAberto] = useState(null);
  const [pagamentoAlvo, setPagamentoAlvo] = useState(null);
  const [parcelaAlvo, setParcelaAlvo] = useState(null);
  const [dataPagamentoAlvo, setDataPagamentoAlvo] = useState(null);

  const persistFretes = useCallback((next) => {
    setFretes(next);
    if (!lsSet(LS_KEYS.fretes, next) && !pastaHandle && !dropboxConectado) setSaveError("Não consegui salvar este lançamento — o navegador está sem espaço de armazenamento. Abra Configurações para exportar um backup, liberar espaço ou conectar uma pasta/Dropbox sem limite de tamanho.");
  }, [pastaHandle, dropboxConectado]);
  const persistCustos = useCallback((next) => {
    setCustos(next);
    if (!lsSet(LS_KEYS.custos, next) && !pastaHandle && !dropboxConectado) setSaveError("Não consegui salvar este lançamento — o navegador está sem espaço de armazenamento. Abra Configurações para exportar um backup, liberar espaço ou conectar uma pasta/Dropbox sem limite de tamanho.");
  }, [pastaHandle, dropboxConectado]);
  const persistCreditos = useCallback((next) => {
    setCreditos(next);
    if (!lsSet(LS_KEYS.creditos, next) && !pastaHandle && !dropboxConectado) setSaveError("Não consegui salvar este lançamento — o navegador está sem espaço de armazenamento. Abra Configurações para exportar um backup, liberar espaço ou conectar uma pasta/Dropbox sem limite de tamanho.");
  }, [pastaHandle, dropboxConectado]);

  const rangeForPeriodo = () => {
    const hoje = new Date();
    if (periodo === "mes-atual") {
      const ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
      const fim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
      return [ini.toISOString().slice(0, 10), fim.toISOString().slice(0, 10)];
    }
    if (periodo === "mes-anterior") {
      const ini = new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1);
      const fim = new Date(hoje.getFullYear(), hoje.getMonth(), 0);
      return [ini.toISOString().slice(0, 10), fim.toISOString().slice(0, 10)];
    }
    if (periodo === "personalizado") return [dataInicio || null, dataFim || null];
    return [null, null];
  };
  const dentroDoPeriodo = (dataStr) => {
    const [ini, fim] = rangeForPeriodo();
    if (!ini && !fim) return true;
    if (!dataStr) return false;
    if (ini && dataStr < ini) return false;
    if (fim && dataStr > fim) return false;
    return true;
  };

  const fretesResumo = fretes.filter(f => dentroDoPeriodo(f.dataTiquete));
  const custosResumo = custos.filter(c => dentroDoPeriodo(c.data));
  // Data-limite do quadro de resumo: quando o período tem fim definido, trava nele — mesmo que
  // um pagamento tenha ocorrido depois, o resumo espelha a situação até essa data. Em "todos os
  // períodos" não há data futura possível, então usa hoje.
  const limitePeriodo = (() => { const [, fim] = rangeForPeriodo(); return fim || dataHojeISO(); })();

  const totalRecebido = fretesResumo.filter(f => freteRecebidoAteData(f, limitePeriodo)).reduce((s, f) => s + f.valorFrete, 0);
  const totalPendente = fretesResumo.filter(f => !freteRecebidoAteData(f, limitePeriodo)).reduce((s, f) => s + f.valorFrete, 0);
  const comissaoPaga = fretesResumo.reduce((s, f) => s + Math.min(valorPagoAcumuladoAteData(comissaoComoItem(f), limitePeriodo), f.comissaoMotorista || 0), 0);
  const comissaoAPagar = fretesResumo.reduce((s, f) => s + saldoPendenteCustoAteData(comissaoComoItem(f), limitePeriodo), 0);
  const totalCombustivel = custosResumo.filter(c => c.tipo === "combustivel" && custoEstaLiquidadoAteData(c, limitePeriodo)).reduce((s, c) => s + c.valor, 0);
  const combustivelPendente = custosResumo.filter(c => c.tipo === "combustivel" && !custoEstaLiquidadoAteData(c, limitePeriodo)).reduce((s, c) => s + c.valor, 0);
  const totalPedagio = custosResumo.filter(c => c.tipo === "pedagio" && custoEstaLiquidadoAteData(c, limitePeriodo)).reduce((s, c) => s + c.valor, 0);
  const pedagioPendente = custosResumo.filter(c => c.tipo === "pedagio" && !custoEstaLiquidadoAteData(c, limitePeriodo)).reduce((s, c) => s + c.valor, 0);
  const totalManutencao = custosResumo.filter(c => c.tipo === "manutencao" && custoEstaLiquidadoAteData(c, limitePeriodo)).reduce((s, c) => s + c.valor, 0);
  const manutencaoPendente = custosResumo.filter(c => c.tipo === "manutencao" && !custoEstaLiquidadoAteData(c, limitePeriodo)).reduce((s, c) => s + c.valor, 0);
  const totalAressarcir = custosResumo.filter(c => c.pagoPor === "motorista").reduce((s, c) => s + saldoPendenteCustoAteData(c, limitePeriodo), 0);
  const totalAReceberDoMotorista = custosResumo.filter(c => c.pagoPor === "motorista").reduce((s, c) => s + excedenteCustoAteData(c, limitePeriodo), 0);
  const saldo = totalRecebido - comissaoPaga - totalCombustivel - totalPedagio - totalManutencao;
  const movimentadoTotal = totalRecebido + totalPendente;

  const manutencaoPorItem = ITENS_MANUTENCAO.map(item => ({
    item, valor: custosResumo.filter(c => c.tipo === "manutencao" && c.itemPrincipal === item).reduce((s, c) => s + c.valor, 0)
  })).filter(x => x.valor > 0);

  // limite = null mantém o comportamento normal (status atual, usado nas abas Fretes/Custos);
  // passar uma data trava o resultado da viagem como ele estava até aquele momento (Resumo).
  const dreDaViagem = (frete, limite = null) => {
    const custosViagem = custos.filter(c => c.freteId === frete.id);
    const combustivelPago = custosViagem.filter(c => c.tipo === "combustivel" && custoEstaLiquidadoAteData(c, limite)).reduce((s, c) => s + c.valor, 0);
    const combustivelPend = custosViagem.filter(c => c.tipo === "combustivel" && !custoEstaLiquidadoAteData(c, limite)).reduce((s, c) => s + c.valor, 0);
    const pedagioPago = custosViagem.filter(c => c.tipo === "pedagio" && custoEstaLiquidadoAteData(c, limite)).reduce((s, c) => s + c.valor, 0);
    const pedagioPend = custosViagem.filter(c => c.tipo === "pedagio" && !custoEstaLiquidadoAteData(c, limite)).reduce((s, c) => s + c.valor, 0);
    const manutencaoPago = custosViagem.filter(c => c.tipo === "manutencao" && custoEstaLiquidadoAteData(c, limite)).reduce((s, c) => s + c.valor, 0);
    const manutencaoPend = custosViagem.filter(c => c.tipo === "manutencao" && !custoEstaLiquidadoAteData(c, limite)).reduce((s, c) => s + c.valor, 0);
    const comissaoItem = comissaoComoItem(frete);
    const comissaoTotal = frete.comissaoMotorista || 0;
    const comissaoPaga2 = Math.min(valorPagoAcumuladoAteData(comissaoItem, limite), comissaoTotal);
    const comissaoPend = saldoPendenteCustoAteData(comissaoItem, limite);
    const receitaRecebida = freteRecebidoAteData(frete, limite) ? frete.valorFrete : 0;
    const receitaAReceber = freteRecebidoAteData(frete, limite) ? 0 : frete.valorFrete;
    const resultado = receitaRecebida - comissaoPaga2 - combustivelPago - pedagioPago - manutencaoPago;
    const temPendencia = receitaAReceber > 0 || comissaoPend > 0 || combustivelPend > 0 || pedagioPend > 0 || manutencaoPend > 0;
    return { receitaRecebida, receitaAReceber, comissaoPaga: comissaoPaga2, comissaoPendente: comissaoPend, combustivelPago, combustivelPendente: combustivelPend, pedagioPago, pedagioPendente: pedagioPend, manutencaoPago, manutencaoPendente: manutencaoPend, resultado, temPendencia };
  };
  const dreDaViagemNoPeriodo = (frete) => dreDaViagem(frete, limitePeriodo);

  // O DRE por viagem e seu consolidado são por competência (todos os lançamentos do período,
  // pagos ou não) — só o quadro "pago/recebido" x "a pagar/a receber" acima usa regime de caixa.
  const custosGeraisResumoBruto = custosResumo.filter(c => !c.freteId).reduce((s, c) => s + c.valor, 0);
  const resultadoConsolidado = fretesResumo.reduce((s, f) => {
    const dre = dreDaViagemNoPeriodo(f);
    return s + (f.valorFrete - (f.comissaoMotorista || 0) - (dre.combustivelPago + dre.combustivelPendente) - (dre.pedagioPago + dre.pedagioPendente) - (dre.manutencaoPago + dre.manutencaoPendente));
  }, 0);

  // Linha do tempo do período: tíquetes agrupados por container, e despesas sem container/viagem
  // aparecem soltas na mesma linha do tempo, por data.
  const despesasGeraisResumo = custosResumo.filter(c => !c.freteId);
  const fretesPorData = (() => {
    const grupos = {};
    fretesResumo.forEach(f => { const k = f.dataTiquete || "Sem data"; grupos[k] = grupos[k] || { fretes: [], despesas: [] }; grupos[k].fretes.push(f); });
    despesasGeraisResumo.forEach(c => { const k = c.data || "Sem data"; grupos[k] = grupos[k] || { fretes: [], despesas: [] }; grupos[k].despesas.push(c); });
    Object.values(grupos).forEach(g => g.fretes.sort((a, b) => (a.numeroContainer || "").localeCompare(b.numeroContainer || "")));
    return Object.entries(grupos).sort((a, b) => (a[0] < b[0] ? 1 : -1));
  })();

  const toggleStatus = (id) => {
    const frete = fretes.find(f => f.id === id);
    if (!frete) return;
    if (frete.status === "pago") {
      persistFretes(fretes.map(f => f.id === id ? { ...f, status: "pendente", dataPagamento: null } : f));
    } else {
      setDataPagamentoAlvo({ freteId: id });
    }
  };
  const confirmarDataPagamentoFrete = (data) => {
    if (!dataPagamentoAlvo) return;
    persistFretes(fretes.map(f => f.id === dataPagamentoAlvo.freteId ? { ...f, status: "pago", dataPagamento: data } : f));
    setDataPagamentoAlvo(null);
  };
  // Mesma lógica de pagamento/ressarcimento da despesa, aplicada à comissão do frete: se já
  // está liquidada, reverte; senão, abre a tela de comprovante (valor parcial, maior ou menor).
  const toggleComissaoStatus = (frete) => {
    const item = comissaoComoItem(frete);
    if (custoEstaLiquidado(item)) {
      persistFretes(fretes.map(f => f.id === frete.id ? { ...f, comissaoPagamentos: [], statusComissao: "pendente", dataComissaoPaga: null } : f));
    } else {
      setPagamentoAlvo(item);
    }
  };
  // Mesmo critério para fornecedor e motorista: se já está liquidado, reverte (limpa os
  // pagamentos); senão, abre a tela de pagamento/ressarcimento com comprovante.
  const toggleCustoPagamento = (custo) => {
    if (custoEstaLiquidado(custo)) {
      persistCustos(custos.map(c => c.id === custo.id
        ? { ...c, pagamentos: [], statusPagamento: "pendente", statusRessarcimento: "pendente", valorReembolsado: null }
        : c));
    } else {
      setPagamentoAlvo(custo);
    }
  };
  const toggleRessarcimento = toggleCustoPagamento;
  const confirmarPagamentoCusto = ({ data, comprovanteThumb, valorTotalComprovante, alocacoes, sobra, tipoParte, chaveParte }) => {
    const loteId = uid();
    const porIdCusto = {};
    const porIdComissao = {};
    alocacoes.forEach(a => {
      if (a.custoId.startsWith(COMISSAO_PREFIXO_ID)) porIdComissao[a.custoId.slice(COMISSAO_PREFIXO_ID.length)] = a.valorAlocado;
      else porIdCusto[a.custoId] = a.valorAlocado;
    });
    if (Object.keys(porIdCusto).length > 0) {
      persistCustos(custos.map(c => {
        if (!(c.id in porIdCusto)) return c;
        const novoPagamento = { id: uid(), valor: porIdCusto[c.id], data, comprovanteThumb, loteId, valorTotalComprovante };
        return { ...c, pagamentos: [...(c.pagamentos || []), novoPagamento] };
      }));
    }
    if (Object.keys(porIdComissao).length > 0) {
      persistFretes(fretes.map(f => {
        if (!(f.id in porIdComissao)) return f;
        const novoPagamento = { id: uid(), valor: porIdComissao[f.id], data, comprovanteThumb, loteId, valorTotalComprovante };
        return { ...f, comissaoPagamentos: [...(f.comissaoPagamentos || []), novoPagamento] };
      }));
    }
    if (sobra > 0.004 && chaveParte) {
      persistCreditos([...creditos, {
        id: uid(), tipo: tipoParte, chave: chaveParte, valor: sobra, data, comprovanteThumb, loteId, valorTotalComprovante
      }]);
    }
    setPagamentoAlvo(null);
  };

  // Quando uma despesa nova é cadastrada, se já existir saldo credor disponível para o mesmo
  // fornecedor/motorista (de um comprovante anterior que sobrou), abate automaticamente aqui —
  // das sobras mais antigas para as mais novas, até quitar a despesa ou o crédito acabar.
  const aplicarCreditoDisponivel = (rec) => {
    const tipoParte = rec.pagoPor === "motorista" ? "motorista" : "fornecedor";
    const chaveParte = rec.pagoPor === "motorista" ? rec.motorista : (rec.tipo === "combustivel" ? rec.posto : rec.fornecedor);
    if (!chaveParte) return { rec, creditosRestantes: creditos };
    const disponiveis = creditos.filter(cr => cr.tipo === tipoParte && cr.chave === chaveParte).sort((a, b) => (a.data || "").localeCompare(b.data || ""));
    if (disponiveis.length === 0) return { rec, creditosRestantes: creditos };
    let restante = rec.valor;
    const novosPagamentos = [];
    const idsConsumidosTotal = [];
    const creditosAtualizados = [];
    creditos.forEach(cr => {
      if (cr.tipo !== tipoParte || cr.chave !== chaveParte || restante <= 0.004) { creditosAtualizados.push(cr); return; }
      const usar = Math.min(cr.valor, restante);
      restante = Math.round((restante - usar) * 100) / 100;
      novosPagamentos.push({ id: uid(), valor: usar, data: cr.data, comprovanteThumb: cr.comprovanteThumb, loteId: cr.loteId, valorTotalComprovante: cr.valorTotalComprovante });
      const sobraCredito = Math.round((cr.valor - usar) * 100) / 100;
      if (sobraCredito > 0.004) creditosAtualizados.push({ ...cr, valor: sobraCredito });
    });
    if (novosPagamentos.length === 0) return { rec, creditosRestantes: creditos };
    return {
      rec: { ...rec, pagamentos: [...(rec.pagamentos || []), ...novosPagamentos] },
      creditosRestantes: creditosAtualizados
    };
  };
  // Mesma ideia, mas para a comissão gerada por um frete novo — usa o crédito do motorista.
  const aplicarCreditoNaComissao = (freteRec) => {
    if (!freteRec.motorista || !(freteRec.comissaoMotorista > 0)) return { frete: freteRec, creditosRestantes: creditos };
    const disponiveis = creditos.filter(cr => cr.tipo === "motorista" && cr.chave === freteRec.motorista);
    if (disponiveis.length === 0) return { frete: freteRec, creditosRestantes: creditos };
    let restante = freteRec.comissaoMotorista;
    const novosPagamentos = [];
    const creditosAtualizados = [];
    creditos.forEach(cr => {
      if (cr.tipo !== "motorista" || cr.chave !== freteRec.motorista || restante <= 0.004) { creditosAtualizados.push(cr); return; }
      const usar = Math.min(cr.valor, restante);
      restante = Math.round((restante - usar) * 100) / 100;
      novosPagamentos.push({ id: uid(), valor: usar, data: cr.data, comprovanteThumb: cr.comprovanteThumb, loteId: cr.loteId, valorTotalComprovante: cr.valorTotalComprovante });
      const sobraCredito = Math.round((cr.valor - usar) * 100) / 100;
      if (sobraCredito > 0.004) creditosAtualizados.push({ ...cr, valor: sobraCredito });
    });
    if (novosPagamentos.length === 0) return { frete: freteRec, creditosRestantes: creditos };
    return {
      frete: { ...freteRec, comissaoPagamentos: [...(freteRec.comissaoPagamentos || []), ...novosPagamentos] },
      creditosRestantes: creditosAtualizados
    };
  };
  const toggleParcela = (custoId, parcelaId) => {
    const custo = custos.find(c => c.id === custoId);
    const parcela = custo && custo.parcelas && custo.parcelas.find(p => p.id === parcelaId);
    if (!parcela) return;
    if (parcela.status === "pago") {
      persistCustos(custos.map(c => c.id === custoId
        ? { ...c, parcelas: c.parcelas.map(p => p.id === parcelaId ? { ...p, status: "pendente", comprovanteThumb: null, valorPago: null, dataPagamento: null } : p) }
        : c));
      return;
    }
    const indice = custo.parcelas.findIndex(p => p.id === parcelaId);
    setParcelaAlvo({ custoId, parcelaId, parcela, indice });
  };
  const confirmarPagamentoParcela = ({ valorPago, dataPagamento, comprovanteThumb }) => {
    if (!parcelaAlvo) return;
    persistCustos(custos.map(c => c.id === parcelaAlvo.custoId
      ? { ...c, parcelas: c.parcelas.map(p => p.id === parcelaAlvo.parcelaId ? { ...p, status: "pago", valorPago, dataPagamento, comprovanteThumb } : p) }
      : c));
    setParcelaAlvo(null);
  };
  // Corrige lançamentos errados: remove um pagamento específico de uma despesa ou de uma
  // comissão (ex.: um valor deduzido incorretamente de um comprovante).
  const removerPagamento = (id, pagamentoId) => {
    if (id.startsWith(COMISSAO_PREFIXO_ID)) {
      const freteId = id.slice(COMISSAO_PREFIXO_ID.length);
      persistFretes(fretes.map(f => f.id === freteId ? { ...f, comissaoPagamentos: (f.comissaoPagamentos || []).filter(p => p.id !== pagamentoId) } : f));
    } else {
      persistCustos(custos.map(c => c.id === id ? { ...c, pagamentos: (c.pagamentos || []).filter(p => p.id !== pagamentoId) } : c));
    }
  };
  const deleteCredito = (id) => persistCreditos(creditos.filter(cr => cr.id !== id));
  const updateFrete = (updated) => persistFretes(fretes.map(f => f.id === updated.id ? updated : f));
  const deleteFrete = (id) => persistFretes(fretes.filter(f => f.id !== id));
  const deleteCusto = (id) => persistCustos(custos.filter(c => c.id !== id));
  const updateCusto = (updated) => persistCustos(custos.map(c => (c.id === updated.id ? updated : c)));

  // Libera espaço no navegador removendo só as miniaturas (fotos/comprovantes) de lançamentos
  // com mais de 90 dias e já totalmente liquidados — os valores, datas e status continuam
  // intactos, só a imagem some. Não mexe em nada pendente ou recente.
  const liberarEspacoAntigo = () => {
    const limite = new Date();
    limite.setDate(limite.getDate() - 90);
    const limiteStr = limite.toISOString().slice(0, 10);
    let removidos = 0;

    const novosFretes = fretes.map(f => {
      let mudou = false;
      let novoF = f;
      const comissaoOk = custoEstaLiquidado(comissaoComoItem(f));
      if (f.imagemThumb && f.dataTiquete && f.dataTiquete < limiteStr && f.status === "pago" && comissaoOk) {
        novoF = { ...novoF, imagemThumb: null };
        mudou = true; removidos++;
      }
      if (f.comissaoPagamentos && f.comissaoPagamentos.some(p => p.comprovanteThumb) && f.dataTiquete && f.dataTiquete < limiteStr && comissaoOk) {
        novoF = { ...novoF, comissaoPagamentos: novoF.comissaoPagamentos.map(p => p.comprovanteThumb ? (removidos++, { ...p, comprovanteThumb: null }) : p) };
        mudou = true;
      }
      return mudou ? novoF : f;
    });

    const novosCustos = custos.map(c => {
      let mudou = false;
      let novoC = c;
      const liquidado = custoEstaLiquidado(c);
      if (c.imagemThumb && c.data && c.data < limiteStr && liquidado) {
        novoC = { ...novoC, imagemThumb: null };
        mudou = true; removidos++;
      }
      if (c.pagamentos && c.pagamentos.some(p => p.comprovanteThumb) && c.data && c.data < limiteStr && liquidado) {
        novoC = { ...novoC, pagamentos: novoC.pagamentos.map(p => p.comprovanteThumb ? (removidos++, { ...p, comprovanteThumb: null }) : p) };
        mudou = true;
      }
      if (c.parcelas && c.parcelas.some(p => p.comprovanteThumb) && c.data && c.data < limiteStr && liquidado) {
        novoC = { ...novoC, parcelas: novoC.parcelas.map(p => p.comprovanteThumb ? (removidos++, { ...p, comprovanteThumb: null }) : p) };
        mudou = true;
      }
      return mudou ? novoC : c;
    });

    if (removidos > 0) {
      persistFretes(novosFretes);
      persistCustos(novosCustos);
    }
    return removidos;
  };

  const tabs = [
    { id: "dashboard", label: "Resumo", icon: IconTrendUp },
    { id: "fretes", label: "Fretes", icon: IconTruck },
    { id: "custos", label: "Custos", icon: IconFuel },
    { id: "entrada", label: "Entrada", icon: IconUpload },
    { id: "motorista", label: "Motorista", icon: IconUser },
    { id: "relatorios", label: "Relatórios", icon: IconFileText }
  ];

  const [motoristaFiltro, setMotoristaFiltro] = useState("todos");
  const [relatorioDataInicio, setRelatorioDataInicio] = useState("");
  const [relatorioDataFim, setRelatorioDataFim] = useState("");
  const [relatorioFornecedor, setRelatorioFornecedor] = useState("todos");
  const [relatorioMotorista, setRelatorioMotorista] = useState("todos");
  const limiteRelatorio = relatorioDataFim || dataHojeISO();

  const [custosPeriodo, setCustosPeriodo] = useState("todos");
  const [custosDataInicio, setCustosDataInicio] = useState("");
  const [custosDataFim, setCustosDataFim] = useState("");
  const [custosFornecedorFiltro, setCustosFornecedorFiltro] = useState("todos");
  const [custosMotoristaFiltro, setCustosMotoristaFiltro] = useState("todos");

  const [motoristaPeriodo, setMotoristaPeriodo] = useState("todos");
  const [motoristaDataInicio, setMotoristaDataInicio] = useState("");
  const [motoristaDataFim, setMotoristaDataFim] = useState("");
  const [motoristaVisualizacao, setMotoristaVisualizacao] = useState("ambos"); // ambos | tickets | extrato

  const [freteFiltroContainer, setFreteFiltroContainer] = useState("");
  const [freteFiltroCliente, setFreteFiltroCliente] = useState("");
  const [freteFiltroStatus, setFreteFiltroStatus] = useState("todos");
  const [fretePeriodo, setFretePeriodo] = useState("todos");
  const [freteDataInicio, setFreteDataInicio] = useState("");
  const [freteDataFim, setFreteDataFim] = useState("");

  // Mesmo formato de período usado no Resumo, reaproveitado pelas outras abas.
  const rangeDoPeriodo = (periodoSel, ini, fim) => {
    const hoje = new Date();
    if (periodoSel === "mes-atual") {
      const i = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
      const f = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
      return [i.toISOString().slice(0, 10), f.toISOString().slice(0, 10)];
    }
    if (periodoSel === "mes-anterior") {
      const i = new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1);
      const f = new Date(hoje.getFullYear(), hoje.getMonth(), 0);
      return [i.toISOString().slice(0, 10), f.toISOString().slice(0, 10)];
    }
    if (periodoSel === "personalizado") return [ini || null, fim || null];
    return [null, null];
  };
  const dentroDoPeriodoSel = (dataStr, periodoSel, ini, fim) => {
    const [pIni, pFim] = rangeDoPeriodo(periodoSel, ini, fim);
    if (!pIni && !pFim) return true;
    if (!dataStr) return false;
    if (pIni && dataStr < pIni) return false;
    if (pFim && dataStr > pFim) return false;
    return true;
  };
  function SeletorPeriodo({ periodoSel, onPeriodo, ini, onIni, fim, onFim }) {
    return (
      <div className="flex flex-wrap items-center gap-2 no-print">
        {[
          { id: "todos", label: "Todos os períodos" },
          { id: "mes-atual", label: "Este mês" },
          { id: "mes-anterior", label: "Mês anterior" },
          { id: "personalizado", label: "Personalizado" }
        ].map(p => (
          <button
            key={p.id}
            onClick={() => onPeriodo(p.id)}
            className="px-3 py-1.5 rounded-md text-xs font-semibold uppercase tracking-wide border"
            style={{
              background: periodoSel === p.id ? "#1C1E22" : "#FFFFFF",
              color: periodoSel === p.id ? "#FFFFFF" : "#24221D",
              borderColor: periodoSel === p.id ? "#1C1E22" : "#D9D3C4",
              fontFamily: "'Oswald', sans-serif"
            }}
          >
            {p.label}
          </button>
        ))}
        {periodoSel === "personalizado" && (
          <div className="flex items-center gap-1.5">
            <input type="date" value={ini} onChange={(e) => onIni(e.target.value)} className="px-2 py-1.5 rounded-md text-xs" style={inputStyle} />
            <span className="text-xs" style={{ color: "#8A8577" }}>até</span>
            <input type="date" value={fim} onChange={(e) => onFim(e.target.value)} className="px-2 py-1.5 rounded-md text-xs" style={inputStyle} />
          </div>
        )}
      </div>
    );
  }

  const nomesFornecedores = Array.from(new Set(custos.filter(c => c.pagoPor === "empresa").map(c => c.tipo === "combustivel" ? c.posto : c.fornecedor).filter(Boolean)));

  const fretesFiltrados = fretes.filter(f =>
    dentroDoPeriodoSel(f.dataTiquete, fretePeriodo, freteDataInicio, freteDataFim) &&
    (!freteFiltroContainer || (f.numeroContainer || "").toLowerCase().includes(freteFiltroContainer.toLowerCase())) &&
    (!freteFiltroCliente || (f.cliente || "").toLowerCase().includes(freteFiltroCliente.toLowerCase())) &&
    (freteFiltroStatus === "todos" || (freteFiltroStatus === "recebido" ? f.status === "pago" : f.status !== "pago"))
  );
  const custosFiltrados = custos.filter(c =>
    dentroDoPeriodoSel(c.data, custosPeriodo, custosDataInicio, custosDataFim) &&
    (custosFornecedorFiltro === "todos" || (c.tipo === "combustivel" ? c.posto : c.fornecedor) === custosFornecedorFiltro) &&
    (custosMotoristaFiltro === "todos" || c.motorista === custosMotoristaFiltro)
  );

  const exportarExcelFretes = () => {
    if (typeof XLSX === "undefined") { alert("Biblioteca de exportação não carregou. Verifique sua conexão com a internet."); return; }
    const linhas = fretesFiltrados.map(f => {
      const dre = dreDaViagem(f);
      return {
        Data: f.dataTiquete ? new Date(f.dataTiquete + "T00:00:00").toLocaleDateString("pt-BR") : "",
        Container: f.numeroContainer || "TBN", Cliente: f.cliente || "", Caminhao: f.caminhao || "", Motorista: f.motorista || "",
        Frete: f.valorFrete, StatusFrete: f.status === "pago" ? "Recebido" : "A receber",
        Comissao: f.comissaoMotorista || 0, Saldo: dre.resultado
      };
    });
    const ws = XLSX.utils.json_to_sheet(linhas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Fretes");
    XLSX.writeFile(wb, `fretes-${dataHojeISO()}.xlsx`);
  };

  const exportarExcelCustos = () => {
    if (typeof XLSX === "undefined") { alert("Biblioteca de exportação não carregou. Verifique sua conexão com a internet."); return; }
    const linhas = custosFiltrados.map(c => ({
      Data: c.data ? new Date(c.data + "T00:00:00").toLocaleDateString("pt-BR") : "",
      Tipo: c.tipo === "combustivel" ? "Combustível" : c.tipo === "pedagio" ? "Pedágio" : "Manutenção",
      Categoria: c.itemPrincipal || "", Fornecedor: c.tipo === "combustivel" ? (c.posto || "") : (c.fornecedor || ""),
      Descricao: c.descricao || "", Veiculo: c.veiculo || "", PagoPor: c.pagoPor === "motorista" ? "Motorista" : "Empresa",
      Valor: c.valor, Pago: currency(valorPagoAcumulado(c)), SaldoPendente: currency(saldoPendenteCusto(c))
    }));
    const ws = XLSX.utils.json_to_sheet(linhas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Custos");
    XLSX.writeFile(wb, `custos-${dataHojeISO()}.xlsx`);
  };

  const exportarExcelResumo = () => {
    if (typeof XLSX === "undefined") { alert("Biblioteca de exportação não carregou. Verifique sua conexão com a internet."); return; }
    const linhas = fretesResumo.map(f => {
      const dre = dreDaViagemNoPeriodo(f);
      return {
        Data: f.dataTiquete ? new Date(f.dataTiquete + "T00:00:00").toLocaleDateString("pt-BR") : "",
        Container: f.numeroContainer || "TBN", Cliente: f.cliente || "",
        FreteRecebido: dre.receitaRecebida, ComissaoPaga: dre.comissaoPaga,
        CombustivelPago: dre.combustivelPago, PedagioPago: dre.pedagioPago, ManutencaoPaga: dre.manutencaoPago,
        Saldo: dre.resultado
      };
    });
    const ws = XLSX.utils.json_to_sheet(linhas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Resumo");
    XLSX.writeFile(wb, `resumo-${dataHojeISO()}.xlsx`);
  };


  const fretesDoMotorista = (nome) => fretes.filter(f => (f.motorista || "") === nome);
  const custosDoMotorista = (nome) => custos.filter(c => c.pagoPor === "motorista" && (c.motorista || "") === nome);

  // Extrato cronológico: cada comissão e cada despesa reembolsável geram um lançamento que
  // aumenta o saldo devido ao motorista; o pagamento da comissão e o ressarcimento da despesa
  // geram um segundo lançamento, logo abaixo, que reduz esse saldo. O saldo acumulado reflete
  // sempre a soma desses lançamentos em ordem cronológica — a mesma lógica usada nas abas
  // Custos e Fretes (via custoEstaLiquidado / diferencaReembolso), sem valores distorcidos.
  const extratoMotorista = (nome) => {
    const lancamentos = [];
    fretesDoMotorista(nome).forEach(f => {
      if (!f.comissaoMotorista) return;
      const container = f.numeroContainer ? ` · container ${f.numeroContainer}` : "";
      lancamentos.push({
        data: f.dataTiquete || "", ordem: 0, tipo: "Comissão gerada", descricao: `Frete${container}`,
        valor: f.comissaoMotorista, efeito: 1, cor: "saida"
      });
      if (f.comissaoPagamentos && f.comissaoPagamentos.length > 0) {
        f.comissaoPagamentos.forEach(p => {
          lancamentos.push({
            data: p.data || f.dataTiquete || "", ordem: 1, tipo: "Comissão paga", descricao: `Frete${container}`,
            valor: p.valor, efeito: -1, cor: "entrada"
          });
        });
      } else if ((f.statusComissao || "pendente") === "pago") {
        // registro antigo, sem lista de pagamentos detalhada
        lancamentos.push({
          data: f.dataComissaoPaga || f.dataTiquete || "", ordem: 1, tipo: "Comissão paga", descricao: `Frete${container}`,
          valor: f.comissaoMotorista, efeito: -1, cor: "entrada"
        });
      }
    });
    custosDoMotorista(nome).forEach(c => {
      const nomeTipo = c.tipo === "combustivel" ? "Combustível" : c.tipo === "pedagio" ? "Pedágio" : (c.itemPrincipal || "Manutenção");
      lancamentos.push({
        data: c.data || "", ordem: 0, tipo: "Despesa", descricao: nomeTipo,
        valor: c.valor, efeito: 1, cor: "saida"
      });
      if (c.pagamentos && c.pagamentos.length > 0) {
        c.pagamentos.forEach(p => {
          lancamentos.push({
            data: p.data || c.data || "", ordem: 1, tipo: "Ressarcimento recebido", descricao: nomeTipo,
            valor: p.valor, efeito: -1, cor: "entrada"
          });
        });
      } else if (c.statusRessarcimento === "ressarcido") {
        // registro antigo, sem lista de pagamentos detalhada
        lancamentos.push({
          data: c.dataRessarcimento || c.data || "", ordem: 1, tipo: "Ressarcimento recebido", descricao: nomeTipo,
          valor: c.valorReembolsado != null ? c.valorReembolsado : c.valor, efeito: -1, cor: "entrada"
        });
      }
    });
    lancamentos.sort((a, b) => {
      const da = a.data || "", db = b.data || "";
      if (da !== db) return da < db ? -1 : 1;
      return a.ordem - b.ordem;
    });
    let saldo = 0;
    return lancamentos.map(l => { saldo += l.efeito * l.valor; return { ...l, saldoAcumulado: saldo }; });
  };

  const linhasRelatorio = (() => {
    const dentro = (d) => {
      if (!relatorioDataInicio && !relatorioDataFim) return true;
      if (!d) return false;
      if (relatorioDataInicio && d < relatorioDataInicio) return false;
      if (relatorioDataFim && d > relatorioDataFim) return false;
      return true;
    };
    return fretes
      .filter(f => dentro(f.dataTiquete) && (relatorioMotorista === "todos" || f.motorista === relatorioMotorista))
      .slice()
      .sort((a, b) => {
        const da = a.dataTiquete || "", db = b.dataTiquete || "";
        if (da !== db) return da < db ? -1 : 1;
        return (a.numeroContainer || "").localeCompare(b.numeroContainer || "");
      })
      .map(f => {
        const dre = dreDaViagem(f, limiteRelatorio);
        return {
          Data: f.dataTiquete ? new Date(f.dataTiquete + "T00:00:00").toLocaleDateString("pt-BR") : "",
          Container: f.numeroContainer || "TBN",
          Cliente: f.cliente || "",
          Caminhao: f.caminhao || "",
          Motorista: f.motorista || "",
          Frete: f.valorFrete,
          StatusFrete: f.status === "pago" ? "Recebido" : "A receber",
          Comissao: f.comissaoMotorista || 0,
          Combustivel: dre.combustivelPago + dre.combustivelPendente,
          Pedagio: dre.pedagioPago + dre.pedagioPendente,
          Manutencao: dre.manutencaoPago + dre.manutencaoPendente,
          Saldo: dre.resultado
        };
      });
  })();

  const exportarExcel = () => {
    if (typeof XLSX === "undefined") { alert("Biblioteca de exportação não carregou. Verifique sua conexão com a internet."); return; }
    const ws = XLSX.utils.json_to_sheet(linhasRelatorio);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Relatório");
    XLSX.writeFile(wb, `relatorio-fretes-${dataHojeISO()}.xlsx`);
  };

  const exportarPDF = () => window.print();

  const exportarExcelMotorista = () => {
    if (typeof XLSX === "undefined") { alert("Biblioteca de exportação não carregou. Verifique sua conexão com a internet."); return; }
    const lista = motoristaFiltro === "todos" ? config.motoristas : [motoristaFiltro];
    const linhas = [];
    lista.forEach((nome) => {
      extratoMotorista(nome).forEach((l) => {
        linhas.push({
          Motorista: nome,
          Data: l.data ? new Date(l.data + "T00:00:00").toLocaleDateString("pt-BR") : "",
          Lancamento: l.tipo, Descricao: l.descricao,
          Valor: l.efeito > 0 ? l.valor : -l.valor,
          SaldoAcumulado: l.saldoAcumulado
        });
      });
    });
    const ws = XLSX.utils.json_to_sheet(linhas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Motorista");
    XLSX.writeFile(wb, `relatorio-motorista-${dataHojeISO()}.xlsx`);
  };

  // Estrutura do relatório em PDF: a mesma do controle de tíquete (data → container → detalhamento).
  const relatorioPorData = (() => {
    const dentro = (d) => {
      if (!relatorioDataInicio && !relatorioDataFim) return true;
      if (!d) return false;
      if (relatorioDataInicio && d < relatorioDataInicio) return false;
      if (relatorioDataFim && d > relatorioDataFim) return false;
      return true;
    };
    const grupos = {};
    fretes.filter(f => dentro(f.dataTiquete) && (relatorioMotorista === "todos" || f.motorista === relatorioMotorista)).forEach(f => { const k = f.dataTiquete || "Sem data"; grupos[k] = grupos[k] || { fretes: [], despesas: [] }; grupos[k].fretes.push(f); });
    custos.filter(c => !c.freteId && dentro(c.data) && (relatorioMotorista === "todos" || c.motorista === relatorioMotorista) && (relatorioFornecedor === "todos" || (c.tipo === "combustivel" ? c.posto : c.fornecedor) === relatorioFornecedor)).forEach(c => { const k = c.data || "Sem data"; grupos[k] = grupos[k] || { fretes: [], despesas: [] }; grupos[k].despesas.push(c); });
    Object.values(grupos).forEach(g => g.fretes.sort((a, b) => (a.numeroContainer || "").localeCompare(b.numeroContainer || "")));
    return Object.entries(grupos).sort((a, b) => (a[0] < b[0] ? -1 : 1));
  })();
  const dreDaViagemNoRelatorio = (frete) => dreDaViagem(frete, limiteRelatorio);

  return (
    <div className="min-h-screen w-full flex flex-col" style={{ background: "#F4F1E8" }}>
      <datalist id="caminhoes-list">
        {config.caminhoes.map((c) => <option key={c} value={c} />)}
      </datalist>
      <div style={{ background: "#1C1E22" }} className="px-4 sm:px-6 py-5 no-print">
        <div className="max-w-3xl mx-auto flex items-center justify-between">
          <div className="flex items-center gap-3">
            <LogoMark size={42} />
            <div className="flex flex-col leading-none">
              <span className="text-xl sm:text-2xl tracking-[0.08em]" style={{ fontFamily: "'Oswald', sans-serif", color: "#F4F1E8", fontWeight: 700 }}>
                PAINEL <span style={{ color: "#E8A33D" }}>DE BORDO</span>
              </span>
              <div className="flex items-center gap-1.5 mt-1">
                <span style={{ display: "inline-block", width: 14, height: 2, background: "#E8A33D" }} />
                <span className="text-[11px] tracking-[0.2em] uppercase" style={{ fontFamily: "'Oswald', sans-serif", color: "#B9B6AC", fontWeight: 600 }}>{config.nomeEmpresa}</span>
              </div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            {tab === "dashboard" && (
              <>
                <button onClick={() => window.print()} title="Exportar PDF do resumo" className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-semibold text-white" style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}>
                  <IconFileText size={14} /> PDF
                </button>
                <button onClick={exportarExcelResumo} title="Exportar Excel do resumo" className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-semibold border" style={{ borderColor: "rgba(255,255,255,0.3)", color: "#F4F1E8", fontFamily: "'Oswald', sans-serif" }}>
                  <IconDownload size={14} /> Excel
                </button>
              </>
            )}
            {tab === "fretes" && (
              <>
                <button onClick={() => window.print()} title="Exportar PDF dos fretes" className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-semibold text-white" style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}>
                  <IconFileText size={14} /> PDF
                </button>
                <button onClick={exportarExcelFretes} title="Exportar Excel dos fretes" className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-semibold border" style={{ borderColor: "rgba(255,255,255,0.3)", color: "#F4F1E8", fontFamily: "'Oswald', sans-serif" }}>
                  <IconDownload size={14} /> Excel
                </button>
              </>
            )}
            {tab === "custos" && (
              <>
                <button onClick={() => window.print()} title="Exportar PDF dos custos" className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-semibold text-white" style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}>
                  <IconFileText size={14} /> PDF
                </button>
                <button onClick={exportarExcelCustos} title="Exportar Excel dos custos" className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-semibold border" style={{ borderColor: "rgba(255,255,255,0.3)", color: "#F4F1E8", fontFamily: "'Oswald', sans-serif" }}>
                  <IconDownload size={14} /> Excel
                </button>
              </>
            )}
            {tab === "motorista" && (
              <>
                <button onClick={exportarPDF} title="Exportar PDF do extrato do motorista" className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-semibold text-white" style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}>
                  <IconFileText size={14} /> PDF
                </button>
                <button onClick={exportarExcelMotorista} title="Exportar Excel do extrato do motorista" className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-semibold border" style={{ borderColor: "rgba(255,255,255,0.3)", color: "#F4F1E8", fontFamily: "'Oswald', sans-serif" }}>
                  <IconDownload size={14} /> Excel
                </button>
              </>
            )}
            {pastaHandle && (
              <span title={`Sincronizado com a pasta ${pastaNome}`} className="flex items-center gap-1 text-[10px]" style={{ color: pastaStatus === "erro" ? "#E8877A" : "#8FD9A8" }}>
                <IconRefresh size={11} />
              </span>
            )}
            <span className="text-[11px] font-semibold px-1.5 py-0.5 rounded" style={{ color: "#1C1E22", background: "#E8A33D", fontFamily: "'JetBrains Mono', monospace" }}>{APP_VERSION}</span>
            <button onClick={() => setShowSettings(true)} className="text-white/70 hover:text-white p-1.5"><IconSettings size={18} /></button>
          </div>
        </div>
        <div className="max-w-3xl mx-auto flex flex-wrap gap-1 mt-4">
          {tabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} className="flex items-center gap-1.5 px-2.5 sm:px-3.5 py-2 rounded-t-md text-[11px] sm:text-xs font-semibold uppercase tracking-wide"
                    style={{ background: tab === t.id ? "#F4F1E8" : "transparent", color: tab === t.id ? "#1C1E22" : "rgba(255,255,255,0.6)", fontFamily: "'Oswald', sans-serif" }}>
              <t.icon size={14} /> {t.label}
            </button>
          ))}
        </div>
      </div>

      <div className="max-w-3xl w-full mx-auto px-4 sm:px-6 py-5 flex-1">
        {saveError && (
          <div className="mb-4 text-xs px-3 py-2 rounded flex items-center gap-2 flex-wrap" style={{ background: "#F7E4E0", color: "#B5473A" }}>
            <IconAlert size={14} /> {saveError}
            <button onClick={() => setShowSettings(true)} className="underline font-semibold shrink-0">Abrir Configurações</button>
          </div>
        )}
        {pastaPrecisaReconectar && (
          <div className="mb-4 text-xs px-3 py-2 rounded flex items-center gap-2 flex-wrap" style={{ background: "#FDF6EC", color: "#B5762A", border: "1px solid #E8C79A" }}>
            <IconRefresh size={14} />
            A pasta <b>{pastaNome}</b> precisa que você confirme o acesso de novo nesta sessão — até lá, o que você lançar fica só neste navegador.
            <button onClick={reconectarPasta} className="font-semibold uppercase tracking-wide px-2.5 py-1 rounded text-white shrink-0" style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}>Reconectar pasta</button>
          </div>
        )}
        {pastaStatus === "bloqueado" && (
          <div className="mb-4 text-xs px-3 py-2 rounded flex items-center gap-2 flex-wrap" style={{ background: "#F7E4E0", color: "#B5473A" }}>
            <IconAlert size={14} />
            Os dados aqui ficaram vazios — para não apagar o que já está salvo na pasta <b>{pastaNome}</b>, a gravação foi pausada.
            <button onClick={reconectarPasta} className="font-semibold uppercase tracking-wide px-2.5 py-1 rounded text-white shrink-0" style={{ background: "#B5473A", fontFamily: "'Oswald', sans-serif" }}>Recarregar dados da pasta</button>
          </div>
        )}
        {dropboxStatus === "bloqueado" && (
          <div className="mb-4 text-xs px-3 py-2 rounded flex items-center gap-2 flex-wrap" style={{ background: "#F7E4E0", color: "#B5473A" }}>
            <IconAlert size={14} />
            Os dados aqui ficaram vazios — para não apagar o que já está salvo no Dropbox, a gravação foi pausada.
            <button onClick={() => setShowSettings(true)} className="font-semibold uppercase tracking-wide px-2.5 py-1 rounded text-white shrink-0" style={{ background: "#B5473A", fontFamily: "'Oswald', sans-serif" }}>Abrir Configurações</button>
          </div>
        )}

        {tab === "dashboard" ? (
          <div className="flex flex-col gap-5">
            <div className="flex flex-wrap items-end gap-2">
              {[{ id: "todos", label: "Todos os períodos" }, { id: "mes-atual", label: "Este mês" }, { id: "mes-anterior", label: "Mês anterior" }, { id: "personalizado", label: "Personalizado" }].map(p => (
                <button key={p.id} onClick={() => setPeriodo(p.id)} className="px-3 py-1.5 rounded-md text-xs font-semibold uppercase tracking-wide border"
                        style={{ background: periodo === p.id ? "#1C1E22" : "#FFFFFF", color: periodo === p.id ? "#FFFFFF" : "#24221D", borderColor: periodo === p.id ? "#1C1E22" : "#D9D3C4", fontFamily: "'Oswald', sans-serif" }}>
                  {p.label}
                </button>
              ))}
              {periodo === "personalizado" && (
                <div className="flex items-center gap-1.5">
                  <input type="date" value={dataInicio} onChange={e => setDataInicio(e.target.value)} className="px-2 py-1.5 rounded-md text-xs" style={inputStyle} />
                  <span className="text-xs" style={{ color: "#8A8577" }}>até</span>
                  <input type="date" value={dataFim} onChange={e => setDataFim(e.target.value)} className="px-2 py-1.5 rounded-md text-xs" style={inputStyle} />
                </div>
              )}
            </div>

            <div className="flex flex-col gap-2">
              <h3 className="text-sm font-semibold uppercase tracking-wide" style={{ fontFamily: "'Oswald', sans-serif", color: "#4C7A5E" }}>Pago e recebido no período</h3>
              <div className="flex flex-wrap gap-3">
                <StatCard label="Recebido" value={currency(totalRecebido)} icon={IconCheck} tone="success" />
                <StatCard label="Comissão paga" value={currency(comissaoPaga)} icon={IconUser} tone="accent" />
                <StatCard label="Combustível pago" value={currency(totalCombustivel)} icon={IconFuel} tone="accent" />
                <StatCard label="Pedágio pago" value={currency(totalPedagio)} icon={IconToll} tone="accent" />
                <StatCard label="Manutenção paga" value={currency(totalManutencao)} icon={IconWrench} tone="accent" />
                <StatCard label="Saldo estimado" value={currency(saldo)} icon={saldo >= 0 ? IconTrendUp : IconTrendDown} tone={saldo >= 0 ? "success" : "danger"} />
              </div>
            </div>

            <div className="flex flex-col gap-2">
              <h3 className="text-sm font-semibold uppercase tracking-wide" style={{ fontFamily: "'Oswald', sans-serif", color: "#B5473A" }}>Ainda precisa ser pago ou recebido</h3>

            {motoristaVisualizacao !== "acerto" && creditos.filter(cr => cr.tipo === "motorista" && (motoristaFiltro === "todos" || cr.chave === motoristaFiltro)).length > 0 && (
              <div className="rounded-md overflow-hidden" style={{ background: "#FDF6EC", border: "1px solid #E8C79A" }}>
                <div className="px-3 py-2 text-xs font-semibold uppercase tracking-wide" style={{ color: "#B5762A", fontFamily: "'Oswald', sans-serif" }}>
                  Créditos disponíveis (comprovantes com saldo, ainda não usados numa despesa/comissão)
                </div>
                <div className="flex flex-col gap-2 p-3">
                  {creditos.filter(cr => cr.tipo === "motorista" && (motoristaFiltro === "todos" || cr.chave === motoristaFiltro)).map(cr => (
                    <div key={cr.id} className="flex items-center gap-2 text-xs px-2.5 py-1.5 rounded" style={{ background: "#FFFFFF", border: "1px solid #D9D3C4" }}>
                      {cr.comprovanteThumb
                        ? <img src={cr.comprovanteThumb} alt="comprovante" onClick={() => setImagemAmpliada(cr.comprovanteThumb)} className="w-8 h-8 object-cover rounded shrink-0 cursor-zoom-in" style={{ border: "1px solid #D9D3C4" }} />
                        : <div className="w-8 h-8 rounded shrink-0 flex items-center justify-center" style={{ border: "1px solid #D9D3C4" }}><IconFile size={13} style={{ color: "#8A8577" }} /></div>}
                      <span style={{ color: "#24221D" }}>{cr.chave}</span>
                      <span style={{ color: "#8A8577" }}>{cr.data ? new Date(cr.data + "T00:00:00").toLocaleDateString("pt-BR") : ""}</span>
                      <span className="ml-auto font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#4C7A5E" }}>{currency(cr.valor)}</span>
                      <button onClick={() => deleteCredito(cr.id)} title="Remover este crédito" style={{ color: "#B5473A" }}><IconTrash size={13} /></button>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {(motoristaFiltro === "todos" ? config.motoristas : [motoristaFiltro]).map((nome) => {
              const fretesM = fretesDoMotorista(nome).filter(f => f.comissaoMotorista > 0 && dentroDoPeriodoSel(f.dataTiquete, motoristaPeriodo, motoristaDataInicio, motoristaDataFim));
              const custosM = custosDoMotorista(nome).filter(c => dentroDoPeriodoSel(c.data, motoristaPeriodo, motoristaDataInicio, motoristaDataFim));
              const extrato = extratoMotorista(nome).filter(l => dentroDoPeriodoSel(l.data, motoristaPeriodo, motoristaDataInicio, motoristaDataFim));
              const itensComissaoM = fretesM.map(comissaoComoItem);
              const comissaoPagaM = itensComissaoM.reduce((s, item) => s + Math.min(valorPagoAcumulado(item), item.valor), 0);
              const comissaoAPagarM = itensComissaoM.reduce((s, item) => s + saldoPendenteCusto(item), 0);
              const ressarcidoM = custosM.reduce((s, c) => s + Math.min(valorPagoAcumulado(c), c.valor), 0);
              const aRessarcirM = custosM.reduce((s, c) => s + saldoPendenteCusto(c), 0);
              const aReceberDoMotoristaM = custosM.reduce((s, c) => s + excedenteCusto(c), 0) + itensComissaoM.reduce((s, item) => s + excedenteCusto(item), 0);
              const saldoAtualM = extrato.length ? extrato[extrato.length - 1].saldoAcumulado : 0;
              const todosItensM = [...custosM, ...itensComissaoM];
              return (
                <div key={nome} className="rounded-md overflow-hidden w-full min-w-0" style={{ background: "#FFFFFF", border: "1px solid #D9D3C4" }}>
                  <div className="px-3 py-2 text-xs font-semibold uppercase tracking-wide flex items-center gap-2" style={{ background: "#1C1E22", color: "#E8A33D", fontFamily: "'Oswald', sans-serif" }}>
                    <IconUser size={13} /> {nome}
                  </div>
                  <div className="px-3 pt-3">
                    <StatCard label="Saldo atual (a pagar ao motorista)" value={currency(saldoAtualM)} icon={saldoAtualM >= 0 ? IconAlert : IconCheck} tone={saldoAtualM > 0 ? "danger" : "success"} />
                  </div>
                  <div className="px-3 pt-3 flex flex-col gap-1.5">
                    <span className="text-[11px] font-semibold uppercase tracking-wide" style={{ color: "#4C7A5E" }}>Pago e ressarcido no período</span>
                    <div className="flex flex-wrap gap-3">
                      <StatCard label="Comissão paga" value={currency(comissaoPagaM)} icon={IconCheck} tone="success" />
                      <StatCard label="Ressarcido" value={currency(ressarcidoM)} icon={IconRefresh} tone="success" />
                    </div>
                  </div>
                  <div className="px-3 py-3 flex flex-col gap-1.5">
                    <span className="text-[11px] font-semibold uppercase tracking-wide" style={{ color: "#B5473A" }}>Ainda precisa ser pago ou ressarcido</span>
                    <div className="flex flex-wrap gap-3">
                      <StatCard label="Comissão a pagar" value={currency(comissaoAPagarM)} icon={IconClock} tone={comissaoAPagarM > 0 ? "danger" : "success"} />
                      <StatCard label="A ressarcir" value={currency(aRessarcirM)} icon={IconClock} tone={aRessarcirM > 0 ? "danger" : "success"} />
                      <StatCard label="Motorista deve devolver" value={currency(aReceberDoMotoristaM)} icon={IconAlert} tone={aReceberDoMotoristaM > 0 ? "danger" : "success"} />
                    </div>
                  </div>
                  {motoristaVisualizacao !== "extrato" && motoristaVisualizacao !== "acerto" && fretesM.length > 0 && (
                    <div className="flex flex-col gap-1.5 px-3 pb-3">
                      <div className="text-[11px] font-semibold uppercase tracking-wide" style={{ color: "#8A8577" }}>Comissões por guia de frete</div>
                      {fretesM.slice().sort((a, b) => (a.dataTiquete || "").localeCompare(b.dataTiquete || "")).map(f => (
                        <ComissaoRow key={f.id} frete={f} onOpenPagamento={(fr) => toggleComissaoStatus(fr)} onToggleReverter={(fr) => toggleComissaoStatus(fr)} onAbrirImagem={setImagemAmpliada} todosItens={todosItensM} onRemoverPagamento={removerPagamento} />
                      ))}
                    </div>
                  )}
                  {motoristaVisualizacao !== "extrato" && motoristaVisualizacao !== "acerto" && custosM.length > 0 && (
                    <div className="flex flex-col gap-1.5 px-3 pb-3">
                      <div className="text-[11px] font-semibold uppercase tracking-wide" style={{ color: "#8A8577" }}>Despesas reembolsáveis</div>
                      {custosM.slice().sort((a, b) => (a.data || "").localeCompare(b.data || "")).map(c => (
                        <CustoRow key={c.id} custo={c} onDelete={deleteCusto} onToggleRessarcimento={toggleRessarcimento} onTogglePagamento={toggleCustoPagamento} onToggleParcela={toggleParcela} viagem={fretes.find(f => f.id === c.freteId)} onAbrirImagem={setImagemAmpliada} onOpen={setCustoAberto} todosCustos={custos} onRemoverPagamento={removerPagamento} />
                      ))}
                    </div>
                  )}
                  {motoristaVisualizacao !== "tickets" && motoristaVisualizacao !== "acerto" && (() => {
                    if (extrato.length === 0) return null;
                    return (
                      <div className="px-3 pb-3 no-motorista-extrato">
                        <div className="text-[11px] font-semibold uppercase tracking-wide mb-1.5" style={{ color: "#8A8577" }}>Extrato cronológico — saldo acumulado a pagar ao motorista</div>
                        <div className="overflow-x-auto rounded-md" style={{ border: "1px solid #D9D3C4" }}>
                          <table className="text-xs" style={{ minWidth: "560px", width: "100%" }}>
                            <thead><tr style={{ color: "#8A8577" }}>
                              <th className="px-3 py-2 text-left font-medium whitespace-nowrap">Data</th>
                              <th className="px-3 py-2 text-left font-medium whitespace-nowrap">Lançamento</th>
                              <th className="px-3 py-2 text-left font-medium">Descrição</th>
                              <th className="px-2 py-2 text-right font-medium">Valor</th>
                              <th className="px-3 py-2 text-right font-medium">Saldo acumulado</th>
                            </tr></thead>
                            <tbody>
                              {extrato.map((l, i) => (
                                <tr key={i} style={{ borderTop: "1px solid #EFEAE0" }}>
                                  <td className="px-3 py-1.5" style={{ color: "#8A8577" }}>{l.data ? new Date(l.data + "T00:00:00").toLocaleDateString("pt-BR") : "—"}</td>
                                  <td className="px-3 py-1.5 font-semibold" style={{ color: l.cor === "saida" ? "#B5473A" : "#4C7A5E" }}>{l.tipo}</td>
                                  <td className="px-3 py-1.5" style={{ color: "#8A8577" }}>{l.descricao}</td>
                                  <td className="px-2 py-1.5 text-right font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: l.cor === "saida" ? "#B5473A" : "#4C7A5E" }}>
                                    {l.efeito > 0 ? "+ " : "− "}{currency(l.valor)}
                                  </td>
                                  <td className="px-3 py-1.5 text-right font-bold" style={{ fontFamily: "'JetBrains Mono', monospace", color: l.saldoAcumulado >= 0 ? "#B5473A" : "#4C7A5E" }}>{currency(l.saldoAcumulado)}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    );
                  })()}
                </div>
              );
            })}
          </div>
        ) : (
          <div className="flex flex-col gap-4">
            <div className="flex flex-wrap items-center gap-2 no-print">
              <select value={relatorioFornecedor} onChange={(e) => setRelatorioFornecedor(e.target.value)} className="px-3 py-1.5 rounded-md text-xs" style={inputStyle}>
                <option value="todos">Todos os fornecedores</option>
                {nomesFornecedores.map(n => <option key={n} value={n}>{n}</option>)}
              </select>
              <select value={relatorioMotorista} onChange={(e) => setRelatorioMotorista(e.target.value)} className="px-3 py-1.5 rounded-md text-xs" style={inputStyle}>
                <option value="todos">Todos os motoristas</option>
                {config.motoristas.map(m => <option key={m} value={m}>{m}</option>)}
              </select>
              <input type="date" value={relatorioDataInicio} onChange={(e) => setRelatorioDataInicio(e.target.value)} className="px-2 py-1.5 rounded-md text-xs" style={inputStyle} />
              <span className="text-xs" style={{ color: "#8A8577" }}>até</span>
              <input type="date" value={relatorioDataFim} onChange={(e) => setRelatorioDataFim(e.target.value)} className="px-2 py-1.5 rounded-md text-xs" style={inputStyle} />
              <button onClick={exportarPDF} className="flex items-center gap-1.5 px-3 py-2 rounded-md text-xs font-semibold uppercase tracking-wide text-white" style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}>
                <IconFileText size={14} /> Exportar PDF
              </button>
              <button onClick={exportarExcel} className="flex items-center gap-1.5 px-3 py-2 rounded-md text-xs font-semibold uppercase tracking-wide border" style={{ borderColor: "#D9D3C4", color: "#24221D", fontFamily: "'Oswald', sans-serif" }}>
                <IconDownload size={14} /> Exportar Excel
              </button>
            </div>

            {relatorioPorData.length === 0 ? (
              <EmptyState text="Nenhum lançamento no período selecionado." />
            ) : (
              <div className="flex flex-col gap-4">
                {relatorioPorData.map(([data, grupo]) => {
                  const porContainer = {};
                  grupo.fretes.forEach(f => { const k = f.numeroContainer || "TBN"; (porContainer[k] = porContainer[k] || []).push(f); });
                  const containers = Object.entries(porContainer).sort((a, b) => a[0].localeCompare(b[0]));
                  return (
                    <div key={data}>
                      <div className="text-xs font-semibold uppercase tracking-wide mb-1.5" style={{ color: "#8A8577" }}>
                        {data === "Sem data" ? data : new Date(data + "T00:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" })}
                      </div>
                      <div className="flex flex-col gap-3">
                        {containers.map(([container, itens]) => (
                          <div key={container}>
                            <div className="text-[11px] font-semibold uppercase tracking-wide mb-1 flex items-center gap-1" style={{ color: "#B5762A" }}>
                              <IconContainer size={11} /> {container}
                            </div>
                            <div className="flex flex-col gap-2">
                              {itens.map(f => <TicketRow key={f.id} frete={f} onToggle={toggleStatus} onToggleComissao={toggleComissaoStatus} onDelete={deleteFrete} onOpen={setFreteAberto} showEmpresa dre={dreDaViagemNoRelatorio(f)} onAbrirImagem={setImagemAmpliada} />)}
                            </div>
                          </div>
                        ))}
                        {grupo.despesas.length > 0 && (
                          <div>
                            <div className="text-[11px] font-semibold uppercase tracking-wide mb-1" style={{ color: "#8A8577" }}>Despesas gerais (sem container/viagem)</div>
                            <div className="flex flex-col gap-2">
                              {grupo.despesas.map(c => (
                                <CustoRow key={c.id} custo={c} onDelete={deleteCusto} onToggleRessarcimento={toggleRessarcimento} onTogglePagamento={toggleCustoPagamento} onToggleParcela={toggleParcela} viagem={null} onAbrirImagem={setImagemAmpliada} onOpen={setCustoAberto} todosCustos={custos} onRemoverPagamento={removerPagamento} />
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>

      {showAddFrete && <AddFreteModal onClose={() => setShowAddFrete(false)} onSave={(rec) => {
        registrarCaminhaoSeNovo(rec.caminhao);
        const { frete: freteComCredito, creditosRestantes } = aplicarCreditoNaComissao(rec);
        if (creditosRestantes !== creditos) persistCreditos(creditosRestantes);
        persistFretes([...fretes, freteComCredito]);
        setShowAddFrete(false);
      }} />}
      {showAddCusto && (
        <AddCustoModal
          onClose={() => { setShowAddCusto(false); setCustoFreteId(null); }}
          onSave={(rec) => {
            registrarCaminhaoSeNovo(rec.veiculo);
            const { rec: recComCredito, creditosRestantes } = aplicarCreditoDisponivel(rec);
            if (creditosRestantes !== creditos) persistCreditos(creditosRestantes);
            persistCustos([...custos, recComCredito]);
            setShowAddCusto(false);
            setCustoFreteId(null);
          }}
          freteIdFixo={custoFreteId}
          fretesDisponiveis={fretes}
          custosExistentes={custos}
        />
      )}
      {freteAberto && (
        <FreteDetailModal
          frete={fretes.find(f => f.id === freteAberto.id) || freteAberto}
          custosDaViagem={custos.filter(c => c.freteId === freteAberto.id)}
          onClose={() => setFreteAberto(null)}
          onSave={(updated) => { registrarCaminhaoSeNovo(updated.caminhao); updateFrete(updated); setFreteAberto(null); }}
          onDelete={(id) => { deleteFrete(id); setFreteAberto(null); }}
          onAddCusto={() => { setCustoFreteId(freteAberto.id); setShowAddCusto(true); }}
          onDeleteCusto={deleteCusto}
          onToggleRessarcimento={toggleRessarcimento}
          onTogglePagamentoCusto={toggleCustoPagamento}
          onToggleParcela={toggleParcela}
          onAbrirImagem={setImagemAmpliada}
          todosCustos={custos}
          onRemoverPagamento={removerPagamento}
          onToggleComissao={toggleComissaoStatus}
        />
      )}
      {showSettings && (
        <SettingsModal
          onClose={() => setShowSettings(false)}
          fretes={fretes}
          custos={custos}
          onImport={(f, c) => { persistFretes(f); persistCustos(c); setShowSettings(false); }}
          onLiberarEspaco={liberarEspacoAntigo}
          pastaHandle={pastaHandle}
          pastaNome={pastaNome}
          pastaPrecisaReconectar={pastaPrecisaReconectar}
          pastaStatus={pastaStatus}
          conectarPasta={conectarPasta}
          reconectarPasta={reconectarPasta}
          desconectarPasta={desconectarPasta}
          dropboxConectado={dropboxConectado}
          dropboxStatus={dropboxStatus}
          desconectarDropbox={desconectarDropbox}
        />
      )}
      <ImageLightbox src={imagemAmpliada} onClose={() => setImagemAmpliada(null)} />
      {custoAberto && (
        <CustoDetailModal
          custo={custoAberto}
          fretesDisponiveis={fretes}
          onClose={() => setCustoAberto(null)}
          onSave={(updated) => { registrarCaminhaoSeNovo(updated.veiculo); updateCusto(updated); setCustoAberto(null); }}
          onDelete={(id) => { deleteCusto(id); setCustoAberto(null); }}
        />
      )}
      {pagamentoAlvo && (
        <PagamentoCustoModal
          custo={pagamentoAlvo}
          custosRelacionados={pagamentoAlvo.pagoPor === "motorista"
            ? (() => {
                const outrasComissoes = fretes.filter(f => f.motorista === pagamentoAlvo.motorista && f.comissaoMotorista > 0 && (COMISSAO_PREFIXO_ID + f.id) !== pagamentoAlvo.id).map(comissaoComoItem);
                const outrasDespesas = custos.filter(c => c.pagoPor === "motorista" && c.motorista === pagamentoAlvo.motorista && c.id !== pagamentoAlvo.id);
                if (pagamentoAlvo.tipo === "comissao") {
                  // Pagamento originado na aba Fretes (comissão): prioriza quitar outras
                  // comissões pendentes do motorista primeiro; só sugere ressarcir despesas
                  // quando não sobrar nenhuma comissão pendente.
                  const comissoesPendentes = outrasComissoes.filter(item => !custoEstaLiquidado(item));
                  return comissoesPendentes.length > 0 ? comissoesPendentes : outrasDespesas;
                }
                return [...outrasDespesas, ...outrasComissoes];
              })()
            : custos.filter(c => {
                if (c.id === pagamentoAlvo.id) return false;
                const chaveAlvo = pagamentoAlvo.tipo === "combustivel" ? pagamentoAlvo.posto : pagamentoAlvo.fornecedor;
                const chaveC = c.tipo === "combustivel" ? c.posto : c.fornecedor;
                return c.pagoPor === "empresa" && c.formaPagamento !== "parcelado" && chaveAlvo && chaveC && chaveC === chaveAlvo;
              })}
          onClose={() => setPagamentoAlvo(null)}
          onConfirm={confirmarPagamentoCusto}
        />
      )}
      {parcelaAlvo && (
        <ParcelaPagamentoModal
          parcela={parcelaAlvo.parcela}
          indice={parcelaAlvo.indice}
          onClose={() => setParcelaAlvo(null)}
          onConfirm={confirmarPagamentoParcela}
        />
      )}
      {dataPagamentoAlvo && (
        <DataPagamentoModal
          titulo="Data do recebimento do frete"
          onClose={() => setDataPagamentoAlvo(null)}
          onConfirm={confirmarDataPagamentoFrete}
        />
      )}
    </div>
  );
}

function Raiz() {
  return (
    <ConfigProvider>
      <AvisoVersaoNova />
      <LoginGate><ControleFretes /></LoginGate>
    </ConfigProvider>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Raiz />);
</script>
<script>
  (function () {
    var source = document.getElementById("app-source").textContent;
    var output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }], "env"]
    }).code;
    var el = document.createElement("script");
    el.textContent = output;
    document.body.appendChild(el);
  })();
</script>
</body>
</html>
