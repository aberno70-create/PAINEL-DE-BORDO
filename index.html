/* ===========================================================
   PASTA DE ARMAZENAMENTO (computador, pendrive ou pasta sincronizada
   com a nuvem — Google Drive, OneDrive, Dropbox etc.)
   O localStorage do navegador tem limite de poucos MB. Guardando os
   dados como um arquivo numa pasta, esse limite deixa de existir —
   e, se a pasta for sincronizada com a nuvem, dá para abrir o mesmo
   arquivo (este HTML) em outro computador com os dados atualizados,
   desde que a sincronização já tenha terminado.
   Disponível apenas em navegadores baseados em Chromium (Chrome,
   Edge, Opera) — a API não existe no Safari nem no Firefox.
=========================================================== */
const NOME_ARQUIVO_DADOS = "painel-de-bordo-dados.json";

// Pequeno banco IndexedDB só para guardar a referência (handle) da pasta escolhida,
// já que esse tipo de referência não pode ser salvo em localStorage.
function idbAbrir() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("painel_bordo_fs", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("handles");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSalvarPasta(handle) {
  const db = await idbAbrir();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(handle, "pasta");
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbCarregarPasta() {
  const db = await idbAbrir();
  return new Promise((resolve) => {
    const tx = db.transaction("handles", "readonly");
    const req = tx.objectStore("handles").get("pasta");
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}
async function idbRemoverPasta() {
  const db = await idbAbrir();
  return new Promise((resolve) => {
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").delete("pasta");
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => resolve(false);
  });
}

/* ===========================================================
   DROPBOX (funciona em qualquer navegador, inclusive no celular)
   Usa o fluxo OAuth2 "Authorization Code with PKCE" — não precisa
   de servidor nem de "client secret" exposto: só da App Key que o
   usuário cria de graça no painel de desenvolvedores do Dropbox.
   O app lê/grava um único arquivo JSON na pasta do app no Dropbox
   da pessoa (escopo "App folder", sem acesso ao resto da conta).
=========================================================== */
const LS_DROPBOX = {
  appKey: "gvgs_dropbox_app_key",
  accessToken: "gvgs_dropbox_access_token",
  refreshToken: "gvgs_dropbox_refresh_token",
  expiraEm: "gvgs_dropbox_expira_em",
  verifier: "gvgs_dropbox_pkce_verifier" // só usado durante o login, removido depois
};
const NOME_ARQUIVO_DROPBOX = "/painel-de-bordo-dados.json";

// App Key do app do Dropbox da GVGS. É pública por natureza: no fluxo PKCE não existe
// "client secret" no navegador, então deixar fixa aqui não expõe nada — só evita ter que
// digitar de novo a cada versão nova do arquivo.
const DROPBOX_APP_KEY_PADRAO = "605q5upo3xlsfyq";
try {
  if (!localStorage.getItem(LS_DROPBOX.appKey)) {
    localStorage.setItem(LS_DROPBOX.appKey, DROPBOX_APP_KEY_PADRAO);
  }
} catch (e) { /* navegador sem localStorage — segue sem travar */ }

function dropboxGerarVerifier() {
  const bytes = new Uint8Array(64);
  crypto.getRandomValues(bytes);
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
}
async function dropboxDesafioPKCE(verifier) {
  const data = new TextEncoder().encode(verifier);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
}
function dropboxRedirectUri() {
  // Volta pra mesma URL em que o app está rodando agora (sem parâmetros extras).
  return window.location.origin + window.location.pathname;
}
async function dropboxIniciarLogin(appKey) {
  const verifier = dropboxGerarVerifier();
  localStorage.setItem(LS_DROPBOX.verifier, verifier);
  localStorage.setItem(LS_DROPBOX.appKey, appKey);
  const challenge = await dropboxDesafioPKCE(verifier);
  const params = new URLSearchParams({
    client_id: appKey,
    response_type: "code",
    code_challenge: challenge,
    code_challenge_method: "S256",
    token_access_type: "offline",
    redirect_uri: dropboxRedirectUri()
  });
  window.location.href = `https://www.dropbox.com/oauth2/authorize?${params.toString()}`;
}
async function dropboxTrocarCodigoPorToken(code) {
  const appKey = localStorage.getItem(LS_DROPBOX.appKey);
  const verifier = localStorage.getItem(LS_DROPBOX.verifier);
  if (!appKey || !verifier) return false;
  const params = new URLSearchParams({
    code, grant_type: "authorization_code", client_id: appKey,
    code_verifier: verifier, redirect_uri: dropboxRedirectUri()
  });
  const resp = await fetch("https://api.dropboxapi.com/oauth2/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: params.toString()
  });
  if (!resp.ok) return false;
  const dados = await resp.json();
  localStorage.setItem(LS_DROPBOX.accessToken, dados.access_token);
  localStorage.setItem(LS_DROPBOX.refreshToken, dados.refresh_token);
  localStorage.setItem(LS_DROPBOX.expiraEm, String(Date.now() + (dados.expires_in - 60) * 1000));
  localStorage.removeItem(LS_DROPBOX.verifier);
  return true;
}
async function dropboxRenovarToken() {
  const appKey = localStorage.getItem(LS_DROPBOX.appKey);
  const refreshToken = localStorage.getItem(LS_DROPBOX.refreshToken);
  if (!appKey || !refreshToken) return false;
  const params = new URLSearchParams({ grant_type: "refresh_token", refresh_token: refreshToken, client_id: appKey });
  const resp = await fetch("https://api.dropboxapi.com/oauth2/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: params.toString()
  });
  if (!resp.ok) return false;
  const dados = await resp.json();
  localStorage.setItem(LS_DROPBOX.accessToken, dados.access_token);
  localStorage.setItem(LS_DROPBOX.expiraEm, String(Date.now() + (dados.expires_in - 60) * 1000));
  return true;
}
async function dropboxTokenValido() {
  const expiraEm = Number(localStorage.getItem(LS_DROPBOX.expiraEm) || 0);
  if (Date.now() < expiraEm) return localStorage.getItem(LS_DROPBOX.accessToken);
  const ok = await dropboxRenovarToken();
  return ok ? localStorage.getItem(LS_DROPBOX.accessToken) : null;
}
function dropboxEstaConectado() {
  return !!localStorage.getItem(LS_DROPBOX.refreshToken);
}
function dropboxDesconectar() {
  Object.values(LS_DROPBOX).forEach((k) => localStorage.removeItem(k));
}
async function dropboxLerDados() {
  const token = await dropboxTokenValido();
  if (!token) throw new Error("SEM_TOKEN");
  const resp = await fetch("https://content.dropboxapi.com/2/files/download", {
    method: "POST",
    headers: { Authorization: `Bearer ${token}`, "Dropbox-API-Arg": JSON.stringify({ path: NOME_ARQUIVO_DROPBOX }) }
  });
  if (resp.status === 409) return null; // arquivo ainda não existe — normal na primeira conexão

}
async function dropboxEscreverDados(dados) {
  const token = await dropboxTokenValido();
  if (!token) throw new Error("SEM_TOKEN");
  const resp = await fetch("https://content.dropboxapi.com/2/files/upload", {

      "Content-Type": "application/octet-stream"

/* ===========================================================
   CAIXA DE ENTRADA NO DROPBOX (pasta do app)
   Voce manda a foto do celular para a pasta ENTRADA dentro da
   pasta do app no Dropbox; o app le, propoe e lanca.
=========================================================== */
const PASTA_ENTRADA_DBX = "/ENTRADA";
const PASTA_LANCADOS_DBX = "/LANCADOS";

async function dropboxRpc(endpoint, corpo) {
  const token = await dropboxTokenValido();
  if (!token) throw new Error("SEM_TOKEN");
  const resp = await fetch("https://api.dropboxapi.com/2/" + endpoint, {
    method: "POST",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify(corpo)
  });
  if (resp.status === 401 || resp.status === 403) {
    const t = await resp.text();
    if (/scope/i.test(t)) throw new Error("SEM_PERMISSAO_LISTAR");
    throw new Error("SEM_TOKEN");
  }
  if (!resp.ok) {
    const t = await resp.text();
    if (/not_found/.test(t)) return null;
    throw new Error("FALHA_DROPBOX: " + t.slice(0, 120));
  }
  return resp.json();
}

async function dropboxGarantirPastas() {

}

async function dropboxListarEntrada() {
  const r = await dropboxRpc("files/list_folder", { path: PASTA_ENTRADA_DBX, limit: 200 });
  if (!r) return [];
  const exts = [".jpg", ".jpeg", ".png", ".webp", ".pdf", ".heic"];
  return (r.entries || [])
    .filter(e => e[".tag"] === "file")
    .filter(e => exts.some(x => e.name.toLowerCase().endsWith(x)))
    .sort((a, b) => a.name.localeCompare(b.name));
}

function blobParaDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

async function hashDoArquivo(blob) {
  try {
    const buf = await blob.arrayBuffer();
    const h = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { return null; }
}

// Uma chamada so: descobre O QUE e o documento e ja extrai os campos.
async function classificarDocumento(dataUrl) {
  const media_type = dataUrl.substring(5, dataUrl.indexOf(";"));
  const data = dataUrl.split(",")[1];
  const isPdf = media_type === "application/pdf";
  const bloco = isPdf
    ? { type: "document", source: { type: "base64", media_type: "application/pdf", data } }
    : { type: "image", source: { type: "base64", media_type, data } };
  return callClaudeVision([
    bloco,
    {
      type: "text",
      text:
        "Documento de uma transportadora rodoviária brasileira. Responda APENAS com JSON válido, sem markdown:\n" +
        '{ "tipoDocumento": ("comprovante_bancario"|"nota_fiscal"|"cupom"|"tiquete_frete"|"outro"),\n' +
        '  "categoria": ("frete"|"despesa"|"pagamento"|"recebimento"),\n' +
        '  "tipoCusto": ("combustivel"|"pedagio"|"manutencao"|""),\n' +
        '  "valor": (número), "data": ("AAAA-MM-DD" ou ""), "numeroContainer": (string ou ""),\n' +
        '  "cteNumero": (string ou ""), "cliente": (string ou ""), "fornecedor": (posto/oficina ou ""),\n' +
        '  "pagador": (string ou ""), "recebedor": (string ou ""),\n' +
        '  "litros": (número ou 0), "descricao": (string curta) }\n\n' +
        "REGRA IMPORTANTE: um comprovante bancário (PIX/TED/transferência) NUNCA é despesa — " +
        "ele só movimenta dinheiro, então a categoria é pagamento ou recebimento. " +
        "Só nota fiscal, cupom ou recibo do fornecedor é despesa. " +
        "Tíquete/CTe da transportadora é frete."
    }
  ]);
}

function padronizarContainerApp(txt) {
  if (!txt) return "";
  const limpo = String(txt).replace(/[^A-Za-z0-9]/g, "").toUpperCase();
  const m = limpo.match(/^([A-Z]{4})(\d{6})(\d)$/);
  return m ? `${m[1]} ${m[2]}-${m[3]}` : String(txt).trim().toUpperCase();
}

async function callClaudeVision(contentBlocks) {
  const apiKey = localStorage.getItem(LS_KEYS.apiKey);
  if (!apiKey) throw new Error("SEM_CHAVE_API");

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: contentBlocks }]
    })
  });

  if (!response.ok) {
    const text = await response.text().catch(() => "");
    throw new Error("ERRO_API: " + response.status + " " + text.slice(0, 200));
  }
  const json = await response.json();
  const text = (json.content || []).map((b) => b.text || "").join("").trim();
  const clean = text.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function resizeImage(dataUrl, maxW = 480) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

// Gera uma miniatura real (JPEG) a partir da 1ª página de um PDF, para o documento
// (tíquete, custo ou comprovante) ter uma prévia visual igual à de uma foto.
// Se o pdf.js não carregar ou falhar por qualquer motivo, retorna null e o app
// segue normalmente mostrando o ícone de arquivo no lugar da miniatura.
async function pdfThumbnail(dataUrl, maxW = 480) {
  try {
    const lib = window.pdfjsLib;
    if (!lib) return null;
    lib.GlobalWorkerOptions.workerSrc = "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    const base64 = dataUrl.split(",")[1];
    const binario = atob(base64);
    const bytes = new Uint8Array(binario.length);
    for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
    const pdf = await lib.getDocument({ data: bytes }).promise;
    const page = await pdf.getPage(1);
    const viewportBase = page.getViewport({ scale: 1 });
    const scale = Math.min(2, maxW / viewportBase.width);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    return canvas.toDataURL("image/jpeg", 0.72);
  } catch (e) {
    return null;
  }
}

// Valor total já pago/ressarcido para uma despesa — soma os pagamentos detalhados; para
// registros antigos (sem essa lista), cai para o status simples que já existia, então nada
// que já estava marcado como pago/ressarcido aparece como pendente depois desta atualização.
const valorPagoAcumulado = (c) => {
  if (c.pagamentos && c.pagamentos.length > 0) return c.pagamentos.reduce((s, p) => s + p.valor, 0);
  if (c.pagoPor === "motorista") return c.statusRessarcimento === "ressarcido" ? (c.valorReembolsado != null ? c.valorReembolsado : c.valor) : 0;
  return (c.statusPagamento || "pendente") === "pago" ? c.valor : 0;
};
const saldoPendenteCusto = (c) => Math.max(c.valor - valorPagoAcumulado(c), 0);
// Quando o valor pago/ressarcido passa do valor da despesa, o excedente fica registrado aqui
// (para custo pago pelo motorista, é o valor que o motorista deve devolver).
const excedenteCusto = (c) => Math.max(valorPagoAcumulado(c) - c.valor, 0);
const custoEstaLiquidado = (c) => {
  if (c.formaPagamento === "parcelado" && c.parcelas && c.parcelas.length) {
    return c.parcelas.every((p) => p.status === "pago");
  }
  return valorPagoAcumulado(c) >= c.valor - 0.005;
};
// Compatível com registros antigos (ressarcimento único, sem lista de pagamentos):
// >0 = ainda falta ressarcir; <0 = motorista deve devolver a diferença.
const diferencaReembolso = (c) => {
  if (c.pagoPor !== "motorista") return 0;
  return saldoPendenteCusto(c) - excedenteCusto(c);
};

// Variantes "na data": o Resumo fica travado no período filtrado — mesmo que uma despesa
// tenha sido paga/ressarcida (ou um frete recebido) numa data posterior à selecionada, o
// quadro deve espelhar a situação como ela estava até aquele momento, não o status atual.
// Sem o detalhamento de pagamentos (registros antigos ou parcelas sem data), cai para o
// status atual — é a melhor informação disponível nesses casos.
const valorPagoAcumuladoAteData = (c, limite) => {
  if (c.pagamentos && c.pagamentos.length > 0) {
    return c.pagamentos.filter(p => !limite || (p.data || "9999-99-99") <= limite).reduce((s, p) => s + p.valor, 0);
  }
  return valorPagoAcumulado(c);
};
const saldoPendenteCustoAteData = (c, limite) => Math.max(c.valor - valorPagoAcumuladoAteData(c, limite), 0);
const excedenteCustoAteData = (c, limite) => Math.max(valorPagoAcumuladoAteData(c, limite) - c.valor, 0);
const custoEstaLiquidadoAteData = (c, limite) => {
  if (c.formaPagamento === "parcelado" && c.parcelas && c.parcelas.length) {
    return c.parcelas.every((p) => p.status === "pago");
  }
  return valorPagoAcumuladoAteData(c, limite) >= c.valor - 0.005;
};
// Frete: usa a data em que foi marcado como recebido (dataPagamento) para decidir se, na
// data-limite do período, ele já contava como recebido.
const freteRecebidoAteData = (f, limite) => {
  if (f.status !== "pago") return false;
  if (!limite || !f.dataPagamento) return f.status === "pago";
  return f.dataPagamento.slice(0, 10) <= limite;
};

// A comissão gerada por um frete vira um "documento" na aba Motorista, com o mesmo critério
// de pagamento parcial, comprovante e soma acumulada usado nos tickets de despesa/ressarcimento.
// Esta função só monta a representação — quem persiste os pagamentos é frete.comissaoPagamentos.
const COMISSAO_PREFIXO_ID = "comissao-";
const comissaoComoItem = (f) => ({
  id: COMISSAO_PREFIXO_ID + f.id,
  tipo: "comissao",
  itemPrincipal: "",
  valor: f.comissaoMotorista || 0,
  pagamentos: f.comissaoPagamentos || [],
  pagoPor: "motorista",
  motorista: f.motorista || "",
  data: f.dataTiquete || "",
  numeroContainer: f.numeroContainer || "",
  cliente: f.cliente || "",
  freteRef: f,
  // ponte com registros antigos, de antes de existir a lista de pagamentos:
  statusRessarcimento: f.statusComissao === "pago" ? "ressarcido" : "pendente",
  valorReembolsado: f.statusComissao === "pago" ? f.comissaoMotorista : null
});

/* ===========================================================
   CONFIGURAÇÃO DA EMPRESA (nome, cliente padrão, motoristas)
   — torna o app reutilizável para outras transportadoras.
=========================================================== */
function loadConfig() {
  const saved = lsGet(LS_KEYS.config);
  if (!saved) return { ...DEFAULT_CONFIG };
  return {
    ...DEFAULT_CONFIG, ...saved,
    motoristas: (saved.motoristas && saved.motoristas.length) ? saved.motoristas : DEFAULT_CONFIG.motoristas,
    caminhoes: saved.caminhoes || []
  };
}
const ConfigContext = React.createContext({ config: DEFAULT_CONFIG, atualizarConfig: () => {} });
function useConfig() { return React.useContext(ConfigContext); }

function ConfigProvider({ children }) {
  const [config, setConfig] = useState(() => {
    const inicial = loadConfig();
    // Se as credenciais já vieram junto com os dados numa sessão anterior, devolve
    // elas para o localStorage antes do app começar a usar.
    try {
      if (inicial && inicial.apiKey) localStorage.setItem(LS_KEYS.apiKey, inicial.apiKey);
      if (inicial && inicial.dropboxAppKey) localStorage.setItem(LS_DROPBOX.appKey, inicial.dropboxAppKey);
    } catch (e) { /* sem localStorage — segue */ }
    return inicial;
  });
  const atualizarConfig = (novo) => {
    // As credenciais viajam dentro do arquivo de dados (Dropbox / pasta conectada).
    // Assim, ao abrir uma versão nova do app, basta conectar o Dropbox uma vez que a
    // chave da API volta junto com os lançamentos — não precisa digitar de novo.
    try {
      if (novo && novo.apiKey) localStorage.setItem(LS_KEYS.apiKey, novo.apiKey);
      if (novo && novo.dropboxAppKey) localStorage.setItem(LS_DROPBOX.appKey, novo.dropboxAppKey);
    } catch (e) { /* sem localStorage — segue */ }
    setConfig(novo);
    lsSet(LS_KEYS.config, novo);
  };
  return <ConfigContext.Provider value={{ config, atualizarConfig }}>{children}</ConfigContext.Provider>;
}

/* ===========================================================
   CONFIGURAÇÕES (chave de API + backup)
=========================================================== */
function SettingsModal({ onClose, fretes, custos, onImport, onLiberarEspaco, pastaHandle, pastaNome, pastaPrecisaReconectar, pastaStatus, conectarPasta, reconectarPasta, desconectarPasta, dropboxConectado, dropboxStatus, desconectarDropbox }) {
  const [dropboxAppKey, setDropboxAppKey] = useState(() => localStorage.getItem(LS_DROPBOX.appKey) || DROPBOX_APP_KEY_PADRAO);
  const { config, atualizarConfig } = useConfig();
  const [apiKey, setApiKey] = useState(localStorage.getItem(LS_KEYS.apiKey) || "");
  const [saved, setSaved] = useState(false);
  const [mostrarApiKey, setMostrarApiKey] = useState(false);
  const [liberado, setLiberado] = useState(null);
  const fileRef = useRef(null);

  // Estimativa do espaço usado no armazenamento local do navegador (localStorage costuma ter
  // limite de 5 a 10 MB por site — a maioria dos navegadores garante pelo menos 5 MB).
  const usoArmazenamento = (() => {
    let bytes = 0;
    Object.values(LS_KEYS).forEach((k) => {
      const v = localStorage.getItem(k);
      if (v) bytes += new Blob([v]).size;
    });
    const mb = bytes / (1024 * 1024);
    const percentual = Math.min(100, Math.round((mb / 5) * 100));
    return { mb, percentual };
  })();

  const liberarEspaco = () => {
    const resultado = onLiberarEspaco();
    setLiberado(resultado);
    setTimeout(() => setLiberado(null), 4000);
  };

  const [nomeEmpresa, setNomeEmpresa] = useState(config.nomeEmpresa);
  const [clientePadrao, setClientePadrao] = useState(config.clientePadrao);
  const [novoMotorista, setNovoMotorista] = useState("");
  const [novoCaminhao, setNovoCaminhao] = useState("");
  const [empresaSalva, setEmpresaSalva] = useState(false);

  const salvarDadosEmpresa = () => {
    atualizarConfig({ ...config, nomeEmpresa: nomeEmpresa.trim() || DEFAULT_CONFIG.nomeEmpresa, clientePadrao: clientePadrao.trim() });
    setEmpresaSalva(true);
    setTimeout(() => setEmpresaSalva(false), 1500);
  };

  const adicionarMotorista = () => {
    const nome = novoMotorista.trim();
    if (!nome || config.motoristas.includes(nome)) return;
    atualizarConfig({ ...config, motoristas: [...config.motoristas, nome] });
    setNovoMotorista("");
  };

  const removerMotorista = (nome) => {
    if (config.motoristas.length <= 1) return;
    atualizarConfig({ ...config, motoristas: config.motoristas.filter(m => m !== nome) });
  };

  const adicionarCaminhao = () => {
    const nome = novoCaminhao.trim();
    if (!nome || config.caminhoes.includes(nome)) return;
    atualizarConfig({ ...config, caminhoes: [...config.caminhoes, nome] });
    setNovoCaminhao("");
  };

  const removerCaminhao = (nome) => {
    atualizarConfig({ ...config, caminhoes: config.caminhoes.filter(c => c !== nome) });
  };

  const [senhaAtual, setSenhaAtual] = useState("");
  const [novaSenha, setNovaSenha] = useState("");
  const [confirmarNovaSenha, setConfirmarNovaSenha] = useState("");
  const [erroSenha, setErroSenha] = useState("");
  const [senhaSalva, setSenhaSalva] = useState(false);
  const [temSenhaLocal, setTemSenhaLocal] = useState(() => !!localStorage.getItem(LS_KEYS.senhaHash));

  const removerSenha = () => {
    if (!confirm("Tirar a senha deste dispositivo?\n\n" +
                 "O app passa a abrir direto. Seus lançamentos continuam protegidos " +
                 "pelo login do Dropbox.")) return;
    localStorage.removeItem(LS_KEYS.senhaHash);
    sessionStorage.setItem(SS_UNLOCKED, "true");
    setSenhaAtual(""); setNovaSenha(""); setConfirmarNovaSenha("");
    setErroSenha("");
    setSenhaSalva(true);
    setTimeout(() => setSenhaSalva(false), 2000);
  };

  const definirSenha = async () => {
    setErroSenha("");
    if (novaSenha.length < 4) { setErroSenha("Use pelo menos 4 caracteres."); return; }
    if (novaSenha !== confirmarNovaSenha) { setErroSenha("As senhas não coincidem."); return; }
    localStorage.setItem(LS_KEYS.senhaHash, await sha256Hex(novaSenha));
    setNovaSenha(""); setConfirmarNovaSenha("");
    setSenhaSalva(true);
    setTimeout(() => setSenhaSalva(false), 1500);
  };

  const trocarSenha = async () => {
    setErroSenha("");
    const hashAtual = await sha256Hex(senhaAtual);
    const salvo = localStorage.getItem(LS_KEYS.senhaHash);
    if (hashAtual !== salvo) { setErroSenha("Senha atual incorreta."); return; }
    if (novaSenha.length < 4) { setErroSenha("A nova senha precisa ter pelo menos 4 caracteres."); return; }
    if (novaSenha !== confirmarNovaSenha) { setErroSenha("As senhas novas não coincidem."); return; }
    const novoHash = await sha256Hex(novaSenha);
    localStorage.setItem(LS_KEYS.senhaHash, novoHash);
    setSenhaAtual(""); setNovaSenha(""); setConfirmarNovaSenha("");
    setSenhaSalva(true);
    setTimeout(() => setSenhaSalva(false), 1500);
  };

  const salvarChave = () => {
    localStorage.setItem(LS_KEYS.apiKey, apiKey.trim());
    // grava também no config, que é sincronizado — assim a chave acompanha as
    // versões novas do app e os outros dispositivos, sem redigitar
    atualizarConfig({ ...config, apiKey: apiKey.trim() });
    setSaved(true);
    setTimeout(() => setSaved(false), 1500);
  };

  const exportarBackup = () => {
    const payload = JSON.stringify({ fretes, custos, exportadoEm: new Date().toISOString() }, null, 2);
    const blob = new Blob([payload], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `gvgs-fretes-backup-${dataHojeISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importarBackup = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        onImport(parsed.fretes || [], parsed.custos || []);
      } catch {
        alert("Não consegui ler esse arquivo de backup.");
      }
    };
    reader.readAsText(file);
  };

  return (

          <div className="flex flex-col gap-2">

            </span>
            {dropboxConectado ? (
              <>
                <p className="text-xs" style={{ color: dropboxStatus === "bloqueado" ? "#B5473A" : "#4C7A5E" }}>

                  {dropboxStatus === "erro" && " — não consegui gravar agora (verifique sua conexão)."}

                </p>
              </>

          </div>

          <div className="h-px" style={{ background: "#D9D3C4" }} />

          <div className="flex flex-col gap-2">
            <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: "#24221D", fontFamily: "'Oswald', sans-serif" }}>
              Espaço usado no navegador
            </span>
            <div className="w-full h-2.5 rounded-full overflow-hidden" style={{ background: "#EFEAE0" }}>

            <button

            {liberado != null && (
              <p className="text-xs" style={{ color: "#4C7A5E" }}>
                {liberado > 0 ? `${liberado} miniatura(s) removida(s) — os valores e datas continuam salvos normalmente.` : "Nenhuma miniatura antiga e já quitada para remover no momento."}
              </p>
            )}
            <p className="text-[11px]" style={{ color: "#8A8577" }}>
              Isso apaga só as fotos/comprovantes de lançamentos com mais de 90 dias e já totalmente pagos/recebidos — os valores, datas e status continuam intactos, só a imagem some.
            </p>
          </div>

          <div className="h-px" style={{ background: "#D9D3C4" }} />

          <div className="flex flex-col gap-2">
            <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: "#24221D", fontFamily: "'Oswald', sans-serif" }}>
              Backup dos dados
            </span>
            <p className="text-xs" style={{ color: "#8A8577" }}>
              Os dados ficam salvos neste navegador. Para levar para outro computador, ou manter uma cópia no Google Drive
              ou iCloud, exporte um arquivo de backup e mova-o manualmente para a pasta sincronizada — depois é só
              importar esse arquivo em qualquer outro computador que tenha este app.
            </p>
            <button
              onClick={exportarBackup}
              className="py-2 rounded-md text-xs font-semibold uppercase tracking-wide border flex items-center justify-center gap-1.5"
              style={{ borderColor: "#D9D3C4", color: "#24221D", fontFamily: "'Oswald', sans-serif" }}
            >
              <IconDownload size={14} /> Exportar backup (.json)
            </button>
            <button
              onClick={() => fileRef.current?.click()}
              className="py-2 rounded-md text-xs font-semibold uppercase tracking-wide border flex items-center justify-center gap-1.5"
              style={{ borderColor: "#D9D3C4", color: "#24221D", fontFamily: "'Oswald', sans-serif" }}

              <IconUpload size={14} /> Importar backup (.json)

            <input ref={fileRef} type="file" accept="application/json" className="hidden"

          <div className="h-px" style={{ background: "#D9D3C4" }} />

          <button
            onClick={() => { sessionStorage.removeItem(SS_UNLOCKED); location.reload(); }}
            className="py-2 rounded-md text-xs font-semibold uppercase tracking-wide"
            style={{ color: "#B5473A", fontFamily: "'Oswald', sans-serif" }}
          >
            Sair e bloquear o app
          </button>
        </div>
      </div>
    </div>
  );

/* ===========================================================
   MODAL: NOVO TÍQUETE DE FRETE
=========================================================== */
function AddFreteModal({ onClose, onSave }) {
  const { config } = useConfig();
  const [step, setStep] = useState("upload");
  const [imgThumb, setImgThumb] = useState(null);
  const [isPdf, setIsPdf] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [form, setForm] = useState({
    valorFrete: "", dataTiquete: dataHojeISO(), cteNumero: "", numeroContainer: "",
    cliente: config.clientePadrao, motorista: config.motoristas[0] || "", caminhao: config.caminhoes[0] || "", observacao: ""
  });
  const fileRef = useRef(null);

  const handleFile = async (file) => {
    if (!file) return;
    const dataUrl = await fileToDataUrl(file);
    const pdf = file.type === "application/pdf";
    setIsPdf(pdf);
    const thumb = pdf ? await pdfThumbnail(dataUrl) : await resizeImage(dataUrl);
    setImgThumb(thumb);
    setStep("extracting");
    try {
      const extracted = await extractTicketData(dataUrl);
      setForm((f) => ({
        ...f,
        valorFrete: extracted.valorFrete ?? "",
        dataTiquete: extracted.dataTiquete || dataHojeISO(),
        cteNumero: extracted.cteNumero ?? "",
        numeroContainer: extracted.numeroContainer ?? "",
        cliente: extracted.cliente || config.clientePadrao,
        caminhao: extracted.caminhao || f.caminhao,
        observacao: extracted.observacao ?? ""
      }));
      setStep("review");
    } catch (e) {
      setErrorMsg(
        e.message === "SEM_CHAVE_API"
          ? "Nenhuma chave de API configurada. Abra Configurações para adicionar, ou preencha manualmente abaixo."
          : "Não consegui ler os valores automaticamente. Preencha manualmente abaixo."
      );
      setStep("review");
    }
  };

  const comissaoCalculada = (Number(form.valorFrete) || 0) * PERCENTUAL_COMISSAO;
  const canSave = form.valorFrete !== "" && !isNaN(Number(form.valorFrete));

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(28,30,34,0.7)" }}>
      <div className="w-full max-w-md rounded-lg overflow-hidden flex flex-col max-h-[90vh]" style={{ background: "#F4F1E8", border: "1px solid #D9D3C4" }}>
        <div className="flex items-center justify-between px-4 py-3" style={{ background: "#1C1E22" }}>
          <span className="text-white text-sm font-semibold uppercase tracking-wider" style={{ fontFamily: "'Oswald', sans-serif" }}>
            Novo tíquete de frete
          </span>
          <button onClick={onClose} className="text-white/70 hover:text-white"><IconX size={18} /></button>
        </div>
        <div className="p-4 overflow-y-auto">
          {step === "upload" && (
            <button onClick={() => fileRef.current?.click()}
                    className="w-full flex flex-col items-center justify-center gap-2 py-10 rounded-md border-2 border-dashed"
                    style={{ borderColor: "#D9D3C4", color: "#8A8577" }}>
              <IconUpload size={28} />
              <span className="text-sm font-medium">Toque para enviar a foto ou PDF do tíquete</span>
              <span className="text-xs">JPG, PNG ou PDF</span>
            </button>
          )}
          <input ref={fileRef} type="file" accept="image/*,application/pdf" className="hidden"
                 onChange={(e) => handleFile(e.target.files?.[0])} />

          {step === "extracting" && (
            <div className="flex flex-col items-center gap-3 py-10">
              {imgThumb && <img src={imgThumb} alt="" className="w-24 rounded border" style={{ borderColor: "#D9D3C4" }} />}
              <IconLoader size={24} style={{ color: "#B5762A" }} />
              <span className="text-sm" style={{ color: "#8A8577" }}>Lendo os valores do tíquete…</span>
            </div>
          )}

          {step === "review" && (
            <div className="flex flex-col gap-3">
              <div className="flex gap-3 items-start">
                {imgThumb && <img src={imgThumb} alt="" className="w-20 rounded border shrink-0" style={{ borderColor: "#D9D3C4" }} />}
                {errorMsg && (
                  <div className="flex items-start gap-1.5 text-xs" style={{ color: "#B5473A" }}>
                    <IconAlert size={14} className="shrink-0 mt-0.5" />{errorMsg}
                  </div>
                )}
              </div>
              <Field label="Data do tíquete">
                <input type="date" value={form.dataTiquete} onChange={(e) => setForm({ ...form, dataTiquete: e.target.value })} />
              </Field>
              <Field label="Valor do frete (R$)">
                <input type="number" step="0.01" value={form.valorFrete} onChange={(e) => setForm({ ...form, valorFrete: e.target.value })} />
              </Field>
              <Field label="Comissão do motorista (20% do frete, calculado automaticamente)">
                <input type="text" readOnly value={currency(comissaoCalculada)} style={{ background: "#F4F1E8", color: "#8A8577" }} />
              </Field>
              <Field label="Motorista">
                <select value={form.motorista} onChange={(e) => setForm({ ...form, motorista: e.target.value })}>
                  {config.motoristas.map((m) => <option key={m} value={m}>{m}</option>)}
                </select>
              </Field>
              <Field label="Caminhão (placa ou identificação)">
                <input type="text" list="caminhoes-list" value={form.caminhao} onChange={(e) => setForm({ ...form, caminhao: e.target.value })} placeholder="Ex: ABC-1234" />
              </Field>
              <Field label="Número do container">
                <input type="text" value={form.numeroContainer} onChange={(e) => setForm({ ...form, numeroContainer: e.target.value })} placeholder="Ex: MSKU1234567" />
              </Field>
              <Field label="Nº do CTe / Nota fiscal">
                <input type="text" value={form.cteNumero} onChange={(e) => setForm({ ...form, cteNumero: e.target.value })} />
              </Field>
              <Field label="Cliente">
                <input type="text" value={form.cliente} onChange={(e) => setForm({ ...form, cliente: e.target.value })} />
              </Field>
              <Field label="Observação">
                <input type="text" value={form.observacao} onChange={(e) => setForm({ ...form, observacao: e.target.value })} />
              </Field>
              <button
                disabled={!canSave}
                onClick={() => onSave({
                  id: uid(), imagemThumb: imgThumb, temAnexoPdf: isPdf, valorFrete: Number(form.valorFrete) || 0,
                  dataTiquete: form.dataTiquete, comissaoMotorista: comissaoCalculada, motorista: form.motorista,
                  cteNumero: form.cteNumero, cliente: form.cliente, caminhao: form.caminhao, numeroContainer: form.numeroContainer, observacao: form.observacao,
                  status: "pendente", statusComissao: "pendente", dataCriacao: new Date().toISOString()
                })}
                className="mt-1 w-full py-2.5 rounded-md font-semibold text-sm text-white disabled:opacity-40"
                style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}
              >
                Salvar tíquete
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ===========================================================
   MODAL: NOVO CUSTO
=========================================================== */
function AddCustoModal({ onClose, onSave, freteIdFixo, fretesDisponiveis, custosExistentes = [] }) {
  const { config } = useConfig();
  const [step, setStep] = useState("upload");
  const [imgThumb, setImgThumb] = useState(null);
  const [isPdf, setIsPdf] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [form, setForm] = useState({
    tipo: "combustivel", itemPrincipal: ITENS_MANUTENCAO[0], freteId: freteIdFixo || "",
    valor: "", litros: "", descricao: "", veiculo: "", data: dataHojeISO(), pagoPor: "empresa",
    motorista: config.motoristas[0] || "",
    posto: "", precoUnitario: "", desconto: "", fornecedor: "",
    formaPagamento: "a_vista", numParcelas: 2, parcelas: []
  });
  const fileRef = useRef(null);

  const handleFile = async (file) => {
    if (!file) return;
    const dataUrl = await fileToDataUrl(file);
    const pdf = file.type === "application/pdf";
    setIsPdf(pdf);
    setImgThumb(pdf ? await pdfThumbnail(dataUrl) : await resizeImage(dataUrl));
    setStep("extracting");
    try {
      const extracted = await extractCostData(dataUrl);
      setForm((f) => ({
        ...f,
        tipo: ["manutencao", "pedagio"].includes(extracted.tipo) ? extracted.tipo : "combustivel",
        itemPrincipal: ITENS_MANUTENCAO.includes(extracted.itemPrincipal) ? extracted.itemPrincipal : ITENS_MANUTENCAO[0],
        valor: extracted.valor ?? "", litros: extracted.litros || "", descricao: extracted.descricao ?? "",
        veiculo: extracted.veiculo ?? "", data: extracted.data || dataHojeISO(),
        posto: extracted.posto ?? "", precoUnitario: extracted.precoUnitario ?? "", desconto: extracted.desconto || "",
        fornecedor: extracted.fornecedor ?? "",
        quilometragem: extracted.quilometragem ?? ""
      }));
      setStep("review");
    } catch (e) {
      setErrorMsg(
        e.message === "SEM_CHAVE_API"
          ? "Nenhuma chave de API configurada. Abra Configurações para adicionar, ou preencha manualmente abaixo."
          : "Não consegui ler os dados automaticamente. Preencha manualmente abaixo."
      );
      setStep("review");
    }
  };

  // Consumo médio: procura o abastecimento anterior mais recente do mesmo caminhão com km informada.
  const registroAnterior = custosExistentes
    .filter(c => c.tipo === "combustivel" && c.veiculo && c.veiculo === form.veiculo && c.quilometragem && c.data && c.data < form.data)
    .sort((a, b) => (a.data < b.data ? 1 : -1))[0];
  const kmAtual = Number(form.quilometragem) || 0;
  const consumoMedio = (registroAnterior && kmAtual > registroAnterior.quilometragem && Number(form.litros) > 0)
    ? (kmAtual - registroAnterior.quilometragem) / Number(form.litros)
    : null;

  const precoLiquidoCalculado = (Number(form.precoUnitario) || 0) * (Number(form.litros) || 0) - (Number(form.desconto) || 0);

  const gerarParcelas = () => {
    const n = Math.max(1, Number(form.numParcelas) || 1);
    const valorTotal = Number(form.valor) || 0;
    const valorParcela = Math.round((valorTotal / n) * 100) / 100;
    const base = new Date(form.data + "T00:00:00");
    const parcelas = Array.from({ length: n }, (_, i) => {
      const venc = new Date(base);
      venc.setMonth(venc.getMonth() + i + 1);
      return { id: uid(), valor: valorParcela, vencimento: venc.toISOString().slice(0, 10), status: "pendente" };
    });
    setForm({ ...form, parcelas });
  };
  const atualizarParcela = (id, campo, valor) => {
    setForm({ ...form, parcelas: form.parcelas.map(p => p.id === id ? { ...p, [campo]: valor } : p) });
  };
  const removerParcela = (id) => setForm({ ...form, parcelas: form.parcelas.filter(p => p.id !== id) });

  const canSave = form.valor !== "" && !isNaN(Number(form.valor));

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(28,30,34,0.7)" }}>
      <div className="w-full max-w-sm rounded-lg overflow-hidden flex flex-col max-h-[90vh]" style={{ background: "#F4F1E8", border: "1px solid #D9D3C4" }}>
        <div className="flex items-center justify-between px-4 py-3" style={{ background: "#1C1E22" }}>
          <span className="text-white text-sm font-semibold uppercase tracking-wider" style={{ fontFamily: "'Oswald', sans-serif" }}>Novo custo</span>
          <button onClick={onClose} className="text-white/70 hover:text-white"><IconX size={18} /></button>
        </div>
        {freteIdFixo && (
          <div className="px-4 pt-3 text-xs" style={{ color: "#8A8577" }}>Custo vinculado ao tíquete desta viagem.</div>
        )}
        <div className="p-4 overflow-y-auto flex flex-col gap-3">
          {step === "upload" && (
            <>
              <button onClick={() => fileRef.current?.click()}
                      className="w-full flex flex-col items-center justify-center gap-2 py-10 rounded-md border-2 border-dashed"
                      style={{ borderColor: "#D9D3C4", color: "#8A8577" }}>
                <IconUpload size={28} />
                <span className="text-sm font-medium">Toque para enviar a nota (foto ou PDF)</span>
                <span className="text-xs">Combustível, pedágio ou manutenção</span>
              </button>
              <button onClick={() => setStep("review")} className="text-xs underline self-center" style={{ color: "#8A8577" }}>
                Preencher manualmente, sem anexo
              </button>
            </>
          )}
          <input ref={fileRef} type="file" accept="image/*,application/pdf" className="hidden"
                 onChange={(e) => handleFile(e.target.files?.[0])} />

          {step === "extracting" && (
            <div className="flex flex-col items-center gap-3 py-10">
              {imgThumb ? <img src={imgThumb} alt="" className="w-24 rounded border" style={{ borderColor: "#D9D3C4" }} />
                : isPdf ? <IconFile size={32} style={{ color: "#8A8577" }} /> : null}
              <IconLoader size={24} style={{ color: "#B5762A" }} />
              <span className="text-sm" style={{ color: "#8A8577" }}>Lendo os dados do documento…</span>
            </div>
          )}

          {step === "review" && (
            <>
              {(imgThumb || isPdf) && (
                <div className="flex items-center gap-2">
                  {imgThumb ? <img src={imgThumb} alt="" className="w-14 rounded border shrink-0" style={{ borderColor: "#D9D3C4" }} />
                    : <div className="w-14 h-14 rounded border flex items-center justify-center shrink-0" style={{ borderColor: "#D9D3C4" }}><IconFile size={18} style={{ color: "#8A8577" }} /></div>}
                  {errorMsg && <div className="flex items-start gap-1.5 text-xs" style={{ color: "#B5473A" }}><IconAlert size={14} className="shrink-0 mt-0.5" />{errorMsg}</div>}
                </div>
              )}
              <div className="flex gap-2">
                {["combustivel", "pedagio", "manutencao"].map((t) => (
                  <button key={t} onClick={() => setForm({ ...form, tipo: t })}
                          className="flex-1 py-2 rounded-md text-xs font-semibold uppercase tracking-wide flex items-center justify-center gap-1.5 border"
                          style={{ background: form.tipo === t ? "#B5762A" : "#FFFFFF", color: form.tipo === t ? "#FFFFFF" : "#24221D", borderColor: form.tipo === t ? "#B5762A" : "#D9D3C4", fontFamily: "'Oswald', sans-serif" }}>
                    {t === "combustivel" ? <IconFuel size={14} /> : t === "pedagio" ? <IconToll size={14} /> : <IconWrench size={14} />}
                    {t === "combustivel" ? "Combustível" : t === "pedagio" ? "Pedágio" : "Manutenção"}
                  </button>
                ))}
              </div>
              {form.tipo === "manutencao" && (
                <>
                  <Field label="Item principal (tipo de manutenção)">
                    <select value={form.itemPrincipal} onChange={(e) => setForm({ ...form, itemPrincipal: e.target.value })}>
                      {ITENS_MANUTENCAO.map((item) => <option key={item} value={item}>{item}</option>)}
                    </select>
                  </Field>
                  <Field label="Fornecedor (oficina)">
                    <input type="text" value={form.fornecedor} onChange={(e) => setForm({ ...form, fornecedor: e.target.value })} />
                  </Field>
                </>
              )}

              {form.tipo === "combustivel" && (
                <Field label="Posto"><input type="text" value={form.posto} onChange={(e) => setForm({ ...form, posto: e.target.value })} /></Field>
              )}

              <Field label="Valor (R$)">
                <input type="number" step="0.01" value={form.valor} onChange={(e) => setForm({ ...form, valor: e.target.value })} />
              </Field>

              {form.tipo === "combustivel" && (
                <>
                  <Field label="Litros">
                    <input type="number" step="0.01" value={form.litros} onChange={(e) => setForm({ ...form, litros: e.target.value })} />
                  </Field>
                  <Field label="Preço unitário (R$/litro)">
                    <input type="number" step="0.001" value={form.precoUnitario} onChange={(e) => setForm({ ...form, precoUnitario: e.target.value })} />
                  </Field>
                  <Field label="Desconto (R$, opcional)">
                    <input type="number" step="0.01" value={form.desconto} onChange={(e) => setForm({ ...form, desconto: e.target.value })} />
                  </Field>
                  {(form.precoUnitario || form.desconto) && (
                    <p className="text-xs -mt-1.5" style={{ color: "#8A8577" }}>
                      Preço líquido calculado: <b>{currency(precoLiquidoCalculado)}</b>
                    </p>
                  )}
                  <Field label="Quilometragem do caminhão no abastecimento (opcional)">
                    <input type="number" value={form.quilometragem || ""} onChange={(e) => setForm({ ...form, quilometragem: e.target.value })} />
                  </Field>
                  {consumoMedio != null && (
                    <p className="text-xs -mt-1.5" style={{ color: "#4C7A5E" }}>
                      Consumo médio desde o último abastecimento desse caminhão: <b>{consumoMedio.toFixed(2)} km/l</b>
                    </p>
                  )}
                </>
              )}

              <Field label="Data"><input type="date" value={form.data} onChange={(e) => setForm({ ...form, data: e.target.value })} /></Field>
              <Field label="Caminhão (opcional)"><input type="text" list="caminhoes-list" value={form.veiculo} onChange={(e) => setForm({ ...form, veiculo: e.target.value })} /></Field>
              <Field label="Descrição"><input type="text" value={form.descricao} onChange={(e) => setForm({ ...form, descricao: e.target.value })} /></Field>

              {!freteIdFixo && fretesDisponiveis && fretesDisponiveis.length > 0 && (
                <Field label="Vincular a uma viagem — pelo container (opcional)">
                  <select value={form.freteId} onChange={(e) => setForm({ ...form, freteId: e.target.value })}>
                    <option value="">Despesas gerais (sem viagem)</option>
                    {fretesDisponiveis.slice().sort((a, b) => (a.numeroContainer || "TBN").localeCompare(b.numeroContainer || "TBN")).map((f) => (
                      <option key={f.id} value={f.id}>
                        Container {f.numeroContainer || "TBN"} · {(f.dataTiquete ? new Date(f.dataTiquete + "T00:00:00").toLocaleDateString("pt-BR") : "sem data")} · {f.cliente || "sem cliente"}
                      </option>
                    ))}
                  </select>
                </Field>
              )}

              <Field label="Quem pagou">
                <div className="flex gap-2">
                  {["empresa", "motorista"].map((p) => (
                    <button key={p} type="button" onClick={() => setForm({ ...form, pagoPor: p })}
                            className="flex-1 py-2 rounded-md text-xs font-semibold uppercase tracking-wide border"
                            style={{ background: form.pagoPor === p ? "#1C1E22" : "#FFFFFF", color: form.pagoPor === p ? "#FFFFFF" : "#24221D", borderColor: form.pagoPor === p ? "#1C1E22" : "#D9D3C4", fontFamily: "'Oswald', sans-serif" }}>
                      {p === "empresa" ? config.nomeEmpresa : "Motorista"}
                    </button>
                  ))}
                </div>
              </Field>

              {form.pagoPor === "motorista" ? (
                <>
                  <Field label="Motorista">
                    <select value={form.motorista} onChange={(e) => setForm({ ...form, motorista: e.target.value })}>
                      {config.motoristas.map((m) => <option key={m} value={m}>{m}</option>)}
                    </select>
                  </Field>
                  <p className="text-xs -mt-1.5" style={{ color: "#8A8577" }}>Esse valor entra como "a ressarcir" até você marcar como ressarcido ao motorista.</p>
                </>
              ) : form.tipo === "manutencao" ? (
                <>
                  <Field label="Condição de pagamento">
                    <div className="flex gap-2">
                      {["a_vista", "parcelado"].map((fp) => (
                        <button key={fp} type="button" onClick={() => setForm({ ...form, formaPagamento: fp })}
                                className="flex-1 py-2 rounded-md text-xs font-semibold uppercase tracking-wide border"
                                style={{ background: form.formaPagamento === fp ? "#1C1E22" : "#FFFFFF", color: form.formaPagamento === fp ? "#FFFFFF" : "#24221D", borderColor: form.formaPagamento === fp ? "#1C1E22" : "#D9D3C4", fontFamily: "'Oswald', sans-serif" }}>
                          {fp === "a_vista" ? "À vista" : "Parcelado"}
                        </button>
                      ))}
                    </div>
                  </Field>
                  {form.formaPagamento === "parcelado" && (
                    <div className="flex flex-col gap-2">
                      <div className="flex items-end gap-2">
                        <Field label="Número de parcelas">
                          <input type="number" min="1" value={form.numParcelas} onChange={(e) => setForm({ ...form, numParcelas: e.target.value })} />
                        </Field>
                        <button type="button" onClick={gerarParcelas} className="px-3 py-2 rounded-md text-xs font-semibold uppercase tracking-wide text-white" style={{ background: "#1C1E22", fontFamily: "'Oswald', sans-serif" }}>
                          Gerar parcelas
                        </button>
                      </div>
                      {form.parcelas.length > 0 && (
                        <div className="flex flex-col gap-1.5">
                          {form.parcelas.map((p, i) => (
                            <div key={p.id} className="flex items-center gap-1.5 text-xs px-2 py-1.5 rounded" style={{ background: "#FFFFFF", border: "1px solid #D9D3C4" }}>
                              <span style={{ color: "#8A8577" }}>{i + 1}ª</span>
                              <input type="number" step="0.01" value={p.valor} onChange={(e) => atualizarParcela(p.id, "valor", Number(e.target.value))} className="w-20 px-1.5 py-1 rounded" style={inputStyle} />
                              <input type="date" value={p.vencimento} onChange={(e) => atualizarParcela(p.id, "vencimento", e.target.value)} className="flex-1 px-1.5 py-1 rounded" style={inputStyle} />
                              <button onClick={() => removerParcela(p.id)} style={{ color: "#8A8577" }}><IconTrash size={13} /></button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </>
              ) : null}

              <button
                disabled={!canSave}
                onClick={() => onSave({
                  id: uid(), tipo: form.tipo, itemPrincipal: form.tipo === "manutencao" ? form.itemPrincipal : "",
                  fornecedor: form.tipo === "manutencao" ? form.fornecedor : "",
                  valor: Number(form.valor) || 0, litros: form.litros ? Number(form.litros) : 0,
                  posto: form.posto, precoUnitario: form.precoUnitario ? Number(form.precoUnitario) : null,
                  desconto: form.desconto ? Number(form.desconto) : 0,
                  precoLiquido: form.tipo === "combustivel" ? precoLiquidoCalculado : null,
                  quilometragem: form.quilometragem ? Number(form.quilometragem) : null,
                  descricao: form.descricao, veiculo: form.veiculo, data: form.data,
                  imagemThumb: imgThumb, temAnexoPdf: isPdf, pagoPor: form.pagoPor,
                  motorista: form.pagoPor === "motorista" ? form.motorista : null,
                  statusRessarcimento: form.pagoPor === "motorista" ? "pendente" : null,
                  valorReembolsado: null,
                  statusPagamento: form.pagoPor === "empresa" ? "pendente" : null,
                  formaPagamento: form.tipo === "manutencao" && form.pagoPor === "empresa" ? form.formaPagamento : null,
                  parcelas: form.tipo === "manutencao" && form.pagoPor === "empresa" && form.formaPagamento === "parcelado" ? form.parcelas : [],
                  freteId: freteIdFixo || form.freteId || null
                })}
                className="mt-1 w-full py-2.5 rounded-md font-semibold text-sm text-white disabled:opacity-40"
                style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}
              >
                Salvar custo
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ===========================================================
   MODAL: EDITAR CUSTO EXISTENTE
=========================================================== */
function CustoDetailModal({ custo, fretesDisponiveis, onClose, onSave, onDelete }) {
  const { config } = useConfig();
  const [form, setForm] = useState({
    tipo: custo.tipo, itemPrincipal: custo.itemPrincipal || ITENS_MANUTENCAO[0],
    fornecedor: custo.fornecedor || "", freteId: custo.freteId || "",
    valor: String(custo.valor ?? ""), litros: custo.litros ? String(custo.litros) : "",
    posto: custo.posto || "", precoUnitario: custo.precoUnitario != null ? String(custo.precoUnitario) : "",
    desconto: custo.desconto ? String(custo.desconto) : "", quilometragem: custo.quilometragem != null ? String(custo.quilometragem) : "",
    descricao: custo.descricao || "", veiculo: custo.veiculo || "", data: custo.data || dataHojeISO(),
    pagoPor: custo.pagoPor || "empresa", motorista: custo.motorista || config.motoristas[0] || "",
    formaPagamento: custo.formaPagamento || "a_vista", parcelas: custo.parcelas || []
  });
  const [confirmDelete, setConfirmDelete] = useState(false);
  const precoLiquidoCalculado = (Number(form.precoUnitario) || 0) * (Number(form.litros) || 0) - (Number(form.desconto) || 0);
  const canSave = form.valor !== "" && !isNaN(Number(form.valor));

  const atualizarParcela = (id, campo, valor) => setForm({ ...form, parcelas: form.parcelas.map(p => p.id === id ? { ...p, [campo]: valor } : p) });

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(28,30,34,0.7)" }}>
      <div className="w-full max-w-sm rounded-lg overflow-hidden flex flex-col max-h-[90vh]" style={{ background: "#F4F1E8", border: "1px solid #D9D3C4" }}>
        <div className="flex items-center justify-between px-4 py-3" style={{ background: "#1C1E22" }}>
          <span className="text-white text-sm font-semibold uppercase tracking-wider flex items-center gap-2" style={{ fontFamily: "'Oswald', sans-serif" }}>
            <IconEdit size={15} /> Editar custo
          </span>
          <button onClick={onClose} className="text-white/70 hover:text-white"><IconX size={18} /></button>
        </div>
        <div className="p-4 overflow-y-auto flex flex-col gap-3">
          {(custo.imagemThumb || custo.temAnexoPdf) && (
            <div className="flex items-center gap-2">
              {custo.imagemThumb ? <img src={custo.imagemThumb} alt="" className="w-14 rounded border" style={{ borderColor: "#D9D3C4" }} />
                : <div className="w-14 h-14 rounded border flex items-center justify-center" style={{ borderColor: "#D9D3C4" }}><IconFile size={18} style={{ color: "#8A8577" }} /></div>}
              <span className="text-xs" style={{ color: "#8A8577" }}>Documento original enviado (não pode ser trocado aqui — exclua e cadastre de novo se precisar anexar outro arquivo).</span>
            </div>
          )}
          <div className="flex gap-2">
            {["combustivel", "pedagio", "manutencao"].map((t) => (
              <button key={t} onClick={() => setForm({ ...form, tipo: t })}
                      className="flex-1 py-2 rounded-md text-xs font-semibold uppercase tracking-wide flex items-center justify-center gap-1.5 border"
                      style={{ background: form.tipo === t ? "#B5762A" : "#FFFFFF", color: form.tipo === t ? "#FFFFFF" : "#24221D", borderColor: form.tipo === t ? "#B5762A" : "#D9D3C4", fontFamily: "'Oswald', sans-serif" }}>
                {t === "combustivel" ? <IconFuel size={14} /> : t === "pedagio" ? <IconToll size={14} /> : <IconWrench size={14} />}
                {t === "combustivel" ? "Combustível" : t === "pedagio" ? "Pedágio" : "Manutenção"}
              </button>
            ))}
          </div>
          {form.tipo === "manutencao" && (
            <>
              <Field label="Item principal (tipo de manutenção)">
                <select value={form.itemPrincipal} onChange={(e) => setForm({ ...form, itemPrincipal: e.target.value })}>
                  {ITENS_MANUTENCAO.map((item) => <option key={item} value={item}>{item}</option>)}
                </select>
              </Field>
              <Field label="Fornecedor (oficina)">
                <input type="text" value={form.fornecedor} onChange={(e) => setForm({ ...form, fornecedor: e.target.value })} />
              </Field>
            </>
          )}
          {form.tipo === "combustivel" && (
            <Field label="Posto"><input type="text" value={form.posto} onChange={(e) => setForm({ ...form, posto: e.target.value })} /></Field>
          )}
          <Field label="Valor (R$)"><input type="number" step="0.01" value={form.valor} onChange={(e) => setForm({ ...form, valor: e.target.value })} /></Field>
          {form.tipo === "combustivel" && (
            <>
              <Field label="Litros"><input type="number" step="0.01" value={form.litros} onChange={(e) => setForm({ ...form, litros: e.target.value })} /></Field>
              <Field label="Preço unitário (R$/litro)"><input type="number" step="0.001" value={form.precoUnitario} onChange={(e) => setForm({ ...form, precoUnitario: e.target.value })} /></Field>
              <Field label="Desconto (R$, opcional)"><input type="number" step="0.01" value={form.desconto} onChange={(e) => setForm({ ...form, desconto: e.target.value })} /></Field>
              {(form.precoUnitario || form.desconto) && (
                <p className="text-xs -mt-1.5" style={{ color: "#8A8577" }}>Preço líquido calculado: <b>{currency(precoLiquidoCalculado)}</b></p>
              )}
              <Field label="Quilometragem no abastecimento (opcional)"><input type="number" value={form.quilometragem} onChange={(e) => setForm({ ...form, quilometragem: e.target.value })} /></Field>
            </>
          )}
          <Field label="Data"><input type="date" value={form.data} onChange={(e) => setForm({ ...form, data: e.target.value })} /></Field>
          <Field label="Caminhão (opcional)"><input type="text" list="caminhoes-list" value={form.veiculo} onChange={(e) => setForm({ ...form, veiculo: e.target.value })} /></Field>
          <Field label="Descrição"><input type="text" value={form.descricao} onChange={(e) => setForm({ ...form, descricao: e.target.value })} /></Field>

          {fretesDisponiveis && fretesDisponiveis.length > 0 && (
            <Field label="Vincular a uma viagem — pelo container (opcional)">
              <select value={form.freteId} onChange={(e) => setForm({ ...form, freteId: e.target.value })}>
                <option value="">Despesas gerais (sem viagem)</option>
                {fretesDisponiveis.slice().sort((a, b) => (a.numeroContainer || "TBN").localeCompare(b.numeroContainer || "TBN")).map((f) => (
                  <option key={f.id} value={f.id}>
                    Container {f.numeroContainer || "TBN"} · {(f.dataTiquete ? new Date(f.dataTiquete + "T00:00:00").toLocaleDateString("pt-BR") : "sem data")} · {f.cliente || "sem cliente"}
                  </option>
                ))}
              </select>
            </Field>
          )}

          <Field label="Quem pagou">
            <div className="flex gap-2">
              {["empresa", "motorista"].map((p) => (
                <button key={p} type="button" onClick={() => setForm({ ...form, pagoPor: p })}
                        className="flex-1 py-2 rounded-md text-xs font-semibold uppercase tracking-wide border"
                        style={{ background: form.pagoPor === p ? "#1C1E22" : "#FFFFFF", color: form.pagoPor === p ? "#FFFFFF" : "#24221D", borderColor: form.pagoPor === p ? "#1C1E22" : "#D9D3C4", fontFamily: "'Oswald', sans-serif" }}>
                  {p === "empresa" ? config.nomeEmpresa : "Motorista"}
                </button>
              ))}
            </div>
          </Field>
          {form.pagoPor === "motorista" ? (
            <Field label="Motorista">
              <select value={form.motorista} onChange={(e) => setForm({ ...form, motorista: e.target.value })}>
                {config.motoristas.map((m) => <option key={m} value={m}>{m}</option>)}
              </select>
            </Field>
          ) : form.tipo === "manutencao" ? (
            <>
              <Field label="Condição de pagamento">
                <div className="flex gap-2">
                  {["a_vista", "parcelado"].map((fp) => (
                    <button key={fp} type="button" onClick={() => setForm({ ...form, formaPagamento: fp })}
                            className="flex-1 py-2 rounded-md text-xs font-semibold uppercase tracking-wide border"
                            style={{ background: form.formaPagamento === fp ? "#1C1E22" : "#FFFFFF", color: form.formaPagamento === fp ? "#FFFFFF" : "#24221D", borderColor: form.formaPagamento === fp ? "#1C1E22" : "#D9D3C4", fontFamily: "'Oswald', sans-serif" }}>
                      {fp === "a_vista" ? "À vista" : "Parcelado"}
                    </button>
                  ))}
                </div>
              </Field>
              {form.formaPagamento === "parcelado" && form.parcelas.length > 0 && (
                <div className="flex flex-col gap-1.5">
                  {form.parcelas.map((p, i) => (
                    <div key={p.id} className="flex items-center gap-1.5 text-xs px-2 py-1.5 rounded" style={{ background: "#FFFFFF", border: "1px solid #D9D3C4" }}>
                      <span style={{ color: "#8A8577" }}>{i + 1}ª</span>
                      <input type="number" step="0.01" value={p.valor} onChange={(e) => atualizarParcela(p.id, "valor", Number(e.target.value))} className="w-20 px-1.5 py-1 rounded" style={inputStyle} />
                      <input type="date" value={p.vencimento} onChange={(e) => atualizarParcela(p.id, "vencimento", e.target.value)} className="flex-1 px-1.5 py-1 rounded" style={inputStyle} />
                    </div>
                  ))}
                </div>
              )}
            </>
          ) : null}

          <button
            disabled={!canSave}
            onClick={() => onSave({
              ...custo, tipo: form.tipo, itemPrincipal: form.tipo === "manutencao" ? form.itemPrincipal : "",
              fornecedor: form.tipo === "manutencao" ? form.fornecedor : "",
              valor: Number(form.valor) || 0, litros: form.litros ? Number(form.litros) : 0,
              posto: form.posto, precoUnitario: form.precoUnitario ? Number(form.precoUnitario) : null,
              desconto: form.desconto ? Number(form.desconto) : 0,
              precoLiquido: form.tipo === "combustivel" ? precoLiquidoCalculado : null,
              quilometragem: form.quilometragem ? Number(form.quilometragem) : null,
              descricao: form.descricao, veiculo: form.veiculo, data: form.data,
              freteId: form.freteId || null, pagoPor: form.pagoPor,
              motorista: form.pagoPor === "motorista" ? form.motorista : null,
              formaPagamento: form.tipo === "manutencao" && form.pagoPor === "empresa" ? form.formaPagamento : null,
              parcelas: form.tipo === "manutencao" && form.pagoPor === "empresa" && form.formaPagamento === "parcelado" ? form.parcelas : []
            })}
            className="mt-1 w-full py-2.5 rounded-md font-semibold text-sm text-white disabled:opacity-40"
            style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}
          >
            Salvar alterações
          </button>

          {!confirmDelete ? (
            <button onClick={() => setConfirmDelete(true)} className="w-full py-2 rounded-md text-xs font-semibold uppercase tracking-wide flex items-center justify-center gap-1.5" style={{ color: "#B5473A" }}>
              <IconTrash size={13} /> Excluir custo
            </button>
          ) : (
            <div className="flex gap-2">
              <button onClick={() => onDelete(custo.id)} className="flex-1 py-2 rounded-md text-xs font-semibold uppercase tracking-wide text-white" style={{ background: "#B5473A", fontFamily: "'Oswald', sans-serif" }}>Confirmar exclusão</button>
              <button onClick={() => setConfirmDelete(false)} className="flex-1 py-2 rounded-md text-xs font-semibold uppercase tracking-wide border" style={{ borderColor: "#D9D3C4", color: "#24221D", fontFamily: "'Oswald', sans-serif" }}>Cancelar</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ===========================================================
   MODAL: PAGAMENTO / RESSARCIMENTO DE CUSTO
   Mesmo critério para fornecedor e motorista: aceita comprovante
   (foto/PDF), permite valor parcial ou maior que a despesa, e
   aloca automaticamente o saldo do comprovante entre as demais
   despesas pendentes da mesma parte (fornecedor ou motorista),
   das mais antigas às mais novas, até esgotar o valor do
   comprovante. Cada lançamento guarda o comprovante e o valor
   total dele, para poder mostrar em qualquer tela quais
   documentos aquele mesmo comprovante quitou.
=========================================================== */
function PagamentoCustoModal({ custo, custosRelacionados, onClose, onConfirm }) {
  const ehMotorista = custo.pagoPor === "motorista";
  const [step, setStep] = useState("upload");
  const [imgThumb, setImgThumb] = useState(null);
  const [isPdf, setIsPdf] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [valor, setValor] = useState(String(saldoPendenteCusto(custo)));
  const [data, setData] = useState(dataHojeISO());
  const outrosPendentesOrdenados = (custosRelacionados || [])
    .filter(c => c.id !== custo.id && !custoEstaLiquidado(c))
    .slice()
    .sort((a, b) => (a.data || "").localeCompare(b.data || ""));
  const outrosPendentes = outrosPendentesOrdenados;
  // Sugestão inicial: só marca outras despesas enquanto ainda sobrar valor do comprovante,
  // somando na ordem cronológica — nunca marca algo que, de qualquer forma, ficaria com
  // R$ 0 alocado (essa era a confusão de mostrar tudo pré-marcado mesmo sem caber no valor).
  const calcularSugestao = (valorComprovante) => {
    let restante = (Number(valorComprovante) || 0) - saldoPendenteCusto(custo);
    const sel = [];
    for (const c of outrosPendentesOrdenados) {
      if (restante <= 0.004) break;
      sel.push(c.id);
      restante -= saldoPendenteCusto(c);
    }
    return sel;
  };
  const [selecionados, setSelecionados] = useState(() => calcularSugestao(valor));
  const fileRef = useRef(null);

  const handleFile = async (file) => {
    if (!file) return;
    const dataUrl = await fileToDataUrl(file);
    const pdf = file.type === "application/pdf";
    setIsPdf(pdf);
    setImgThumb(pdf ? await pdfThumbnail(dataUrl) : await resizeImage(dataUrl));
    setStep("extracting");
    try {
      const extracted = ehMotorista ? await extractComprovanteRessarcimento(dataUrl) : await extractComprovantePagamento(dataUrl);
      if (extracted.valor) { setValor(String(extracted.valor)); setSelecionados(calcularSugestao(extracted.valor)); }
      if (extracted.data) setData(extracted.data);
      setStep("review");
    } catch (e) {
      setErrorMsg(
        e.message === "SEM_CHAVE_API"
          ? "Nenhuma chave de API configurada. Abra Configurações para adicionar, ou preencha manualmente abaixo."
          : "Não consegui ler o comprovante automaticamente. Preencha manualmente abaixo."
      );
      setStep("review");
    }
  };

  const mudarValor = (novoValor) => {
    setValor(novoValor);
    setSelecionados(calcularSugestao(novoValor));
  };

  const toggleSelecionado = (id) => {
    if (id === custo.id) return; // a despesa que originou o pagamento sempre entra
    setSelecionados(sel => sel.includes(id) ? sel.filter(x => x !== id) : [...sel, id]);
  };

  // Aloca o valor do comprovante entre as despesas selecionadas, das mais antigas para as
  // mais novas, somando progressivamente até atingir o valor máximo do comprovante — nunca
  // excede o total. Se sobrar valor depois de cobrir tudo que está marcado, essa sobra NUNCA
  // é forçada em cima de uma despesa (isso gerava incoerência, ex.: R$ 11,40 de pedágio
  // "recebendo" R$ 1.103 de dedução) — ela vira saldo credor disponível para a próxima
  // despesa dessa mesma parte. Quando uma despesa não fecha o valor exato, fica parcial e
  // some do saldo pendente até o próximo comprovante.
  // A despesa que originou este comprovante tem prioridade absoluta — recebe o valor primeiro,
  // por inteiro se couber. Só a diferença que sobrar vai para as outras despesas marcadas,
  // das mais antigas às mais novas — evitando espalhar o mesmo comprovante em várias despesas
  // quando ele já dá conta de liquidar a despesa de origem sozinho.
  const outrosSelecionadosOrdenados = outrosPendentesOrdenados
    .filter(c => selecionados.includes(c.id) && c.id !== custo.id)
    .sort((a, b) => (a.data || "").localeCompare(b.data || ""));
  const itensSelecionados = [custo, ...outrosSelecionadosOrdenados];
  let restante = Number(valor) || 0;
  const alocacoes = itensSelecionados.map(c => {
    const pendente = saldoPendenteCusto(c);
    const aloc = Math.min(pendente, Math.max(restante, 0));
    restante -= aloc;
    return { custoId: c.id, valorAlocado: Math.round(aloc * 100) / 100, parcial: aloc > 0 && aloc < pendente - 0.004, descricao: c.tipo === "combustivel" ? "Combustível" : c.tipo === "pedagio" ? "Pedágio" : (c.itemPrincipal || "Manutenção"), data: c.data };
  }).filter(a => a.valorAlocado > 0);
  const sobra = Math.round(Math.max(restante, 0) * 100) / 100;

  const podeConfirmar = valor !== "" && !isNaN(Number(valor)) && Number(valor) > 0;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(28,30,34,0.7)" }}>
      <div className="w-full max-w-sm rounded-lg overflow-hidden flex flex-col max-h-[90vh]" style={{ background: "#F4F1E8", border: "1px solid #D9D3C4" }}>
        <div className="flex items-center justify-between px-4 py-3" style={{ background: "#1C1E22" }}>
          <span className="text-white text-sm font-semibold uppercase tracking-wider" style={{ fontFamily: "'Oswald', sans-serif" }}>
            {ehMotorista ? "Ressarcimento ao motorista" : "Pagamento ao fornecedor"}
          </span>
          <button onClick={onClose} className="text-white/70 hover:text-white"><IconX size={18} /></button>
        </div>
        <div className="p-4 overflow-y-auto flex flex-col gap-3">
          <p className="text-xs" style={{ color: "#8A8577" }}>Saldo pendente desta despesa: <b>{currency(saldoPendenteCusto(custo))}</b>. Envie o comprovante {ehMotorista ? "da transferência ao motorista" : "do pagamento"} para preencher automaticamente.</p>

          {step === "upload" && (
            <>
              <button onClick={() => fileRef.current?.click()}
                      className="w-full flex flex-col items-center justify-center gap-2 py-8 rounded-md border-2 border-dashed"
                      style={{ borderColor: "#D9D3C4", color: "#8A8577" }}>
                <IconUpload size={26} />
                <span className="text-sm font-medium">Enviar comprovante (foto ou PDF)</span>
              </button>
              <button onClick={() => setStep("review")} className="text-xs underline self-center" style={{ color: "#8A8577" }}>
                Preencher manualmente, sem comprovante
              </button>
            </>
          )}
          <input ref={fileRef} type="file" accept="image/*,application/pdf" className="hidden"
                 onChange={(e) => handleFile(e.target.files?.[0])} />

          {step === "extracting" && (
            <div className="flex flex-col items-center gap-3 py-8">
              {imgThumb ? <img src={imgThumb} alt="" className="w-24 rounded border" style={{ borderColor: "#D9D3C4" }} />
                : isPdf ? <IconFile size={32} style={{ color: "#8A8577" }} /> : null}
              <IconLoader size={24} style={{ color: "#B5762A" }} />
              <span className="text-sm" style={{ color: "#8A8577" }}>Lendo o comprovante…</span>
            </div>
          )}

          {step === "review" && (
            <>
              {(imgThumb || isPdf) && (
                <div className="flex items-center gap-2">
                  {imgThumb ? <img src={imgThumb} alt="" className="w-14 rounded border shrink-0" style={{ borderColor: "#D9D3C4" }} />
                    : <div className="w-14 h-14 rounded border flex items-center justify-center shrink-0" style={{ borderColor: "#D9D3C4" }}><IconFile size={18} style={{ color: "#8A8577" }} /></div>}
                  {errorMsg && <div className="flex items-start gap-1.5 text-xs" style={{ color: "#B5473A" }}><IconAlert size={14} className="shrink-0 mt-0.5" />{errorMsg}</div>}
                </div>
              )}
              <Field label="Valor do comprovante (R$) — pode ser maior ou menor que a despesa">
                <input type="number" step="0.01" value={valor} onChange={(e) => mudarValor(e.target.value)} />
              </Field>
              <Field label="Data">
                <input type="date" value={data} onChange={(e) => setData(e.target.value)} />
              </Field>

              {outrosPendentes.length > 0 && (
                <div className="flex flex-col gap-1.5">
                  <span className="text-[11px] uppercase tracking-wide font-medium" style={{ color: "#8A8577" }}>
                    Outros lançamentos pendentes {ehMotorista ? "deste motorista" : "deste fornecedor"} — marcadas as que cabem dentro do valor deste comprovante
                  </span>
                  {outrosPendentes.map(c => (
                    <label key={c.id} className="flex items-center gap-2 text-xs px-2 py-1.5 rounded" style={{ background: "#FFFFFF", border: "1px solid #D9D3C4" }}>
                      <input type="checkbox" checked={selecionados.includes(c.id)} onChange={() => toggleSelecionado(c.id)} />
                      <span style={{ color: "#24221D" }}>{c.data ? new Date(c.data + "T00:00:00").toLocaleDateString("pt-BR") : "sem data"}</span>
                      <span style={{ color: "#8A8577" }}>{c.tipo === "combustivel" ? "Combustível" : c.tipo === "pedagio" ? "Pedágio" : (c.itemPrincipal || "Manutenção")}</span>
                      <span className="ml-auto font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#B5473A" }}>{currency(saldoPendenteCusto(c))}</span>
                    </label>
                  ))}
                </div>
              )}

              {alocacoes.length > 0 && (
                <div className="rounded-md overflow-hidden" style={{ border: "1px solid #D9D3C4" }}>
                  <div className="px-2.5 py-1.5 text-[11px] font-semibold uppercase tracking-wide" style={{ background: "#1C1E22", color: "#E8A33D" }}>Como este comprovante será alocado</div>
                  {alocacoes.map(a => (
                    <div key={a.custoId} className="flex items-center justify-between px-2.5 py-1.5 text-xs" style={{ borderTop: "1px solid #EFEAE0" }}>
                      <span style={{ color: "#8A8577" }}>{a.descricao} {a.data ? `· ${new Date(a.data + "T00:00:00").toLocaleDateString("pt-BR")}` : ""}{a.parcial ? " · parcial" : ""}</span>
                      <span className="font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: a.parcial ? "#B5762A" : "#4C7A5E" }}>{currency(a.valorAlocado)}</span>
                    </div>
                  ))}
                  {sobra > 0.004 && (
                    <div className="px-2.5 py-1.5 text-xs" style={{ borderTop: "1px solid #EFEAE0", color: "#B5762A" }}>
                      Saldo do comprovante que sobra depois de quitar as despesas marcadas: <b>{currency(sobra)}</b>
                      {" "}— fica guardado como <b>saldo credor</b> {ehMotorista ? `do motorista ${custo.motorista}` : "deste fornecedor"}, disponível para abater automaticamente a próxima despesa cadastrada até se esgotar.
                    </div>
                  )}
                </div>
              )}

              <button
                disabled={!podeConfirmar}
                onClick={() => onConfirm({
                  data, comprovanteThumb: imgThumb, valorTotalComprovante: Number(valor) || 0,
                  alocacoes: alocacoes.filter(a => a.valorAlocado > 0),
                  sobra, tipoParte: ehMotorista ? "motorista" : "fornecedor",
