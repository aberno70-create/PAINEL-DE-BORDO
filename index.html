                  chaveParte: ehMotorista ? custo.motorista : (custo.tipo === "combustivel" ? custo.posto : custo.fornecedor)
                })}
                className="mt-1 w-full py-2.5 rounded-md font-semibold text-sm text-white disabled:opacity-40"
                style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}
              >
                {ehMotorista ? "Confirmar ressarcimento" : "Confirmar pagamento"}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ===========================================================
   MODAL: COMPROVANTE DE PAGAMENTO DE PARCELA
   Mesmo critério do ressarcimento/pagamento: envia foto ou PDF,
   a IA lê valor e data, e o comprovante fica anexado à parcela.
=========================================================== */
function ParcelaPagamentoModal({ parcela, indice, onClose, onConfirm }) {
  const [step, setStep] = useState("upload");
  const [imgThumb, setImgThumb] = useState(null);
  const [isPdf, setIsPdf] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [valor, setValor] = useState(String(parcela.valor));
  const [data, setData] = useState(dataHojeISO());
  const fileRef = useRef(null);

  const handleFile = async (file) => {
    if (!file) return;
    const dataUrl = await fileToDataUrl(file);
    const pdf = file.type === "application/pdf";
    setIsPdf(pdf);
    setImgThumb(pdf ? await pdfThumbnail(dataUrl) : await resizeImage(dataUrl));
    setStep("extracting");
    try {
      const extracted = await extractComprovantePagamento(dataUrl);
      if (extracted.valor) setValor(String(extracted.valor));
      if (extracted.data) setData(extracted.data);
      setStep("review");
    } catch (e) {
      setErrorMsg(
        e.message === "SEM_CHAVE_API"
          ? "Nenhuma chave de API configurada. Abra Configurações para adicionar, ou preencha manualmente abaixo."
          : "Não consegui ler o comprovante automaticamente. Preencha manualmente abaixo."
      );
      setStep("review");
    }
  };

  const podeConfirmar = valor !== "" && !isNaN(Number(valor)) && Number(valor) > 0;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(28,30,34,0.7)" }}>
      <div className="w-full max-w-sm rounded-lg overflow-hidden flex flex-col max-h-[90vh]" style={{ background: "#F4F1E8", border: "1px solid #D9D3C4" }}>
        <div className="flex items-center justify-between px-4 py-3" style={{ background: "#1C1E22" }}>
          <span className="text-white text-sm font-semibold uppercase tracking-wider" style={{ fontFamily: "'Oswald', sans-serif" }}>Pagamento da {indice + 1}ª parcela</span>
          <button onClick={onClose} className="text-white/70 hover:text-white"><IconX size={18} /></button>
        </div>
        <div className="p-4 overflow-y-auto flex flex-col gap-3">
          <p className="text-xs" style={{ color: "#8A8577" }}>Valor previsto da parcela: <b>{currency(parcela.valor)}</b>. Envie o comprovante do pagamento para preencher automaticamente.</p>

          {step === "upload" && (
            <>
              <button onClick={() => fileRef.current?.click()}
                      className="w-full flex flex-col items-center justify-center gap-2 py-8 rounded-md border-2 border-dashed"
                      style={{ borderColor: "#D9D3C4", color: "#8A8577" }}>
                <IconUpload size={26} />
                <span className="text-sm font-medium">Enviar comprovante de pagamento (foto ou PDF)</span>
              </button>
              <button onClick={() => setStep("review")} className="text-xs underline self-center" style={{ color: "#8A8577" }}>
                Preencher manualmente, sem comprovante
              </button>
            </>
          )}
          <input ref={fileRef} type="file" accept="image/*,application/pdf" className="hidden"
                 onChange={(e) => handleFile(e.target.files?.[0])} />

          {step === "extracting" && (
            <div className="flex flex-col items-center gap-3 py-8">
              {imgThumb ? <img src={imgThumb} alt="" className="w-24 rounded border" style={{ borderColor: "#D9D3C4" }} />
                : isPdf ? <IconFile size={32} style={{ color: "#8A8577" }} /> : null}
              <IconLoader size={24} style={{ color: "#B5762A" }} />
              <span className="text-sm" style={{ color: "#8A8577" }}>Lendo o comprovante…</span>
            </div>
          )}

          {step === "review" && (
            <>
              {(imgThumb || isPdf) && (
                <div className="flex items-center gap-2">
                  {imgThumb ? <img src={imgThumb} alt="" className="w-14 rounded border shrink-0" style={{ borderColor: "#D9D3C4" }} />
                    : <div className="w-14 h-14 rounded border flex items-center justify-center shrink-0" style={{ borderColor: "#D9D3C4" }}><IconFile size={18} style={{ color: "#8A8577" }} /></div>}
                  {errorMsg && <div className="flex items-start gap-1.5 text-xs" style={{ color: "#B5473A" }}><IconAlert size={14} className="shrink-0 mt-0.5" />{errorMsg}</div>}
                </div>
              )}
              <Field label="Valor pago (R$)">
                <input type="number" step="0.01" value={valor} onChange={(e) => setValor(e.target.value)} />
              </Field>
              <Field label="Data do pagamento">
                <input type="date" value={data} onChange={(e) => setData(e.target.value)} />
              </Field>
              <button
                disabled={!podeConfirmar}
                onClick={() => onConfirm({ valorPago: Number(valor) || 0, dataPagamento: data, comprovanteThumb: imgThumb })}
                className="mt-1 w-full py-2.5 rounded-md font-semibold text-sm text-white disabled:opacity-40"
                style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}
              >
                Confirmar pagamento da parcela
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ===========================================================
   MODAL: DETALHE / EDIÇÃO DO TÍQUETE (com DRE da viagem)
=========================================================== */
function FreteDetailModal({ frete, custosDaViagem = [], onClose, onSave, onDelete, onAddCusto, onDeleteCusto, onToggleRessarcimento, onTogglePagamentoCusto, onToggleParcela, onAbrirImagem, todosCustos, onRemoverPagamento, onToggleComissao }) {
  const { config } = useConfig();
  const [form, setForm] = useState({
    valorFrete: frete.valorFrete ?? "", comissaoMotorista: frete.comissaoMotorista ?? "",
    dataTiquete: frete.dataTiquete || "", cteNumero: frete.cteNumero || "", cliente: frete.cliente || "",
    numeroContainer: frete.numeroContainer || "",
    motorista: frete.motorista || config.motoristas[0] || "", caminhao: frete.caminhao || "", observacao: frete.observacao || ""
  });
  const [confirmDelete, setConfirmDelete] = useState(false);
  const canSave = form.valorFrete !== "" && !isNaN(Number(form.valorFrete));

  const combustivelPago = custosDaViagem.filter(c => c.tipo === "combustivel" && custoEstaLiquidado(c)).reduce((s, c) => s + c.valor, 0);
  const combustivelPendente = custosDaViagem.filter(c => c.tipo === "combustivel" && !custoEstaLiquidado(c)).reduce((s, c) => s + c.valor, 0);
  const pedagioPago = custosDaViagem.filter(c => c.tipo === "pedagio" && custoEstaLiquidado(c)).reduce((s, c) => s + c.valor, 0);
  const pedagioPendente = custosDaViagem.filter(c => c.tipo === "pedagio" && !custoEstaLiquidado(c)).reduce((s, c) => s + c.valor, 0);
  const manutencaoPago = custosDaViagem.filter(c => c.tipo === "manutencao" && custoEstaLiquidado(c)).reduce((s, c) => s + c.valor, 0);
  const manutencaoPendente = custosDaViagem.filter(c => c.tipo === "manutencao" && !custoEstaLiquidado(c)).reduce((s, c) => s + c.valor, 0);
  const receitaViagem = Number(form.valorFrete) || 0;
  const comissaoViagem = Number(form.comissaoMotorista) || 0;
  const receitaRecebida = frete.status === "pago" ? receitaViagem : 0;
  const receitaAReceber = frete.status === "pago" ? 0 : receitaViagem;
  const comissaoItemAtual = comissaoComoItem(frete);
  const comissaoPagaAcumuladaAtual = valorPagoAcumulado(comissaoItemAtual);
  const comissaoPaga = Math.min(comissaoPagaAcumuladaAtual, comissaoViagem);
  const comissaoPendente = Math.max(comissaoViagem - comissaoPaga, 0);
  const resultadoViagem = receitaRecebida - comissaoPaga - combustivelPago - pedagioPago - manutencaoPago;
  // Totalização pelos lançamentos efetuados (bruta, independente de já ter sido pago/recebido) —
  // para saber se a viagem deu lucro ou prejuízo. O recebido/a receber e pago/a pagar continuam
  // detalhados no bloco "Pendente de confirmação" logo abaixo.
  const resultadoBrutoViagem = receitaViagem - comissaoViagem - (combustivelPago + combustivelPendente) - (pedagioPago + pedagioPendente) - (manutencaoPago + manutencaoPendente);
  const temPendencia = receitaAReceber > 0 || comissaoPendente > 0 || combustivelPendente > 0 || pedagioPendente > 0 || manutencaoPendente > 0;
  const previsaoRecebimento = frete.status === "pendente" && frete.dataTiquete
    ? (() => { const d = new Date(frete.dataTiquete + "T00:00:00"); d.setDate(d.getDate() + 7); return d.toLocaleDateString("pt-BR"); })()
    : null;

  const iconesTipo = { combustivel: IconFuel, pedagio: IconToll, manutencao: IconWrench };
  const nomesTipo = { combustivel: "Combustível", pedagio: "Pedágio", manutencao: null };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(28,30,34,0.7)" }}>
      <div className="w-full max-w-md rounded-lg overflow-hidden flex flex-col max-h-[90vh]" style={{ background: "#F4F1E8", border: "1px solid #D9D3C4" }}>
        <div className="flex items-center justify-between px-4 py-3" style={{ background: "#1C1E22" }}>
          <span className="text-white text-sm font-semibold uppercase tracking-wider flex items-center gap-2" style={{ fontFamily: "'Oswald', sans-serif" }}>
            <IconEdit size={15} /> Tíquete de frete
          </span>
          <button onClick={onClose} className="text-white/70 hover:text-white"><IconX size={18} /></button>
        </div>
        <div className="p-4 overflow-y-auto flex flex-col gap-3">
          <div className="flex items-center gap-3">
            {frete.imagemThumb ? <img src={frete.imagemThumb} alt="" onClick={() => onAbrirImagem(frete.imagemThumb)} className="w-16 h-16 object-cover rounded border cursor-zoom-in" style={{ borderColor: "#D9D3C4" }} />
              : <div className="w-16 h-16 rounded border flex items-center justify-center" style={{ borderColor: "#D9D3C4" }}><IconFile size={20} style={{ color: "#8A8577" }} /></div>}
            <div className="flex flex-col gap-1.5">
              <StampBadge status={frete.status} />
              <button onClick={() => onToggleComissao && onToggleComissao(frete)}><ComissaoTag status={custoEstaLiquidado(comissaoItemAtual) ? "pago" : "pendente"} /></button>
            </div>
          </div>
          {comissaoItemAtual.pagamentos.length > 0 && (
            <div className="flex flex-col gap-1 pl-1">
              {comissaoItemAtual.pagamentos.map((p) => (
                <div key={p.id} className="flex items-center gap-2 text-[11px]" style={{ color: "#8A8577" }}>
                  {p.comprovanteThumb
                    ? <img src={p.comprovanteThumb} alt="comprovante" title={`Comprovante · ${currency(p.valor)} de ${currency(p.valorTotalComprovante || p.valor)}`}
                           onClick={() => onAbrirImagem(p.comprovanteThumb)} className="w-8 h-8 object-cover rounded shrink-0 cursor-zoom-in" style={{ border: "1px solid #D9D3C4" }} />
                    : <div className="w-8 h-8 rounded shrink-0 flex items-center justify-center" style={{ border: "1px solid #D9D3C4", background: "#F4F1E8" }}><IconFile size={13} style={{ color: "#8A8577" }} /></div>}
                  <span>Comissão — deste comprovante ({p.data ? new Date(p.data + "T00:00:00").toLocaleDateString("pt-BR") : "sem data"}): <b>{currency(p.valor)}</b>{p.valorTotalComprovante && p.valorTotalComprovante !== p.valor ? ` de ${currency(p.valorTotalComprovante)} no total` : ""}</span>
                  {onRemoverPagamento && (
                    <button onClick={() => onRemoverPagamento(comissaoItemAtual.id, p.id)} title="Remover este pagamento (corrigir valor errado)" style={{ color: "#B5473A" }}>
                      <IconX size={12} />
                    </button>
                  )}
                </div>
              ))}
            </div>
          )}
          <div className="flex items-center gap-1.5 text-sm font-semibold" style={{ color: "#24221D" }}>
            <IconContainer size={15} style={{ color: "#B5762A" }} /> Container {frete.numeroContainer || "TBN"}
          </div>
          <p className="text-xs" style={{ color: "#8A8577" }}>
            O valor do frete é a receber da <b>{config.nomeEmpresa}</b>. A comissão é do motorista e tem status de pagamento próprio.
          </p>
          {previsaoRecebimento && (
            <div className="flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded" style={{ background: "#FDF6EC", color: "#B5762A" }}>
              <IconClock size={13} /> Previsão de recebimento (prazo de 7 dias): <b>{previsaoRecebimento}</b>
            </div>
          )}

          <div className="rounded-md overflow-hidden" style={{ background: "#FFFFFF", border: "1px solid #D9D3C4" }}>
            <div className="px-3 py-2 text-xs font-semibold uppercase tracking-wide" style={{ background: "#1C1E22", color: "#E8A33D", fontFamily: "'Oswald', sans-serif" }}>
              DRE da viagem — lançamentos efetuados (lucro ou prejuízo)
            </div>
            <table className="w-full text-sm">
              <tbody>
                <tr style={{ borderTop: "1px solid #EFEAE0" }}><td className="px-3 py-1.5" style={{ color: "#8A8577" }}>Frete</td><td className="px-3 py-1.5 text-right font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#4C7A5E" }}>{currency(receitaViagem)}</td></tr>
                <tr style={{ borderTop: "1px solid #EFEAE0" }}><td className="px-3 py-1.5" style={{ color: "#8A8577" }}>(−) Comissão</td><td className="px-3 py-1.5 text-right font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#B5473A" }}>{currency(comissaoViagem)}</td></tr>
                <tr style={{ borderTop: "1px solid #EFEAE0" }}><td className="px-3 py-1.5" style={{ color: "#8A8577" }}>(−) Combustível</td><td className="px-3 py-1.5 text-right font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#B5473A" }}>{currency(combustivelPago + combustivelPendente)}</td></tr>
                {(pedagioPago > 0 || pedagioPendente > 0) && (
                  <tr style={{ borderTop: "1px solid #EFEAE0" }}><td className="px-3 py-1.5" style={{ color: "#8A8577" }}>(−) Pedágio</td><td className="px-3 py-1.5 text-right font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#B5473A" }}>{currency(pedagioPago + pedagioPendente)}</td></tr>
                )}
                {(manutencaoPago > 0 || manutencaoPendente > 0) && (
                  <tr style={{ borderTop: "1px solid #EFEAE0" }}><td className="px-3 py-1.5" style={{ color: "#8A8577" }}>(−) Manutenção</td><td className="px-3 py-1.5 text-right font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#B5473A" }}>{currency(manutencaoPago + manutencaoPendente)}</td></tr>
                )}
                <tr style={{ borderTop: "2px solid #D9D3C4" }}><td className="px-3 py-2 font-semibold" style={{ color: "#24221D" }}>Saldo da viagem</td><td className="px-3 py-2 text-right font-bold" style={{ fontFamily: "'JetBrains Mono', monospace", color: resultadoBrutoViagem >= 0 ? "#4C7A5E" : "#B5473A" }}>{currency(resultadoBrutoViagem)}</td></tr>
              </tbody>
            </table>
          </div>

          {temPendencia && (
            <div className="rounded-md overflow-hidden" style={{ background: "#FDF6EC", border: "1px solid #E8C79A" }}>
              <div className="px-3 py-2 text-xs font-semibold uppercase tracking-wide" style={{ color: "#B5762A", fontFamily: "'Oswald', sans-serif" }}>
                Ainda pendente de pagamento ou recebimento
              </div>
              <table className="w-full text-sm">
                <tbody>
                  {receitaAReceber > 0 && <tr style={{ borderTop: "1px solid #EFE0C8" }}><td className="px-3 py-1.5" style={{ color: "#8A8577" }}>Frete a receber</td><td className="px-3 py-1.5 text-right font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#B5762A" }}>{currency(receitaAReceber)}</td></tr>}
                  {comissaoPendente > 0 && <tr style={{ borderTop: "1px solid #EFE0C8" }}><td className="px-3 py-1.5" style={{ color: "#8A8577" }}>Comissão a pagar</td><td className="px-3 py-1.5 text-right font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#B5762A" }}>{currency(comissaoPendente)}</td></tr>}
                  {combustivelPendente > 0 && <tr style={{ borderTop: "1px solid #EFE0C8" }}><td className="px-3 py-1.5" style={{ color: "#8A8577" }}>Combustível pendente</td><td className="px-3 py-1.5 text-right font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#B5762A" }}>{currency(combustivelPendente)}</td></tr>}
                  {pedagioPendente > 0 && <tr style={{ borderTop: "1px solid #EFE0C8" }}><td className="px-3 py-1.5" style={{ color: "#8A8577" }}>Pedágio pendente</td><td className="px-3 py-1.5 text-right font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#B5762A" }}>{currency(pedagioPendente)}</td></tr>}
                  {manutencaoPendente > 0 && <tr style={{ borderTop: "1px solid #EFE0C8" }}><td className="px-3 py-1.5" style={{ color: "#8A8577" }}>Manutenção pendente</td><td className="px-3 py-1.5 text-right font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#B5762A" }}>{currency(manutencaoPendente)}</td></tr>}
                </tbody>
              </table>
            </div>
          )}

          {custosDaViagem.length > 0 && (
            <div className="flex flex-col gap-1.5">
              {custosDaViagem.map(c => {
                const IconTipo = iconesTipo[c.tipo] || IconWrench;
                const diff = diferencaReembolso(c);
                const isParcelado = c.formaPagamento === "parcelado" && c.parcelas && c.parcelas.length > 0;
                return (
                  <div key={c.id} className="flex flex-col gap-1 text-xs px-2.5 py-1.5 rounded" style={{ background: "#FFFFFF", border: "1px solid #D9D3C4" }}>
                    <div className="flex items-center gap-2">
                      <IconTipo size={12} style={{ color: c.tipo === "manutencao" ? "#4C7A5E" : "#B5762A" }} />
                      <span style={{ color: "#24221D" }}>{nomesTipo[c.tipo] || c.itemPrincipal}</span>
                      <span className="font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#24221D" }}>{currency(c.valor)}</span>
                      <span className="ml-auto" />
                      {c.pagoPor === "motorista"
                        ? <button onClick={() => onToggleRessarcimento(c)}><RessarcimentoTag status={custoEstaLiquidado(c) ? "ressarcido" : "pendente"} /></button>
                        : !isParcelado && <button onClick={() => onTogglePagamentoCusto(c)}><StampBadge status={custoEstaLiquidado(c) ? "pago" : "pendente"} /></button>}
                      <button onClick={() => onDeleteCusto(c.id)} style={{ color: "#8A8577" }}><IconTrash size={12} /></button>
                    </div>
                    {diff !== 0 && (
                      <div style={{ color: diff > 0 ? "#B5473A" : "#4C7A5E" }}>
                        {diff > 0 ? `Ainda falta ressarcir: ${currency(diff)}` : `Motorista deve devolver: ${currency(-diff)}`}
                      </div>
                    )}
                    {!isParcelado && c.pagamentos && c.pagamentos.length > 0 && !custoEstaLiquidado(c) && (
                      <div style={{ color: "#B5762A" }}>
                        {c.pagoPor === "motorista" ? "Ressarcido até agora" : "Pago até agora"}: {currency(valorPagoAcumulado(c))} · Saldo pendente: {currency(saldoPendenteCusto(c))}
                      </div>
                    )}
                    {!isParcelado && c.pagamentos && c.pagamentos.length > 0 && (
                      <div className="flex flex-col gap-1">
                        {c.pagamentos.map((p) => {
                          const outrosQuitados = (todosCustos || []).filter(oc => oc.id !== c.id && (oc.pagamentos || []).some(op => op.loteId && op.loteId === p.loteId));
                          return (
                            <div key={p.id} className="flex items-center gap-1.5">
                              {p.comprovanteThumb
                                ? <img src={p.comprovanteThumb} alt="comprovante" title={`Comprovante · ${currency(p.valor)} de ${currency(p.valorTotalComprovante || p.valor)}`}
                                       onClick={() => onAbrirImagem(p.comprovanteThumb)} className="w-6 h-6 object-cover rounded cursor-zoom-in" style={{ border: "1px solid #D9D3C4" }} />
                                : <div className="w-6 h-6 rounded flex items-center justify-center" style={{ border: "1px solid #D9D3C4", background: "#F4F1E8" }}><IconFile size={10} style={{ color: "#8A8577" }} /></div>}
                              <span className="flex-1" style={{ color: "#8A8577" }}>
                                {currency(p.valor)} · {p.data ? new Date(p.data + "T00:00:00").toLocaleDateString("pt-BR") : "sem data"}{outrosQuitados.length > 0 ? ` · também quitou ${outrosQuitados.length} outro(s) documento(s)` : ""}
                              </span>
                              {onRemoverPagamento && (
                                <button onClick={() => onRemoverPagamento(c.id, p.id)} title="Remover este pagamento (corrigir valor errado)" style={{ color: "#B5473A" }}>
                                  <IconX size={11} />
                                </button>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                    {isParcelado && (
                      <div className="flex flex-col gap-1 mt-1">
                        {c.parcelas.map((p, i) => (
                          <div key={p.id} className="flex items-center gap-1.5">
                            {p.comprovanteThumb && <img src={p.comprovanteThumb} alt="comprovante" title={p.dataPagamento ? `Comprovante de ${new Date(p.dataPagamento + "T00:00:00").toLocaleDateString("pt-BR")}` : "Comprovante"} onClick={() => onAbrirImagem(p.comprovanteThumb)} className="w-6 h-6 object-cover rounded cursor-zoom-in" style={{ border: "1px solid #D9D3C4" }} />}
                            <button onClick={() => onToggleParcela(c.id, p.id)} className="flex items-center gap-1.5 text-left" style={{ color: "#8A8577" }}>
                              <span>{i + 1}ª parcela {currency(p.valor)} · vence {new Date(p.vencimento + "T00:00:00").toLocaleDateString("pt-BR")}</span>
                              <span className="font-semibold" style={{ color: p.status === "pago" ? "#4C7A5E" : "#B5473A" }}>{p.status === "pago" ? "paga" : "pendente"}</span>
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          <button onClick={onAddCusto} className="flex items-center justify-center gap-1.5 py-2 rounded-md text-xs font-semibold uppercase tracking-wide border" style={{ borderColor: "#D9D3C4", color: "#24221D", fontFamily: "'Oswald', sans-serif" }}>
            <IconPlus size={14} /> Adicionar custo desta viagem
          </button>

          <Field label="Data do tíquete"><input type="date" value={form.dataTiquete} onChange={(e) => setForm({ ...form, dataTiquete: e.target.value })} /></Field>
          <Field label={`Valor do frete (R$) — a receber da ${config.nomeEmpresa}`}><input type="number" step="0.01" value={form.valorFrete} onChange={(e) => setForm({ ...form, valorFrete: e.target.value })} /></Field>
          <Field label="Comissão do motorista (R$)"><input type="number" step="0.01" value={form.comissaoMotorista} onChange={(e) => setForm({ ...form, comissaoMotorista: e.target.value })} /></Field>
          <Field label="Motorista"><input type="text" value={form.motorista} onChange={(e) => setForm({ ...form, motorista: e.target.value })} /></Field>
          <Field label="Caminhão (placa ou identificação)"><input type="text" list="caminhoes-list" value={form.caminhao} onChange={(e) => setForm({ ...form, caminhao: e.target.value })} /></Field>
          <Field label="Número do container"><input type="text" value={form.numeroContainer} onChange={(e) => setForm({ ...form, numeroContainer: e.target.value })} /></Field>
          <Field label="Nº do CTe / Nota fiscal"><input type="text" value={form.cteNumero} onChange={(e) => setForm({ ...form, cteNumero: e.target.value })} /></Field>
          <Field label="Cliente"><input type="text" value={form.cliente} onChange={(e) => setForm({ ...form, cliente: e.target.value })} /></Field>
          <Field label="Observação"><input type="text" value={form.observacao} onChange={(e) => setForm({ ...form, observacao: e.target.value })} /></Field>

          <button
            disabled={!canSave}
            onClick={() => onSave({ ...frete, valorFrete: Number(form.valorFrete) || 0, comissaoMotorista: Number(form.comissaoMotorista) || 0, dataTiquete: form.dataTiquete, cteNumero: form.cteNumero, cliente: form.cliente, motorista: form.motorista, caminhao: form.caminhao, numeroContainer: form.numeroContainer, observacao: form.observacao })}
            className="mt-1 w-full py-2.5 rounded-md font-semibold text-sm text-white disabled:opacity-40"
            style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}
          >
            Salvar alterações
          </button>

          {!confirmDelete ? (
            <button onClick={() => setConfirmDelete(true)} className="w-full py-2 rounded-md text-xs font-semibold uppercase tracking-wide flex items-center justify-center gap-1.5" style={{ color: "#B5473A" }}>
              <IconTrash size={13} /> Excluir tíquete
            </button>
          ) : (
            <div className="flex gap-2">
              <button onClick={() => onDelete(frete.id)} className="flex-1 py-2 rounded-md text-xs font-semibold uppercase tracking-wide text-white" style={{ background: "#B5473A", fontFamily: "'Oswald', sans-serif" }}>Confirmar exclusão</button>
              <button onClick={() => setConfirmDelete(false)} className="flex-1 py-2 rounded-md text-xs font-semibold uppercase tracking-wide border" style={{ borderColor: "#D9D3C4", color: "#24221D", fontFamily: "'Oswald', sans-serif" }}>Cancelar</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ===========================================================
   LINHAS DE LISTAGEM
=========================================================== */
function TicketRow({ frete, onToggle, onToggleComissao, onDelete, onOpen, showEmpresa, dre, onAbrirImagem }) {
  const { config } = useConfig();
  const previsaoRecebimento = frete.status === "pendente" && frete.dataTiquete
    ? (() => { const d = new Date(frete.dataTiquete + "T00:00:00"); d.setDate(d.getDate() + 7); return d.toLocaleDateString("pt-BR"); })()
    : null;
  return (
    <div onClick={() => onOpen(frete)} className="flex items-center gap-3 rounded-md p-3 relative overflow-hidden cursor-pointer hover:shadow-sm" style={{ background: "#FFFFFF", border: "1px solid #D9D3C4" }}>
      <div className="absolute left-0 top-0 bottom-0 w-1" style={{ background: frete.status === "pago" ? "#4C7A5E" : "#B5473A" }} />
      {frete.imagemThumb ? <img src={frete.imagemThumb} alt="" onClick={(e) => { e.stopPropagation(); onAbrirImagem(frete.imagemThumb); }} className="w-12 h-12 object-cover rounded shrink-0 cursor-zoom-in" style={{ border: "1px solid #D9D3C4" }} />
        : <div className="w-12 h-12 rounded shrink-0 flex items-center justify-center" style={{ background: "#F4F1E8" }}><IconFile size={16} style={{ color: "#8A8577" }} /></div>}
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 flex-wrap">
          {showEmpresa && <span className="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded" style={{ background: "#F4F1E8", color: "#B5762A", fontFamily: "'Oswald', sans-serif" }}>{config.nomeEmpresa}</span>}
          <span className="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded flex items-center gap-1" style={{ background: "#1C1E22", color: "#E8A33D", fontFamily: "'Oswald', sans-serif" }}>
            <IconContainer size={10} /> {frete.numeroContainer || "TBN"}
          </span>
          <span className="font-bold text-sm" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#24221D" }}>{currency(frete.valorFrete)}</span>
          <span className="text-[10px]" style={{ color: frete.status === "pago" ? "#4C7A5E" : "#8A8577" }}>
            {frete.status === "pago"
              ? `recebido${frete.dataPagamento ? " em " + new Date(frete.dataPagamento.slice(0, 10) + "T00:00:00").toLocaleDateString("pt-BR") : ""}`
              : `a receber da ${config.nomeEmpresa}`}
          </span>
          {frete.temAnexoPdf && <span className="text-[10px] flex items-center gap-0.5" style={{ color: "#8A8577" }}><IconFile size={11} /> PDF</span>}
        </div>
        <div className="text-xs truncate" style={{ color: "#8A8577" }}>
          {[frete.dataTiquete && new Date(frete.dataTiquete + "T00:00:00").toLocaleDateString("pt-BR"), frete.cliente, frete.cteNumero && `CTe ${frete.cteNumero}`, frete.caminhao && `Caminhão ${frete.caminhao}`].filter(Boolean).join(" · ") || "Sem detalhes adicionais"}
        </div>
        {previsaoRecebimento && (
          <div className="text-[11px]" style={{ color: "#B5762A" }}>Previsão de recebimento: {previsaoRecebimento}</div>
        )}
        {dre && (() => {
          const combustivelTotal = dre.combustivelPago + dre.combustivelPendente;
          const pedagioTotal = dre.pedagioPago + dre.pedagioPendente;
          const manutencaoTotal = dre.manutencaoPago + dre.manutencaoPendente;
          const comissaoTotal = frete.comissaoMotorista || 0;
          // Totaliza pelos lançamentos efetuados (independente de já ter sido pago/recebido) —
          // a intenção aqui é mostrar se a viagem deu lucro ou prejuízo. O recebido/pago,
          // a receber/a pagar já ficam separados no quadro do Resumo.
          const resultadoBruto = frete.valorFrete - comissaoTotal - combustivelTotal - pedagioTotal - manutencaoTotal;
          const linhas = [
            ["+ Frete", frete.valorFrete],
            comissaoTotal > 0 ? ["− Comissão", comissaoTotal] : null,
            combustivelTotal > 0 ? ["− Combustível", combustivelTotal] : null,
            pedagioTotal > 0 ? ["− Pedágio", pedagioTotal] : null,
            manutencaoTotal > 0 ? ["− Manutenção", manutencaoTotal] : null
          ].filter(Boolean);
          const totalDespesas = comissaoTotal + combustivelTotal + pedagioTotal + manutencaoTotal;
          return (
            <div className="mt-1 text-[11px]" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#8A8577" }}>
              {linhas.map(([label, val]) => <div key={label}>{label}: {currency(val)}</div>)}
              <div style={{ borderTop: "1px solid #EFEAE0", marginTop: 2, paddingTop: 2 }}>Total de despesas: {currency(totalDespesas)}</div>
              <div className="font-semibold" style={{ color: resultadoBruto >= 0 ? "#4C7A5E" : "#B5473A" }}>
                = Saldo: {currency(resultadoBruto)}
                {dre.temPendencia && <span className="font-normal" style={{ fontFamily: "'Inter', sans-serif", color: "#B5762A" }}> · há pagamentos ou recebimentos pendentes</span>}
              </div>
            </div>
          );
        })()}
      </div>
      <div className="flex flex-col items-end gap-1.5 shrink-0">
        <div className="flex flex-col items-end">
          <button onClick={(e) => { e.stopPropagation(); onToggle(frete.id); }}><StampBadge status={frete.status} /></button>
          {frete.status === "pago" && frete.dataPagamento && (
            <span className="text-[9px]" style={{ color: "#8A8577" }}>{new Date(frete.dataPagamento.slice(0, 10) + "T00:00:00").toLocaleDateString("pt-BR")}</span>
          )}
        </div>
        <div className="flex flex-col items-end">
          <button onClick={(e) => { e.stopPropagation(); onToggleComissao(frete); }}><ComissaoTag status={custoEstaLiquidado(comissaoComoItem(frete)) ? "pago" : "pendente"} /></button>
          {frete.comissaoPagamentos && frete.comissaoPagamentos.length > 0 && (
            <span className="text-[9px]" style={{ color: "#8A8577" }}>{new Date(frete.comissaoPagamentos[frete.comissaoPagamentos.length - 1].data + "T00:00:00").toLocaleDateString("pt-BR")}</span>
          )}
        </div>
      </div>
      <button onClick={(e) => { e.stopPropagation(); onDelete(frete.id); }} className="shrink-0 p-1.5 rounded hover:opacity-70" style={{ color: "#8A8577" }}><IconTrash size={15} /></button>
    </div>
  );
}

function CustoRow({ custo, onDelete, onToggleRessarcimento, onTogglePagamento, onToggleParcela, viagem, onAbrirImagem, onOpen, todosCustos, onRemoverPagamento }) {
  const isFuel = custo.tipo === "combustivel";
  const isPedagio = custo.tipo === "pedagio";
  const IconTipo = isFuel ? IconFuel : isPedagio ? IconToll : IconWrench;
  const nomeTipo = isFuel ? "Combustível" : isPedagio ? "Pedágio" : (custo.itemPrincipal || "Manutenção");
  const diff = diferencaReembolso(custo);
  const liquidado = custoEstaLiquidado(custo);
  const isParcelado = custo.formaPagamento === "parcelado" && custo.parcelas && custo.parcelas.length > 0;
  return (
    <div className="flex flex-col gap-1 rounded-md p-3" style={{ background: "#FFFFFF", border: "1px solid #D9D3C4" }}>
      <div className="flex items-center gap-3">
        {custo.imagemThumb ? <img src={custo.imagemThumb} alt="" onClick={() => onAbrirImagem(custo.imagemThumb)} className="w-10 h-10 object-cover rounded shrink-0 cursor-zoom-in" style={{ border: "1px solid #D9D3C4" }} />
          : <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: isFuel || isPedagio ? "#F0E4D2" : "#E4E8E2" }}><IconTipo size={16} style={{ color: isFuel || isPedagio ? "#B5762A" : "#4C7A5E" }} /></div>}
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="font-bold text-sm" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#24221D" }}>{currency(custo.valor)}</span>
            <span className="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded" style={{ background: isFuel || isPedagio ? "#F0E4D2" : "#E4E8E2", color: isFuel || isPedagio ? "#B5762A" : "#4C7A5E", fontFamily: "'Oswald', sans-serif" }}>
              {nomeTipo}
            </span>
            {isParcelado && (
              <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ background: "#F4F1E8", color: "#8A8577" }}>Parcelado ({custo.parcelas.length}x)</span>
            )}
            {custo.temAnexoPdf && <span className="text-[10px] flex items-center gap-0.5" style={{ color: "#8A8577" }}><IconFile size={11} /> PDF</span>}
            {viagem ? (
              <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ background: "#F4F1E8", color: "#8A8577" }}>
                Container {viagem.numeroContainer || "TBN"} · {viagem.dataTiquete ? new Date(viagem.dataTiquete + "T00:00:00").toLocaleDateString("pt-BR") : ""} · {viagem.cliente || "sem cliente"}
              </span>
            ) : (
              <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ background: "#F4F1E8", color: "#8A8577" }}>Despesas gerais</span>
            )}
          </div>
          <div className="text-xs truncate" style={{ color: "#8A8577" }}>
            {[
              custo.data && new Date(custo.data + "T00:00:00").toLocaleDateString("pt-BR"),
              custo.posto, custo.fornecedor, custo.descricao, custo.veiculo,
              isFuel && custo.litros ? `${custo.litros} L` : null,
              isFuel && custo.precoLiquido ? `líquido ${currency(custo.precoLiquido)}` : null,
              isFuel && custo.quilometragem ? `${custo.quilometragem} km` : null,
              custo.pagoPor === "motorista" ? "pago pelo motorista" : null
            ].filter(Boolean).join(" · ")}
          </div>
        </div>
        {custo.pagoPor === "motorista"
          ? <button onClick={() => onToggleRessarcimento(custo)} className="shrink-0"><RessarcimentoTag status={liquidado ? "ressarcido" : "pendente"} /></button>
          : !isParcelado && <button onClick={() => onTogglePagamento(custo)} className="shrink-0"><StampBadge status={liquidado ? "pago" : "pendente"} /></button>}
        {onOpen && <button onClick={() => onOpen(custo)} className="shrink-0 p-1.5 rounded hover:opacity-70" style={{ color: "#8A8577" }}><IconEdit size={14} /></button>}
        <button onClick={() => onDelete(custo.id)} className="shrink-0 p-1.5 rounded hover:opacity-70" style={{ color: "#8A8577" }}><IconTrash size={15} /></button>
      </div>
      {diff !== 0 && (
        <div className="text-xs" style={{ color: diff > 0 ? "#B5473A" : "#4C7A5E" }}>
          {diff > 0 ? `Ainda falta ressarcir: ${currency(diff)}` : `Motorista deve devolver: ${currency(-diff)}`}
        </div>
      )}
      {!isParcelado && custo.pagamentos && custo.pagamentos.length > 0 && !liquidado && (
        <div className="text-xs" style={{ color: "#B5762A" }}>
          {custo.pagoPor === "motorista" ? "Ressarcido até agora" : "Pago até agora"}: {currency(valorPagoAcumulado(custo))} · Saldo pendente: {currency(saldoPendenteCusto(custo))}
        </div>
      )}
      {!isParcelado && custo.pagamentos && custo.pagamentos.length > 0 && (
        <div className="flex flex-col gap-1 pl-12">
          {custo.pagamentos.map((p) => {
            const outrosQuitados = (todosCustos || []).filter(oc => oc.id !== custo.id && (oc.pagamentos || []).some(op => op.loteId && op.loteId === p.loteId));
            return (
              <div key={p.id} className="flex items-center gap-2">
                {p.comprovanteThumb
                  ? <img src={p.comprovanteThumb} alt="comprovante" title={`Comprovante · ${currency(p.valor)} de ${currency(p.valorTotalComprovante || p.valor)}`}
                         onClick={() => onAbrirImagem(p.comprovanteThumb)} className="w-8 h-8 object-cover rounded shrink-0 cursor-zoom-in" style={{ border: "1px solid #D9D3C4" }} />
                  : <div className="w-8 h-8 rounded shrink-0 flex items-center justify-center" style={{ border: "1px solid #D9D3C4", background: "#F4F1E8" }}><IconFile size={13} style={{ color: "#8A8577" }} /></div>}
                <div className="text-[11px] flex-1" style={{ color: "#8A8577" }}>
                  <div>Deste comprovante ({p.data ? new Date(p.data + "T00:00:00").toLocaleDateString("pt-BR") : "sem data"}): <b>{currency(p.valor)}</b>{p.valorTotalComprovante && p.valorTotalComprovante !== p.valor ? ` de ${currency(p.valorTotalComprovante)} no total` : ""}</div>
                  {outrosQuitados.length > 0 && (
                    <div>Também quitou: {outrosQuitados.map(oc => (oc.tipo === "combustivel" ? "Combustível" : oc.tipo === "pedagio" ? "Pedágio" : (oc.itemPrincipal || "Manutenção")) + (oc.data ? ` (${new Date(oc.data + "T00:00:00").toLocaleDateString("pt-BR")})` : "")).join(", ")}</div>
                  )}
                </div>
                {onRemoverPagamento && (
                  <button onClick={() => onRemoverPagamento(custo.id, p.id)} title="Remover este pagamento (corrigir valor errado)" style={{ color: "#B5473A" }}>
                    <IconX size={13} />
                  </button>
                )}
              </div>
            );
          })}
        </div>
      )}
      {isParcelado && (
        <div className="flex flex-col gap-1 pl-12 text-xs" style={{ color: "#8A8577" }}>
          {custo.parcelas.map((p, i) => (
            <div key={p.id} className="flex items-center gap-1.5">
              {p.comprovanteThumb && <img src={p.comprovanteThumb} alt="comprovante" title={p.dataPagamento ? `Comprovante de ${new Date(p.dataPagamento + "T00:00:00").toLocaleDateString("pt-BR")}` : "Comprovante"} onClick={() => onAbrirImagem(p.comprovanteThumb)} className="w-6 h-6 object-cover rounded cursor-zoom-in shrink-0" style={{ border: "1px solid #D9D3C4" }} />}
              <button onClick={() => onToggleParcela(custo.id, p.id)} className="text-left">
                {i + 1}ª {currency(p.valor)} · vence {new Date(p.vencimento + "T00:00:00").toLocaleDateString("pt-BR")} · <span style={{ color: p.status === "pago" ? "#4C7A5E" : "#B5473A", fontWeight: 600 }}>{p.status === "pago" ? "paga" : "pendente"}</span>
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ComissaoRow({ frete, onOpenPagamento, onToggleReverter, onAbrirImagem, todosItens, onRemoverPagamento }) {
  const item = comissaoComoItem(frete);
  const liquidado = custoEstaLiquidado(item);
  const diff = diferencaReembolso(item);
  return (
    <div className="flex flex-col gap-1 rounded-md p-3" style={{ background: "#FFFFFF", border: "1px solid #D9D3C4" }}>
      <div className="flex items-center gap-3">
        <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: "#E4E8E2" }}>
          <IconUser size={16} style={{ color: "#4C7A5E" }} />
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="font-bold text-sm" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#24221D" }}>{currency(item.valor)}</span>
            <span className="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded" style={{ background: "#E4E8E2", color: "#4C7A5E", fontFamily: "'Oswald', sans-serif" }}>Comissão</span>
            <span className="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded flex items-center gap-1" style={{ background: "#1C1E22", color: "#E8A33D", fontFamily: "'Oswald', sans-serif" }}>
              <IconContainer size={10} /> {frete.numeroContainer || "TBN"}
            </span>
            <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ background: "#F4F1E8", color: "#8A8577" }}>
              Guia do frete {frete.dataTiquete ? new Date(frete.dataTiquete + "T00:00:00").toLocaleDateString("pt-BR") : ""}{frete.cliente ? ` · ${frete.cliente}` : ""}
            </span>
          </div>
        </div>
        <button onClick={() => (liquidado ? onToggleReverter(frete) : onOpenPagamento(frete))} className="shrink-0"><RessarcimentoTag status={liquidado ? "ressarcido" : "pendente"} /></button>
      </div>
      {diff !== 0 && (
        <div className="text-xs" style={{ color: diff > 0 ? "#B5473A" : "#4C7A5E" }}>
          {diff > 0 ? `Ainda falta pagar da comissão: ${currency(diff)}` : `Motorista deve devolver: ${currency(-diff)}`}
        </div>
      )}
      {!liquidado && item.pagamentos.length > 0 && (
        <div className="text-xs" style={{ color: "#B5762A" }}>
          Pago até agora: {currency(valorPagoAcumulado(item))} · Saldo pendente: {currency(saldoPendenteCusto(item))}
        </div>
      )}
      {item.pagamentos.length > 0 && (
        <div className="flex flex-col gap-1 pl-12">
          {item.pagamentos.map((p) => {
            const outrosQuitados = (todosItens || []).filter(oi => oi.id !== item.id && (oi.pagamentos || []).some(op => op.loteId && op.loteId === p.loteId));
            return (
              <div key={p.id} className="flex items-center gap-2">
                {p.comprovanteThumb
                  ? <img src={p.comprovanteThumb} alt="comprovante" title={`Comprovante · ${currency(p.valor)} de ${currency(p.valorTotalComprovante || p.valor)}`}
                         onClick={() => onAbrirImagem(p.comprovanteThumb)} className="w-8 h-8 object-cover rounded shrink-0 cursor-zoom-in" style={{ border: "1px solid #D9D3C4" }} />
                  : <div className="w-8 h-8 rounded shrink-0 flex items-center justify-center" style={{ border: "1px solid #D9D3C4", background: "#F4F1E8" }}><IconFile size={13} style={{ color: "#8A8577" }} /></div>}
                <div className="text-[11px] flex-1" style={{ color: "#8A8577" }}>
                  <div>Deste comprovante ({p.data ? new Date(p.data + "T00:00:00").toLocaleDateString("pt-BR") : "sem data"}): <b>{currency(p.valor)}</b>{p.valorTotalComprovante && p.valorTotalComprovante !== p.valor ? ` de ${currency(p.valorTotalComprovante)} no total` : ""}</div>
                  {outrosQuitados.length > 0 && (
                    <div>Também quitou: {outrosQuitados.length} outro(s) documento(s) do motorista</div>
                  )}
                </div>
                {onRemoverPagamento && (
                  <button onClick={() => onRemoverPagamento(item.id, p.id)} title="Remover este pagamento (corrigir valor errado)" style={{ color: "#B5473A" }}>
                    <IconX size={13} />
                  </button>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ===========================================================
   TELA DE LOGIN (senha local, protege o acesso neste computador)
=========================================================== */
/* ===========================================================
   VISUALIZADOR DE IMAGEM AMPLIADA
   Obs.: o navegador não permite que o app acesse ou "busque" o
   arquivo original na pasta do computador — por segurança, uma
   página web nunca recebe o caminho real do arquivo, só os
   bytes da imagem no momento do envio. Isso vale para qualquer
   app rodando no navegador, não é uma limitação deste sistema.
   Para compensar, guardamos uma cópia em resolução maior e
   permitimos ampliar aqui dentro.
=========================================================== */
function DataPagamentoModal({ titulo, valorPadrao, onConfirm, onClose }) {
  const [data, setData] = useState(valorPadrao || dataHojeISO());
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(28,30,34,0.7)" }}>
      <div className="w-full max-w-xs rounded-lg overflow-hidden" style={{ background: "#F4F1E8", border: "1px solid #D9D3C4" }}>
        <div className="flex items-center justify-between px-4 py-3" style={{ background: "#1C1E22" }}>
          <span className="text-white text-sm font-semibold uppercase tracking-wider" style={{ fontFamily: "'Oswald', sans-serif" }}>{titulo}</span>
          <button onClick={onClose} className="text-white/70 hover:text-white"><IconX size={18} /></button>
        </div>
        <div className="p-4 flex flex-col gap-3">
          <Field label="Data do pagamento">
            <input type="date" value={data} onChange={(e) => setData(e.target.value)} autoFocus />
          </Field>
          <button
            onClick={() => onConfirm(data)}
            className="w-full py-2.5 rounded-md font-semibold text-sm text-white"
            style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}
          >
            Confirmar
          </button>
        </div>
      </div>
    </div>
  );
}

function ImageLightbox({ src, onClose }) {
  if (!src) return null;
  const baixar = (e) => {
    e.stopPropagation();
    const a = document.createElement("a");
    a.href = src;
    a.download = `imagem-${dataHojeISO()}.jpg`;
    a.click();
  };
  return (
    <div className="fixed inset-0 z-[60] flex items-center justify-center p-6" style={{ background: "rgba(0,0,0,0.85)" }} onClick={onClose}>
      <img src={src} alt="ampliada" className="max-w-full max-h-full rounded" style={{ objectFit: "contain" }} onClick={(e) => e.stopPropagation()} />
      <button onClick={baixar} className="absolute top-4 right-16 text-white/80 hover:text-white flex items-center gap-1.5 text-xs px-3 py-2 rounded-md" style={{ background: "rgba(255,255,255,0.15)" }}>
        <IconDownload size={16} /> Baixar arquivo
      </button>
      <button onClick={onClose} className="absolute top-4 right-4 text-white/80 hover:text-white"><IconX size={24} /></button>
    </div>
  );
}

// Confere se o arquivo publicado e mais novo que o que esta rodando aqui.
// Se for, avisa e oferece recarregar - resolve o cache teimoso do Safari.
function AvisoVersaoNova() {
  const [nova, setNova] = useState(null);
  useEffect(() => {
    if (!/^https?:/.test(location.protocol)) return;
    const alvo = location.origin + location.pathname;
    fetch(alvo + "?checar=" + Date.now(), { cache: "no-store" })
      .then(r => r.ok ? r.text() : null)
      .then(txt => {
        if (!txt) return;
        const m = txt.match(/APP_VERSION = "(v\d+)"/);
        if (m && m[1] !== APP_VERSION) setNova(m[1]);
      })
      .catch(() => {});
  }, []);
  if (!nova) return null;
  return (
    <div style={{ background: "#B5762A", color: "#fff", padding: "8px 12px",
                  display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap",
                  fontSize: 13, fontFamily: "'Inter', sans-serif" }}>
      <span>Existe uma versão mais nova publicada ({nova}). Você está na {APP_VERSION}.</span>
      <button
        onClick={() => { location.replace(location.origin + location.pathname + "?v=" + nova); }}
        style={{ background: "#1C1E22", color: "#fff", border: 0, borderRadius: 6,
                 padding: "5px 12px", fontWeight: 700, cursor: "pointer" }}>
        Atualizar agora
      </button>
    </div>
  );
}

function RelatorioMotoristaApp({ fretes, custos, creditos, motorista, config }) {
  const meus = motorista === "todos" ? null : motorista;
  const bate = (nome) => !meus || (nome || "") === meus;

  // fila unica: comissao de cada frete + despesa que ele bancou, em ordem de data
  const pendentes = [];
  fretes.forEach(f => {
    if (!bate(f.motorista)) return;
    const item = comissaoComoItem(f);
    const falta = saldoPendenteCusto(item);
    if (falta > 0.004) pendentes.push({
      kind: "comissao", data: f.dataTiquete || "", container: f.numeroContainer || "TBN",
      rotulo: "COMISSÃO", devido: item.valor, pago: valorPagoAcumulado(item), falta
    });
  });
  custos.forEach(c => {
    if (c.pagoPor !== "motorista" || !bate(c.motorista)) return;
    const falta = saldoPendenteCusto(c);
    if (falta > 0.004) {
      const viagem = fretes.find(f => f.id === c.freteId);
      pendentes.push({
        kind: "custo", data: c.data || "", container: viagem ? (viagem.numeroContainer || "TBN") : "—",
        rotulo: (c.tipo || "").toUpperCase() + (c.fornecedor || c.posto ? " · " + (c.fornecedor || c.posto) : ""),
        devido: Number(c.valor) || 0, pago: valorPagoAcumulado(c), falta
      });
    }
  });
  pendentes.sort((a, b) => (a.data || "").localeCompare(b.data || ""));

  // composicao de cada deposito, agrupado pelo comprovante (loteId)
  const lotes = {};
  const guarda = (id, reg) => {
    if (!lotes[id]) lotes[id] = { data: reg.data, total: reg.total, linhas: [] };
    lotes[id].linhas.push(reg);
    if (reg.total) lotes[id].total = reg.total;
  };
  fretes.forEach(f => {
    if (!bate(f.motorista)) return;
    (f.comissaoPagamentos || []).forEach(p => guarda(p.loteId || p.id, {
      tipo: "COMISSÃO", ref: f.numeroContainer || "TBN", det: "frete de " + (f.dataTiquete || ""),
      valor: Number(p.valor) || 0, data: p.data || "", total: Number(p.valorTotalComprovante) || 0
    }));
  });
  custos.forEach(c => {
    if (c.pagoPor !== "motorista" || !bate(c.motorista)) return;
    const viagem = fretes.find(f => f.id === c.freteId);
    (c.pagamentos || []).forEach(p => guarda(p.loteId || p.id, {
      tipo: (c.tipo || "").toUpperCase(), ref: viagem ? (viagem.numeroContainer || "TBN") : "—",
      det: (c.fornecedor || c.posto || "") + " despesa de " + (c.data || ""),
      valor: Number(p.valor) || 0, data: p.data || "", total: Number(p.valorTotalComprovante) || 0
    }));
  });
  const listaLotes = Object.entries(lotes).sort((a, b) => (a[1].data || "").localeCompare(b[1].data || ""));

  const totalPendente = pendentes.reduce((s, p) => s + p.falta, 0);
  let comDev = 0, comPago = 0;
  fretes.forEach(f => {
    if (!bate(f.motorista)) return;
    const it = comissaoComoItem(f);
    comDev += it.valor; comPago += valorPagoAcumulado(it);
  });
  const credito = (creditos || []).filter(c => c.tipo === "motorista").reduce((s, c) => s + (Number(c.valor) || 0), 0);

  const Card = ({ titulo, valor, cor }) => (
    <div className="rounded-lg p-3" style={{ background: "#FFFFFF", border: "1px solid #D9D3C4", minWidth: 150, flex: "1 1 150px" }}>
      <div className="text-[10px] uppercase tracking-wide" style={{ color: "#8A8577" }}>{titulo}</div>
      <div className="text-lg font-semibold" style={{ color: cor, fontFamily: "'JetBrains Mono', monospace" }}>{currency(valor)}</div>
    </div>
  );
  const Th = ({ children, r }) => (
    <th className="px-2 py-1.5 text-[10px] uppercase tracking-wide" style={{ background: "#1C1E22", color: "#F4F1E8", textAlign: r ? "right" : "left" }}>{children}</th>
  );
  const Td = ({ children, r, cor, mono }) => (
    <td className="px-2 py-1.5 text-xs" style={{ borderTop: "1px solid #EDE8DA", textAlign: r ? "right" : "left", color: cor || "#24221D", fontFamily: mono ? "'JetBrains Mono', monospace" : "inherit", whiteSpace: r ? "nowrap" : "normal" }}>{children}</td>
  );

  return (
    <div className="flex flex-col gap-4">
      <div className="flex flex-wrap gap-2">
        <Card titulo="Saldo devedor a ele" valor={totalPendente} cor="#B5473A" />
        <Card titulo="Comissão gerada" valor={comDev} cor="#B5762A" />
        <Card titulo="Comissão paga" valor={comPago} cor="#4C7A5E" />
        <Card titulo="Crédito a favor" valor={credito} cor="#4C7A5E" />
      </div>

      <div>
        <div className="text-sm font-semibold mb-1" style={{ fontFamily: "'Oswald', sans-serif" }}>
          1 · Em aberto, do mais antigo para o mais recente
        </div>
        <div className="text-[11px] mb-1.5" style={{ color: "#8A8577" }}>
          É nesta ordem que o próximo depósito deve ir abatendo.
        </div>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", background: "#fff", border: "1px solid #D9D3C4", minWidth: 520 }}>
            <thead><tr><Th>Data</Th><Th>O que é</Th><Th>Container</Th><Th r>Devido</Th><Th r>Pago</Th><Th r>Falta</Th></tr></thead>
            <tbody>
              {pendentes.length ? pendentes.map((p, i) => (
                <tr key={i}>
                  <Td>{p.data}</Td><Td>{p.rotulo}</Td>
                  <Td mono>{p.container}</Td>
                  <Td r mono>{currency(p.devido)}</Td>
                  <Td r mono cor="#4C7A5E">{currency(p.pago)}</Td>
                  <Td r mono cor="#B5473A">{currency(p.falta)}</Td>
                </tr>
              )) : <tr><Td>Nada em aberto — a conta está zerada.</Td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      <div>
        <div className="text-sm font-semibold mb-1" style={{ fontFamily: "'Oswald', sans-serif" }}>
          2 · Composição de cada depósito
        </div>
        {listaLotes.length ? listaLotes.map(([id, l]) => {
          const soma = l.linhas.reduce((s, x) => s + x.valor, 0);
          const fecha = !l.total || Math.abs(l.total - soma) < 0.02;
          return (
            <div key={id} className="rounded-lg p-2.5 mb-2" style={{ background: "#fff", border: "1px solid #D9D3C4" }}>
              <div className="text-xs mb-1">
                <b style={{ fontFamily: "'JetBrains Mono', monospace", color: "#B5762A" }}>{currency(l.total || soma)}</b>
                {" em " + (l.data || "—")}
                <span style={{ color: fecha ? "#4C7A5E" : "#B5473A", marginLeft: 8 }}>
                  {fecha ? "confere" : "NÃO FECHA"}
                </span>
              </div>
              {l.linhas.map((x, j) => (
                <div key={j} className="flex justify-between text-[11px] py-0.5" style={{ borderTop: "1px solid #EDE8DA" }}>
                  <span>{x.tipo} · <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{x.ref}</span> <span style={{ color: "#8A8577" }}>{x.det}</span></span>
                  <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{currency(x.valor)}</span>
                </div>
              ))}
            </div>
          );
        }) : <div className="text-xs" style={{ color: "#8A8577" }}>Nenhum pagamento registrado ainda.</div>}
      </div>

      <div>
        <div className="text-sm font-semibold mb-1" style={{ fontFamily: "'Oswald', sans-serif" }}>
          3 · Comissão por frete
        </div>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", background: "#fff", border: "1px solid #D9D3C4", minWidth: 520 }}>
            <thead><tr><Th>Data</Th><Th>Container</Th><Th r>Frete</Th><Th r>Comissão</Th><Th r>Paga</Th><Th r>Falta</Th></tr></thead>
            <tbody>
              {fretes.filter(f => bate(f.motorista) && (f.comissaoMotorista || 0) > 0)
                .sort((a, b) => (a.dataTiquete || "").localeCompare(b.dataTiquete || ""))
                .map(f => {
                  const it = comissaoComoItem(f);
                  const pg = valorPagoAcumulado(it);
                  const falta = Math.max(it.valor - pg, 0);
                  return (
                    <tr key={f.id}>
                      <Td>{f.dataTiquete}</Td>
                      <Td mono>{f.numeroContainer || "TBN"}</Td>
                      <Td r mono>{currency(f.valorFrete)}</Td>
                      <Td r mono>{currency(it.valor)}</Td>
                      <Td r mono cor="#4C7A5E">{currency(pg)}</Td>
                      <Td r mono cor={falta > 0.004 ? "#B5473A" : "#8A8577"}>{currency(falta)}</Td>
                    </tr>
                  );
                })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function AbaEntrada({ fretes, custos, onNovoFrete, onNovoCusto, onMarcarRecebido, config }) {
  const [estado, setEstado] = useState("parado");   // parado | buscando | pronto | erro
  const [erro, setErro] = useState("");
  const [itens, setItens] = useState([]);
  const [processados, setProcessados] = useState(() => {
    try { return JSON.parse(localStorage.getItem("gvgs_docs_processados") || "{}"); }
    catch (e) { return {}; }
  });

  const guardarProcessado = (hash, info) => {
    const novo = { ...processados, [hash]: info };
    setProcessados(novo);
    try { localStorage.setItem("gvgs_docs_processados", JSON.stringify(novo)); } catch (e) {}
  };

  const jaExisteNoApp = (it) => {
    const v = Number(it.valor) || 0;
    if (!v || !it.data) return "";
    if (it.categoria === "frete") {
      const c = padronizarContainerApp(it.container);
      const achou = fretes.find(f =>
        (c && padronizarContainerApp(f.numeroContainer) === c && Math.abs((Number(f.valorFrete) || 0) - v) < 0.01) ||
        (f.dataTiquete === it.data && Math.abs((Number(f.valorFrete) || 0) - v) < 0.01));
      if (achou) return `já existe o frete ${achou.numeroContainer || "TBN"} de ${currency(achou.valorFrete)}`;
    }
    if (it.categoria === "despesa") {
      const achou = custos.find(c => c.data === it.data && Math.abs((Number(c.valor) || 0) - v) < 0.01
        && (!it.tipoCusto || c.tipo === it.tipoCusto));
      if (achou) return `já existe um custo de ${achou.tipo} de ${currency(achou.valor)} em ${achou.data}`;
    }
    return "";
  };

  const buscar = async () => {
    setEstado("buscando"); setErro(""); setItens([]);
    try {
      if (!dropboxEstaConectado()) throw new Error("SEM_DROPBOX");
      await dropboxGarantirPastas();
      const arquivos = await dropboxListarEntrada();
      if (!arquivos.length) { setEstado("pronto"); return; }
      const lidos = [];
      for (const a of arquivos) {
        const linha = { nome: a.name, caminho: a.path_lower, estado: "lendo", incluir: true };
        lidos.push(linha);
        setItens([...lidos]);
        try {
          const blob = await dropboxBaixarArquivo(a.path_lower);
          const hash = await hashDoArquivo(blob);
          linha.hash = hash;
          if (hash && processados[hash]) {
            linha.estado = "duplicado";
            linha.aviso = "este arquivo já foi lançado antes";
            linha.incluir = false;
            setItens([...lidos]);
            continue;
          }
          const dataUrl = await blobParaDataUrl(blob);
          linha.thumb = a.name.toLowerCase().endsWith(".pdf") ? null : await resizeImage(dataUrl);
          linha.ehPdf = a.name.toLowerCase().endsWith(".pdf");
          const r = await classificarDocumento(dataUrl);
          linha.categoria = r.categoria || "despesa";
          if (r.tipoDocumento === "comprovante_bancario" && linha.categoria === "despesa") {
            linha.categoria = "pagamento";
          }
          linha.tipoCusto = r.tipoCusto || "combustivel";
          linha.valor = Number(r.valor) || 0;
          linha.data = r.data || "";
          linha.container = padronizarContainerApp(r.numeroContainer || "");
          linha.cteNumero = r.cteNumero || "";
          linha.cliente = r.cliente || config.clientePadrao;
          linha.fornecedor = r.fornecedor || "";
          linha.litros = Number(r.litros) || 0;
          linha.descricao = r.descricao || "";
          linha.pagador = r.pagador || "";
          linha.recebedor = r.recebedor || "";
          linha.aviso = jaExisteNoApp(linha);
          if (linha.aviso) { linha.estado = "duplicado"; linha.incluir = false; }
          else if (linha.categoria === "pagamento") {
            linha.estado = "computador";
            linha.aviso = "pagamento: faça no computador, onde há a tela de rateio";
            linha.incluir = false;
          } else { linha.estado = "pronto"; }
        } catch (e) {
          linha.estado = "erro";
          linha.aviso = e.message === "SEM_CHAVE_API"
            ? "falta a chave da API nas Configurações"
            : "não consegui ler: " + (e.message || "erro");
          linha.incluir = false;
        }
        setItens([...lidos]);
      }
      setEstado("pronto");
    } catch (e) {
      setEstado("erro");
      setErro(
        e.message === "SEM_DROPBOX" ? "Conecte o Dropbox nas Configurações para usar a caixa de entrada."
        : e.message === "SEM_PERMISSAO_LISTAR" ? "O app do Dropbox não tem permissão para LISTAR arquivos. Em dropbox.com/developers/apps, na aba Permissions, marque files.metadata.read, salve, e reconecte o Dropbox aqui nas Configurações."
        : e.message === "SEM_TOKEN" ? "A conexão com o Dropbox expirou. Reconecte nas Configurações."
        : "Não consegui acessar a pasta ENTRADA: " + (e.message || "erro"));
    }
  };

  const lancar = async (i) => {
    const it = itens[i];
    if (!it || !it.valor || !it.data) return;
    const novos = [...itens];
    novos[i] = { ...it, estado: "lancando" };
    setItens(novos);
    try {
      if (it.categoria === "frete") {
        const valor = Number(it.valor) || 0;
        onNovoFrete({
          id: uid(), imagemThumb: it.thumb || null, temAnexoPdf: !!it.ehPdf,
          valorFrete: valor, dataTiquete: it.data,
          comissaoMotorista: Number((valor * PERCENTUAL_COMISSAO).toFixed(2)),
          comissaoPagamentos: [], motorista: config.motoristas[0] || "",
          cteNumero: it.cteNumero || "", cliente: it.cliente || config.clientePadrao,
          caminhao: "", numeroContainer: padronizarContainerApp(it.container),
          observacao: "Lançado pela caixa de entrada (" + it.nome + ")",
          status: "pendente", statusComissao: "pendente", dataPagamento: null,
          dataCriacao: new Date().toISOString(),
          origemArquivo: it.nome, origemHash: it.hash || null
        });
      } else if (it.categoria === "despesa") {
        const alvo = fretes.find(f => padronizarContainerApp(f.numeroContainer) === padronizarContainerApp(it.container));
        onNovoCusto({
          id: uid(), tipo: it.tipoCusto,
          itemPrincipal: it.tipoCusto === "manutencao" ? "Outros" : "",
          fornecedor: it.tipoCusto === "manutencao" ? (it.fornecedor || "") : "",
          valor: Number(it.valor) || 0, litros: Number(it.litros) || 0,
          posto: it.tipoCusto === "combustivel" ? (it.fornecedor || "") : "",
          precoUnitario: null, desconto: 0, precoLiquido: null, quilometragem: null,
          descricao: it.descricao || "", veiculo: "", data: it.data,
          imagemThumb: it.thumb || null, temAnexoPdf: !!it.ehPdf,
          pagoPor: "motorista", motorista: config.motoristas[0] || "",
          statusRessarcimento: "pendente", valorReembolsado: null, statusPagamento: null,
          formaPagamento: null, parcelas: [], pagamentos: [],
          freteId: alvo ? alvo.id : null,
          origemArquivo: it.nome, origemHash: it.hash || null
        });
      } else if (it.categoria === "recebimento") {
        const alvo = fretes.find(f => padronizarContainerApp(f.numeroContainer) === padronizarContainerApp(it.container));
        if (alvo) onMarcarRecebido(alvo.id, it.data);
      }
      if (it.hash) guardarProcessado(it.hash, { nome: it.nome, em: new Date().toISOString(), valor: it.valor });
      await dropboxMoverParaLancados(it.caminho, it.nome);
      const depois = [...itens];
      depois[i] = { ...it, estado: "lancado" };
      setItens(depois);
    } catch (e) {
      const depois = [...itens];
      depois[i] = { ...it, estado: "erro", aviso: "erro ao lançar: " + (e.message || "") };
      setItens(depois);
    }
  };

  const atualizar = (i, campo, valor) => {
    const novos = [...itens];
    novos[i] = { ...novos[i], [campo]: valor };
    setItens(novos);
  };

  const prontos = itens.filter(x => x.estado === "pronto").length;

  return (
    <div className="flex flex-col gap-3">
      <div className="rounded-lg p-3" style={{ background: "#FFFFFF", border: "1px solid #D9D3C4" }}>
        <div className="flex items-center justify-between gap-2 flex-wrap">
          <div>
            <div className="text-sm font-semibold" style={{ fontFamily: "'Oswald', sans-serif" }}>
              Caixa de entrada
            </div>
            <div className="text-xs" style={{ color: "#8A8577" }}>
              Mande as fotos do celular para a pasta <b>ENTRADA</b> dentro de
              <b> Apps/painel-de-bordo-gvgs-alexandre</b> no Dropbox.
            </div>
          </div>
          <button onClick={buscar} disabled={estado === "buscando"}
            className="px-4 py-2 rounded-md text-xs font-semibold uppercase tracking-wide text-white disabled:opacity-50"
            style={{ background: "#4C7A5E", fontFamily: "'Oswald', sans-serif" }}>
            {estado === "buscando" ? "Lendo..." : "Buscar documentos"}
          </button>
        </div>
        {erro && (
          <div className="mt-2 text-xs p-2 rounded" style={{ background: "#F6DCD8", color: "#8C2F24" }}>{erro}</div>
        )}
        {estado === "pronto" && !itens.length && !erro && (
          <div className="mt-2 text-xs" style={{ color: "#8A8577" }}>Nenhum documento novo na ENTRADA.</div>
        )}
        {itens.length > 0 && (
          <div className="mt-2 text-xs" style={{ color: "#4C7A5E" }}>
            {prontos} pronto(s) para lançar de {itens.length} encontrado(s)
          </div>
        )}
      </div>

      {itens.map((it, i) => (
        <div key={it.caminho} className="rounded-lg p-3 flex gap-3"
             style={{ background: "#FFFFFF",
                      border: "1px solid " + (it.estado === "duplicado" ? "#E0A9A0" : "#D9D3C4"),
                      opacity: it.estado === "lancado" ? 0.55 : 1 }}>
          <div style={{ width: 64, minWidth: 64, height: 64, background: "#EDE8DA", borderRadius: 6,
                        overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center" }}>
            {it.thumb ? <img src={it.thumb} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                      : <span className="text-[10px]" style={{ color: "#8A8577" }}>{it.ehPdf ? "PDF" : "..."}</span>}
          </div>
          <div className="flex-1" style={{ minWidth: 0 }}>
            <div className="text-[11px] truncate" style={{ color: "#8A8577" }}>{it.nome}</div>
            {it.estado === "lendo" && <div className="text-xs mt-1">lendo o documento...</div>}
            {it.estado === "lancado" && <div className="text-xs mt-1" style={{ color: "#4C7A5E" }}>lançado ✓</div>}
            {(it.estado === "pronto" || it.estado === "duplicado" || it.estado === "computador") && (
              <>
                <div className="flex flex-wrap gap-1.5 mt-1.5">
                  <select value={it.categoria} onChange={e => atualizar(i, "categoria", e.target.value)}
                          className="px-2 py-1 rounded text-xs" style={inputStyle}>
                    <option value="frete">Frete</option>
                    <option value="despesa">Despesa</option>
                    <option value="pagamento">Pagamento</option>
                    <option value="recebimento">Recebimento</option>
                  </select>
                  {it.categoria === "despesa" && (
                    <select value={it.tipoCusto} onChange={e => atualizar(i, "tipoCusto", e.target.value)}
                            className="px-2 py-1 rounded text-xs" style={inputStyle}>
                      <option value="combustivel">Combustível</option>
                      <option value="pedagio">Pedágio</option>
                      <option value="manutencao">Manutenção</option>
                    </select>
                  )}
                  <input type="date" value={it.data} onChange={e => atualizar(i, "data", e.target.value)}
                         className="px-2 py-1 rounded text-xs" style={inputStyle} />
                  <input type="number" step="0.01" value={it.valor}
                         onChange={e => atualizar(i, "valor", e.target.value)}
                         className="px-2 py-1 rounded text-xs" style={{ ...inputStyle, width: 96 }} />
                  <input type="text" value={it.container} placeholder="container"
                         onChange={e => atualizar(i, "container", e.target.value)}
                         className="px-2 py-1 rounded text-xs" style={{ ...inputStyle, width: 130 }} />
                </div>
                {it.aviso && (
                  <div className="text-[11px] mt-1.5"
                       style={{ color: it.estado === "duplicado" ? "#B5473A" : "#8A6116" }}>
                    {it.estado === "duplicado" ? "POSSÍVEL DUPLICATA — " : ""}{it.aviso}
                  </div>
                )}
                <button onClick={() => lancar(i)} disabled={!it.valor || !it.data}
                  className="mt-2 px-3 py-1.5 rounded text-[11px] font-semibold uppercase text-white disabled:opacity-40"
                  style={{ background: it.estado === "duplicado" ? "#B5473A" : "#B5762A",
                           fontFamily: "'Oswald', sans-serif" }}>
                  {it.estado === "duplicado" ? "Lançar mesmo assim" : "Lançar"}
                </button>
              </>
            )}
            {it.estado === "erro" && (
              <div className="text-[11px] mt-1" style={{ color: "#B5473A" }}>{it.aviso}</div>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

function LoginGate({ children }) {
  const { config, atualizarConfig } = useConfig();
  const [temSenha, setTemSenha] = useState(() => !!localStorage.getItem(LS_KEYS.senhaHash));
  // A senha é opcional. Se não houver senha cadastrada e o primeiro acesso já tiver
  // sido feito, o app abre direto — no celular pedir senha não faz sentido, porque
  // quem protege o dado de verdade é o login do Dropbox.
  const jaConfigurado = () => {
    try {
      return !!localStorage.getItem(LS_KEYS.config)
          || !!localStorage.getItem(LS_KEYS.fretes)
          || !!localStorage.getItem(LS_DROPBOX.refreshToken);
    } catch (e) { return false; }
  };
  const [unlocked, setUnlocked] = useState(() => {
    if (sessionStorage.getItem(SS_UNLOCKED) === "true") return true;
    return !localStorage.getItem(LS_KEYS.senhaHash) && jaConfigurado();
  });
  const [senha, setSenha] = useState("");
  const [confirmarSenha, setConfirmarSenha] = useState("");
  const [nomeEmpresaSetup, setNomeEmpresaSetup] = useState(config.nomeEmpresa);
  const [motoristaSetup, setMotoristaSetup] = useState(config.motoristas[0] || "");
  const [erro, setErro] = useState("");
  const [checando, setChecando] = useState(false);

  if (unlocked) return children;

  const criarSenha = async (e) => {
    e.preventDefault();
    setErro("");
    if (senha && senha.length < 4) { setErro("Use pelo menos 4 caracteres, ou deixe em branco."); return; }
    if (senha !== confirmarSenha) { setErro("As senhas não coincidem."); return; }
    setChecando(true);
    if (senha) {
      const hash = await sha256Hex(senha);
      localStorage.setItem(LS_KEYS.senhaHash, hash);
    } else {
      localStorage.removeItem(LS_KEYS.senhaHash);
    }
    atualizarConfig({
      ...config,
      nomeEmpresa: nomeEmpresaSetup.trim() || DEFAULT_CONFIG.nomeEmpresa,
      motoristas: motoristaSetup.trim() ? [motoristaSetup.trim()] : config.motoristas
    });
    sessionStorage.setItem(SS_UNLOCKED, "true");
    setTemSenha(!!senha);
    setUnlocked(true);
    setChecando(false);
  };

  const entrar = async (e) => {
    e.preventDefault();
    setErro("");
    setChecando(true);
    const hash = await sha256Hex(senha);
    const salvo = localStorage.getItem(LS_KEYS.senhaHash);
    setChecando(false);
    if (hash === salvo) {
      sessionStorage.setItem(SS_UNLOCKED, "true");
      setUnlocked(true);
    } else {
      setErro("Senha incorreta.");
      setSenha("");
    }
  };

  return (
    <div className="min-h-screen w-full flex items-center justify-center p-4" style={{ background: "#1C1E22" }}>
      <div className="w-full max-w-xs rounded-lg overflow-hidden" style={{ background: "#F4F1E8", border: "1px solid #D9D3C4" }}>
        <div className="px-4 py-5 flex flex-col items-center gap-1.5" style={{ background: "#1C1E22" }}>
          <LogoMark size={52} />
          <span className="text-lg tracking-[0.08em] mt-1" style={{ fontFamily: "'Oswald', sans-serif", color: "#F4F1E8", fontWeight: 700 }}>
            PAINEL <span style={{ color: "#E8A33D" }}>DE BORDO</span>
          </span>
          <div className="flex items-center gap-1.5">
            <span style={{ display: "inline-block", width: 12, height: 2, background: "#E8A33D" }} />
            <span className="text-[11px] tracking-[0.2em] uppercase" style={{ fontFamily: "'Oswald', sans-serif", color: "#B9B6AC", fontWeight: 600 }}>{temSenha ? config.nomeEmpresa : (nomeEmpresaSetup || "Sua transportadora")}</span>
          </div>
          <span className="text-white/40 text-[10px] mt-0.5" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{APP_VERSION}</span>
        </div>
        <form onSubmit={temSenha ? entrar : criarSenha} className="p-5 flex flex-col gap-3">
          {!temSenha && (
            <>
              <p className="text-xs" style={{ color: "#8A8577" }}>
                Primeiro acesso: configure a empresa e crie uma senha para proteger o app neste computador. Se você
                esquecer essa senha, a única forma de recuperar o acesso é apagar os dados do navegador para este
                site — o que também apaga os tíquetes e custos salvos, então guarde a senha em um lugar seguro.
              </p>
              <Field label="Nome da transportadora">
                <input type="text" value={nomeEmpresaSetup} onChange={(e) => setNomeEmpresaSetup(e.target.value)} />
              </Field>
              <Field label="Motorista principal (dá pra cadastrar mais depois)">
                <input type="text" value={motoristaSetup} onChange={(e) => setMotoristaSetup(e.target.value)} />
              </Field>
            </>
          )}
          <Field label={temSenha ? "Senha" : "Criar senha"}>
            <input type="password" autoFocus value={senha} onChange={(e) => setSenha(e.target.value)} />
          </Field>
          {!temSenha && (
            <Field label="Confirmar senha">
              <input type="password" value={confirmarSenha} onChange={(e) => setConfirmarSenha(e.target.value)} />
            </Field>
          )}
          {erro && <div className="flex items-center gap-1.5 text-xs" style={{ color: "#B5473A" }}><IconAlert size={13} />{erro}</div>}
          <button type="submit" disabled={checando} className="py-2.5 rounded-md font-semibold text-sm text-white disabled:opacity-50"
                  style={{ background: "#B5762A", fontFamily: "'Oswald', sans-serif" }}>
            {temSenha ? "Entrar" : (senha ? "Criar senha e entrar" : "Entrar sem senha")}
          </button>
        </form>
      </div>
    </div>
  );
}

   APP PRINCIPAL
